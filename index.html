      var a3 = -Math.PI / 2 + (2 * Math.PI / n) * i;
      var v = (vals[i] == null ? 50 : vals[i]) / 100;
      var x3 = cx + r * v * Math.cos(a3), y3 = cy + r * v * Math.sin(a3);
      i ? ctx.lineTo(x3, y3) : ctx.moveTo(x3, y3);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(59,79,134,.14)'; ctx.fill();
    ctx.strokeStyle = 'rgba(59,79,134,.8)'; ctx.lineWidth = 2; ctx.stroke();
    for (i = 0; i < n; i++){
      var a4 = -Math.PI / 2 + (2 * Math.PI / n) * i;
      var v2 = (vals[i] == null ? 50 : vals[i]) / 100;
      var x4 = cx + r * v2 * Math.cos(a4), y4 = cy + r * v2 * Math.sin(a4);
      ctx.beginPath(); ctx.arc(x4, y4, 4, 0, 6.284);
      ctx.fillStyle = touched[i] ? PAL.ok : PAL.ink3; ctx.fill();
    }
    ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (i = 0; i < n; i++){
      var a5 = -Math.PI / 2 + (2 * Math.PI / n) * i;
      var lx = cx + (r + 30) * Math.cos(a5), ly = cy + (r + 30) * Math.sin(a5);
      ctx.fillStyle = touched[i] ? PAL.ink2 : PAL.ink3;
      ctx.fillText(labels[i], lx, ly - 6);
      ctx.fillStyle = touched[i] ? PAL.ok : PAL.ink4;
      ctx.font = 'bold 10px ui-monospace,monospace';
      ctx.fillText(touched[i] ? String(vals[i]) : '—', lx, ly + 6);
      ctx.font = '10px sans-serif';
    }
  }
  return { bars: contribBars, trend: trend, curve: curve, radar: radar, dpr: dpr, tone: tone };
})();
</script>
<script>
/* ============================================================
   SECTION: utils + report renderer (v6 结果窗口)
   ============================================================ */
var UI = (function(){
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; });
  }
  function n2(v, d, u){ return Analyzer.has(v) ? Number(v).toFixed(d) + (u || '') : '—'; }
  function tone(v, th){ return v >= th ? 'dg' : v >= th * 0.68 ? 'wn' : 'ok'; }
  function toneName(v, th){ return v >= th ? 'danger' : v >= th * 0.68 ? 'warn' : 'ok'; }

  /* ---------- 报告分段定义 ---------- */
  var SECTIONS = [
    { id:'verdict',   t:'判定结论',   s:'两轴 + 池 + 置信' },
    { id:'axes',      t:'两轴分离',   s:'高压 / 低爆' },
    { id:'drivers',   t:'定向归因',   s:'谁在推高结论' },
    { id:'targets',   t:'解锁目标',   s:'降档所需最小改动' },
    { id:'modes',     t:'三模式定向', s:'爆率池隔离' },
    { id:'drop',      t:'爆率合成',   s:'五系数 + 闸门' },
    { id:'data',      t:'数据与衍生', s:'录入口径全表' },
    { id:'trust',     t:'可信度校验', s:'口径 / 稳健度' },
    { id:'disputes',  t:'来源冲突',   s:'取值与理由' },
    { id:'advice',    t:'风险与建议', s:'定向动作' }
  ];

  /* ---------- 各段渲染 ---------- */
  function secVerdict(r, d){
    var th = r.thresholds.hi;
    var toneCls = r.poolTone === 'danger' ? 'sev-danger' : r.poolTone === 'warn' ? 'sev-warn' : r.poolTone === 'info' ? 'sev-info' : 'sev-ok';
    var h = [];
    h.push('<div class="verdict ' + toneCls + '">');
    h.push('<div class="vt">判定结论 · VERDICT</div>');
    h.push('<div class="vh"><span class="vk">' + esc(r.verdict) + '</span>');
    h.push('<span class="b ' + (r.poolTone === 'danger' ? 'danger' : r.poolTone === 'warn' ? 'warn' : r.poolTone === 'info' ? 'info' : 'ok') + '">综合 ' + r.composite + ' / 阈值 ' + th.toFixed(0) + '</span>');
    h.push('<span class="b mute">置信 ' + Math.round(r.trust * 100) + '%</span>');
    if (r.obsRisk) h.push('<span class="b danger">观察局风险</span>');
    h.push('</div>');
    h.push('<div class="vp">匹配池：' + esc(r.pool) + ' ｜ 对局标签：<b>' + esc(r.label.name) + '</b></div>');
    h.push('<div class="vbadges">');
    h.push('<span class="b ' + toneName(r.pressure, th) + '">高压轴 ' + r.pressure + '</span>');
    h.push('<span class="b ' + toneName(r.suppress, th) + '">低爆轴 ' + r.suppress + '</span>');
    h.push('<span class="b ' + (r.triggers.length ? 'warn' : 'mute') + '">硬触发 ' + r.triggers.length + ' 项</span>');
    h.push('<span class="b ' + (r.coverage >= 0.8 ? 'ok' : r.coverage >= 0.6 ? 'info' : 'warn') + '">覆盖率 ' + Math.round(r.coverage * 100) + '%</span>');
    h.push('<span class="b ' + (r.dimCalibratedCount >= 4 ? 'ok' : 'mute') + '">五维标定 ' + r.dimCalibratedCount + '/5</span>');
    /* 赛季基准：本报告的全部阈值只在 S12 窗口内成立 */
    if (r.seasonBasis){
      h.push('<span class="b ' + (r.seasonBasis.ok ? 'info' : 'danger') + '">' + esc(r.seasonBasis.label) + '</span>');
      if (!r.seasonBasis.ok) h.push('<span class="b danger">口径已过期</span>');
    }
    h.push('</div>');
    var hl = r.headline ? r.headline.text : r.verdict;
    h.push('<div class="vsum"><b>一句话结论：</b>' + esc(hl) + '。<br>' + esc(r.label.eff) + '</div>');
    if (r.seasonBasis && !r.seasonBasis.ok){
      h.push('<div class="line-item risk">' + esc(r.seasonBasis.reason) + '，本结论不再代表当前赛季，请核对版本后重新分析。</div>');
    }
    h.push('</div>');
    return h.join('');
  }

  function secAxes(r){
    var th = r.thresholds.hi, mid = r.thresholds.mid;
    function bar(title, val, mean, cons, note, extraNote){
      var t = toneName(val, th);
      var h = [];
      h.push('<div class="axis">');
      h.push('<div class="axis-hd"><span class="t">' + title + '</span><span class="n ' + t + '">' + val + '<small>/100</small></span></div>');
      h.push('<div class="axis-track"><i class="' + t + '" style="width:' + Math.max(2, Math.min(100, val)) + '%;background:' + (t === 'dg' || val >= th ? PAL.danger : val >= mid ? PAL.warn : PAL.ok) + '"></i>' +
             '<span class="th" style="left:' + th + '%" data-l="阈值' + Math.round(th) + '"></span>' +
             '<span class="th" style="left:' + mid + '%;background:rgba(138,90,18,.45)" data-l="边缘' + Math.round(mid) + '"></span></div>');
      h.push('<div class="note">' + note + '</div>');
      if (extraNote) h.push('<div class="note">' + extraNote + '</div>');
      h.push('</div>');
      return h.join('');
    }
    var out = [];
    out.push(bar('高压轴 · 对手与人机强度', r.pressure, r.axP.mean, r.axP.consensus,
      '驱动项：' + esc(topNames(r.attrP)),
      r.axP.floored ? '已触发「极端单项托底」：某单项 ≥75，其余正常项不能把它平均掉。' : ''));
    out.push(bar('低爆轴 · 爆率与收益压制', r.suppress, r.axD.mean, r.axD.consensus,
      '驱动项：' + esc(topNames(r.attrD)),
      r.axD.floored ? '已触发「极端单项托底」：某单项 ≥75，其余正常项不能把它平均掉。' : ''));
    var co = r.co;
    out.push('<div class="hint">搜·打·撤三维同向偏离：<b>' + esc(co.state) + '</b>' +
      (co.boost ? '（对两轴合计 ' + (co.boost > 0 ? '+' : '') + Math.round(co.boost) + ' 分）' : '') +
      '；均值 ' + (Analyzer.has(co.mean) ? co.mean.toFixed(0) : '—') + '，极差 ' + (Analyzer.has(co.spread) ? co.spread.toFixed(0) : '—') +
      '。来源明示「低爆率与高对局强度并非必然同时出现」，故两轴独立计分，同时越线才判双重黑屋。</div>');
    if (r.triggers.length){
      out.push('<div class="mini-hd" style="margin-top:14px">硬触发项<span class="q">来源表述为充分条件，直接计入加分</span></div>');
      r.triggers.forEach(function(t){ out.push('<div class="line-item risk">' + esc(t) + '</div>'); });
    }
    return '<div class="axes">' + out.slice(0, 2).join('') + '</div>' + out.slice(2).join('');
  }

  function drvList(arr, th){
    var h = [];
    arr.slice(0, 6).forEach(function(x, i){
      var pct = Math.max(2, Math.min(100, x.val));
      var col = x.val >= th ? PAL.danger : x.val >= th * 0.68 ? PAL.warn : PAL.ok;
      h.push('<div class="drv ' + (i === 0 ? 't1' : i === 1 ? 't2' : '') + '">' +
        '<span class="rk">' + (i + 1) + '</span>' +
        '<span class="nm">' + esc(x.name) + '</span>' +
        '<span class="bar"><i style="width:' + pct + '%;background:col"></i></span>' +
        '<span class="vv">' + Math.round(x.val) + '</span>' +
        '<span class="lb">拉回最优档 −' + Math.round(x.lift) + ' ｜ 权重 ' + Math.round(x.w * 100) + '%</span>' +
        '</div>');
    });
    if (!h.length) h.push('<div class="hint">该项数据未填写或五维未标定，无归因可算。</div>');
    return h.join('');
  }
  function secDrivers(r){
    var th = r.thresholds.hi, h = [];
    h.push('<div class="mini-hd">高压轴 TOP<span class="q">按「拉回最优档可降多少分」排序</span></div>');
    h.push(drvList(r.attrP, th));
    h.push('<div class="mini-hd" style="margin-top:16px">低爆轴 TOP</div>');
    h.push(drvList(r.attrD, th));
    h.push('<div class="mini-hd" style="margin-top:16px">轴内分值与权重<span class="q">虚线为轴阈值</span></div>');
    h.push('<div class="chart-box"><canvas id="barChart"></canvas></div>');
    h.push('<div class="chart-lg"><span><i style="background:' + PAL.info + '"></i>高压轴因子</span><span><i style="background:' + PAL.ink + '"></i>低爆轴因子</span><span><i style="background:' + PAL.danger + '"></i>阈值线</span></div>');
    return h.join('');
  }

  function secTargets(r){
    var h = [];
    if (!r.targets || !r.targets.length){
      h.push('<div class="line-item tip">无需降档操作：当前判定不处于黑屋/边缘档，或已处于最健康区间。维持 KD 0.5–1、撤离率 25%–33%、收益效率 ≤4.5 M/h 即可。</div>');
      return h.join('');
    }
    if (r.targetsNone){
      h.push('<div class="line-item risk"><b>没有任何单一变量能把判定拉出当前档位</b>——多项同时越线，属画像级问题而非单点数据问题。下面列出各单项的极限效果，供组合调整时排序参考。</div>');
    } else {
      h.push('<div class="hint">以下方案均为「只改这一项、其余保持不变」的二分搜索结果，按所需改动幅度升序排列。真实操作只需选一条最可执行的。</div>');
    }
    h.push('<div class="hint">想边拖边看？点每行右侧「模拟」到<b>爆率模拟</b>页试验——那里只操作快照副本，不会改动本页录入值，也不会写入历史记录。</div>');
    h.push('<div class="tbl-wrap"><table class="tbl wide"><thead><tr><th>变量</th><th>当前</th><th>目标</th><th>变动</th><th>综合分变化</th><th class="last">试验</th></tr></thead><tbody>');
    r.targets.forEach(function(t){
      var arrow = t.dir === 'up' ? '↑' : '↓';
      h.push('<tr><td>' + esc(t.name) + (t.partial ? ' <span class="b mute">极限</span>' : '') + '</td>' +
        '<td class="n">' + t.from.toFixed(t.fmt) + esc(t.unit || '') + '</td>' +
        '<td class="n ' + (t.dir === 'up' ? 'wn' : 'ok') + '">' + t.to.toFixed(t.fmt) + esc(t.unit || '') + ' ' + arrow + '</td>' +
        '<td class="n">' + (t.rel >= 1 ? Math.round(t.rel * 100) + '%' : Math.round(t.rel * 100) + '%') + '</td>' +
        '<td class="n ok">−' + Math.round(t.gain) + ' → ' + Math.round(t.toComposite) + '</td>' +
        '<td class="last">' + (t.key ? '<button class="btn tiny" type="button" data-sim="' + esc(t.key) + '" data-simto="' + t.to.toFixed(t.fmt) + '">模拟</button>' : '—') + '</td></tr>');
      if (t.note) h.push('<tr><td colspan="6" style="color:' + PAL.ink3 + ';font-size:.7rem;padding-top:0">' + esc(t.note) + '</td></tr>');
    });
    h.push('</tbody></table></div>');
    if (r.targets && r.targets.length && r.targetsNone)
      h.push('<div class="hint">组合调整通常优先顺序：拉长单局时长 → 降低收益效率（高价物资上架交易行而非即时领取） → 减少击杀与爆头 → 降入场战备档位。</div>');
    return h.join('');
  }

  function secModes(r){
    var h = ['<div class="modes">'];
    r.modes.forEach(function(m){
      h.push('<div class="mode' + (m.isMain ? ' cur' : '') + '">');
      h.push('<div class="mn">' + esc(m.name) + '池' + (m.isMain ? '<span class="cur-tag">主模式</span>' : '') + '</div>');
      h.push('<div class="mrow"><span>判定</span><b class="' + (m.tone === 'danger' ? 'dg' : m.tone === 'warn' ? 'wn' : m.tone === 'info' ? 'if' : 'ok') + '">' + esc(m.verdict) + '</b></div>');
      h.push('<div class="mrow"><span>综合分</span><b>' + m.composite + '</b></div>');
      h.push('<div class="mrow"><span>高压 / 低爆</span><b>' + m.pressure + ' / ' + m.suppress + '</b></div>');
      h.push('<div class="mrow"><span>该池 KD 口径</span><b>' + n2(m.kd, 2, '') + '</b></div>');
      h.push('<div class="mrow"><span>合成爆率系数</span><b>' + m.mult.toFixed(2) + '×</b></div>');
      h.push('<div class="mrow"><span>红品</span><b class="' + (m.capped ? 'wn' : '') + '">' + m.redR.toFixed(3) + '%' + (m.capped ? '（触顶）' : '') + '</b></div>');
      h.push('<div class="mrow"><span>金品</span><b>' + m.goldR.toFixed(2) + '%</b></div>');
      h.push('</div>');
    });
    h.push('</div>');
    h.push('<div class="hint">三模式的爆率池与每日额度<b>完全隔离</b>：同一账号在机密池被压爆率，不代表绝密池同样被压；反之亦然。体感差异往往先出现在池切换上，而不是账号被整体处理。各池 KD 取对应模式填写值，普通池沿用机密 KD。</div>');
    return h.join('');
  }

  function secDrop(r){
    var dr = r.drop, rows = [
      ['① 账号基础系数', '40%', '×' + r.fbase.mult.toFixed(2), 'F_base ' + r.fbase.value.toFixed(2) + '（' + r.fbase.tier + '）', r.fbase.mult >= 1.2 ? 'ok' : r.fbase.mult < 0.9 ? 'dg' : ''],
      ['② 当局表现系数', '35%', '×' + r.raid.value.toFixed(2), r.raid.items.join('；') || '无明显加扣分项', r.raid.value >= 1.2 ? 'ok' : r.raid.value < 0.9 ? 'dg' : ''],
      ['③ 战损补偿系数', '15%', '×' + r.loss.value.toFixed(2), r.loss.note, r.loss.value >= 1.2 ? 'ok' : r.loss.value < 1 ? 'wn' : ''],
      ['④ 特殊事件系数', '3%', '×' + r.event.value.toFixed(2), r.event.note, ''],
      ['＝ 四系数加权核心', '—', '×' + dr.core.toFixed(2), '归一至 0.93', ''],
      ['⑤ 收益额度闸门', '乘法', '×' + r.quota.value.toFixed(2), r.quota.note, r.quota.value < 0.8 ? 'dg' : r.quota.value < 1 ? 'wn' : ''],
      ['⑥ 对局标签闸门', '乘法', '×' + ({ '猛攻攻坚':1.08, '潜行跑刀':0.72, '消极型':0.66, '数据异常/神人局倾向':0.90 }[r.label.name] || 1).toFixed(2), r.label.name, r.label.tone === 'danger' ? 'dg' : r.label.tone === 'warn' ? 'wn' : ''],
      ['⑦ 组队连坐闸门', '乘法', '×' + r.squad.mult.toFixed(2), ({ solo:'单排，无连坐', duo:'双排按队内最高分匹配', trio:'三排按队内最高分匹配 + 全局爆率 −18%', mixed:'单排/组排混打' })[document.getElementById('squadType') ? document.getElementById('squadType').value : 'solo'], r.squad.mult < 0.9 ? 'wn' : ''],
      ['＝ 合成爆率系数', '—', '×' + dr.finalMult.toFixed(2), dr.finalMult >= 1.35 ? '爆率显著提升' : dr.finalMult >= 1.05 ? '略高于基准' : dr.finalMult >= 0.8 ? '接近基准' : dr.finalMult >= 0.5 ? '降低 20%-40%' : '压制 70% 以上', dr.finalMult < 0.8 ? 'dg' : dr.finalMult >= 1.05 ? 'ok' : ''],
      ['模式基础爆率', '—', '红 ' + dr.mode.red + '% / 金 ' + dr.mode.gold + '%', r.mode.name + '模式；三池独立', ''],
      ['单局硬上限', '—', '红 3.2% / 金 12%', '超出部分按上限截断', ''],
      ['炫彩品质', '—', '未建模', 'S12 新增，官方未公示掉率', 'wn']
    ];
    var h = ['<div class="tbl-wrap"><table class="tbl wide"><thead><tr><th>系数项</th><th>权重</th><th>取值</th><th class="last">本次判定依据</th></tr></thead><tbody>'];
    rows.forEach(function(x){
      h.push('<tr><td>' + esc(x[0]) + '</td><td class="n">' + esc(x[1]) + '</td><td class="n ' + (x[4] || '') + '">' + esc(x[2]) + '</td><td class="last concl">' + esc(x[3]) + '</td></tr>');
    });
    h.push('</tbody></table></div>');
    h.push('<div class="kpis" style="margin-top:12px">' +
      kpi('个人红品爆率', dr.red.toFixed(3), '%', dr.finalMult < 0.8 ? 'dg' : dr.finalMult >= 1.05 ? 'ok' : 'mute') +
      kpi('个人金品爆率', dr.gold.toFixed(2), '%', dr.finalMult < 0.8 ? 'dg' : dr.finalMult >= 1.05 ? 'ok' : 'mute') +
      kpi('模式基准红品', dr.mode.red, '%', 'mute') +
      kpi('合成系数', dr.finalMult.toFixed(2), '×', dr.finalMult < 0.8 ? 'dg' : dr.finalMult >= 1.05 ? 'ok' : 'mute') +
      '</div>');
    h.push('<div class="hint">' + (dr.redCapped || dr.goldCapped ? '已触发单局硬上限截断（红 3.2%／金 12%），实际提升不会无限叠加。' : '未触及单局硬上限，数值可直接与体感出货频率对照。') + ' 注意：这是<b>期望值</b>，红品 0.35% 下连续 200 局不出红的概率接近 50%，短样本不构成证据。</div>');
    return h.join('');
  }
  function kpi(k, v, u, cls){
    return '<div class="kpi"><div class="k">' + esc(k) + '</div><div class="v ' + (cls || '') + '">' + esc(String(v)) + (u ? '<span class="u">' + esc(u) + '</span>' : '') + '</div></div>';
  }

  function secData(r, d){
    var dv = r.derived, F = r.F, H = Analyzer.has;
    function tag(x, ax){ return x ? Math.round(ax === 'p' ? x.p : x.d) + '/100 · ' + x.label : ''; }
    var rows = [
      ['主要作战模式', r.mode.name, '', 1],
      ['赛季阶段 / 组队', ({early:'赛季初',mid:'赛季中',late:'赛季末'})[d.seasonPhase] + ' / ' + ({solo:'单排',duo:'双排',trio:'三排',mixed:'混打'})[d.squadType], '', 1],
      ['赚损比（面板口径）', n2(d.profitRatio, 2, ' M'), tag(F.profit, 'd'), 0],
      ['　└ 按失败场次推算', n2(dv.prCheck, 2, ' M'), '', 0],
      ['带出 / 累计报酬', n2(d.extractValue, 1, ' M') + ' / ' + n2(d.totalReward, 1, ' M'), '', 0],
      ['战局数 / 时长', (H(d.totalGames) ? d.totalGames + ' 局' : '—') + ' / ' + (H(d.playTime) ? d.playTime + ' 分' : '—'), '', 0],
      ['收益效率系数', n2(dv.yieldMh, 2, ' M/h'), tag(F.yld, 'd'), 0],
      ['平均每局时长', n2(dv.avgTime, 1, ' 分钟'), tag(F.time, 'd'), 0],
      ['机密战损比', n2(d.kdSecret, 2, ''), '', 0],
      ['绝密战损比', n2(d.kdTopSecret, 2, ''), '', 0],
      ['主模式战损比', n2(dv.kdMain, 2, ''), tag(F.kd, 'p'), 0],
      ['命中率', n2(d.hitRate, 1, ' %'), tag(F.hit, 'p'), 0],
      ['精准击败率', n2(d.precisionRate, 1, ' %'), tag(F.prec, 'p'), 0],
      ['撤离率', n2(d.evacRate, 1, ' %'), tag(F.evac, 'd'), 0],
      ['平均入场战备', n2(d.gearValue, 0, ' 万'), tag(F.gear, 'p'), 0],
      ['合作分（救助/带出队友）', F.coop ? F.coop.level : '未填', F.coop ? F.coop.label : '', 0],
      ['五维 · 战斗', H(r.D.combat) ? r.D.combat + '（已标定）' : '未标定', tag(F.combat, 'p'), 0],
      ['五维 · 搜索', H(r.D.search) ? r.D.search + '（已标定）' : '未标定', tag(F.search, 'd'), 0],
      ['五维 · 生存', H(r.D.survival) ? r.D.survival + '（已标定）' : '未标定', tag(F.surv, 'p'), 0],
      ['五维 · 财富', H(r.D.wealth) ? r.D.wealth + '（已标定）' : '未标定', tag(F.wealth, 'd'), 0],
      ['五维 · 合作', H(r.D.coop) ? r.D.coop + '（已标定）' : '未标定', '', 0],
      ['反推战斗分（场均击杀）', dv.combatEst ? dv.combatEst.est + '（场均 ' + dv.combatEst.kpg.toFixed(2) + ' 杀）' : '—',
        dv.combatEst && H(r.D.combat) ? '与标定值相差 ' + Math.abs(dv.combatEst.est - r.D.combat).toFixed(0) + ' 分' : '缺 KD 或撤离率', 0]
    ];
    var h = ['<div class="kpis" style="margin-bottom:12px">' +
      kpi('每局时长', n2(dv.avgTime, 1), '分', 'mute') +
      kpi('收益效率', n2(dv.yieldMh, 2), 'M/h', dv.yieldMh > 6 ? 'dg' : dv.yieldMh > 4.5 ? 'wn' : 'ok') +
      kpi('场均带出', n2(dv.perGameM, 2), 'M', dv.perGameM > 6 ? 'dg' : 'mute') +
      kpi('F_base', r.fbase.value.toFixed(2), '', r.fbase.value < 0.5 ? 'dg' : r.fbase.value >= 1.5 ? 'ok' : 'mute') +
      kpi('高压轴', r.pressure, '', r.pressure >= r.thresholds.hi ? 'dg' : r.pressure >= r.thresholds.mid ? 'wn' : 'ok') +
      kpi('低爆轴', r.suppress, '', r.suppress >= r.thresholds.hi ? 'dg' : r.suppress >= r.thresholds.mid ? 'wn' : 'ok') +
      kpi('样本量', dv.n || '—', '局', dv.n >= 100 ? 'ok' : 'wn') +
      kpi('输入覆盖率', Math.round(r.coverage * 100), '%', r.coverage >= 0.8 ? 'ok' : 'wn') +
      '</div>'];
    h.push('<div class="tbl-wrap"><table class="tbl wide"><thead><tr><th>指标</th><th>数值</th><th class="last">该项结论（轴内分）</th></tr></thead><tbody>');
    rows.forEach(function(x){
      var cls = x[3] ? ' class="sec-row"' : '';
      h.push('<tr' + (x[3] ? ' data-secrow="1"' : '') + '><td>' + esc(x[0]) + '</td><td class="n">' + esc(x[1]) + '</td><td class="last concl">' + esc(x[2]) + '</td></tr>');
    });
    h.push('</tbody></table></div>');
    return h.join('');
  }

  function secTrust(r){
    var h = [];
    (r.trust_notes || []).forEach(function(t){
      h.push('<div class="line-item ' + (t.lv === 'ok' ? 'tip' : t.lv === 'warn' ? 'risk' : 'info') + '">' + esc(t.text) + '</div>');
    });
    (r.checks || []).forEach(function(t){
      h.push('<div class="line-item ' + (t.lv === 'ok' ? 'tip' : 'info') + '">' + esc(t.text) + '</div>');
    });
    if (r.feelNote) h.push('<div class="line-item disp">' + esc(r.feelNote) + '</div>');
    return h.join('');
  }

  function secDisputes(list){
    var h = [];
    list.forEach(function(x){
      h.push('<div class="line-item disp"><b>' + esc(x.topic) + '</b><br>分歧：' + esc(x.values) + '<br>取值：<b>' + esc(x.taken) + '</b> — ' + esc(x.why) + '</div>');
    });
    return h.join('');
  }

  function secAdvice(r){
    var h = [];
    if (!r.advices.risks.length) h.push('<div class="line-item tip">未命中明显高风险特征，当前画像接近本版本的爆率最优区间。</div>');
    r.advices.risks.forEach(function(x){ h.push('<div class="line-item risk">' + x + '</div>'); });
    h.push('<div class="mini-hd" style="margin-top:14px">可执行建议<span class="q">按当前判定定向生成</span></div>');
    r.advices.tips.forEach(function(x){ h.push('<div class="line-item tip">' + x + '</div>'); });
    return h.join('');
  }

  function topNames(arr){
    var a = arr.filter(function(x){ return x.lift > 2; }).slice(0, 3);
    if (!a.length) return arr.length ? arr[0].name + '(' + Math.round(arr[0].val) + ')' : '无有效因子';
    return a.map(function(x){ return x.name + '(' + Math.round(x.val) + '/−' + Math.round(x.lift) + ')'; }).join('、');
  }

  /* ---------- 组装并打开 ---------- */
  var last = { html:'', title:'', meta:'' };
  function render(data, r, meta){
    var body = document.getElementById('sheetBody');
    var anchors = document.getElementById('sheetAnchors');
    var parts = [];
    var built = {
      verdict: secVerdict(r, data), axes: secAxes(r), drivers: secDrivers(r),
      targets: secTargets(r), modes: secModes(r), drop: secDrop(r),
      data: secData(r, data), trust: secTrust(r), disputes: secDisputes(Analyzer.DISPUTES),
      advice: secAdvice(r)
    };
    var OPEN = { verdict:1, axes:1, drivers:1, targets:1, advice:1 };
    var ah = [];
    SECTIONS.forEach(function(s){
      ah.push('<button type="button" data-sec="' + s.id + '"' + (OPEN[s.id] ? ' class="on"' : '') + '>' + esc(s.t) + '</button>');
      parts.push('<div class="sec' + (OPEN[s.id] ? ' open' : '') + '" id="sec-' + s.id + '" data-sec="' + s.id + '">' +
        '<div class="sec-hd" role="button" tabindex="0"><span class="st">' + esc(SECTION_MARK[s.id] || '·') + '</span><h3>' + esc(s.t) + '</h3>' +
        '<span class="sub">' + esc(s.s) + '</span>' +
        '<svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></div>' +
        '<div class="sec-bd">' + built[s.id] + '</div></div>');
    });
    anchors.innerHTML = ah.join('');
    body.innerHTML = parts.join('');
    body.scrollTop = 0;
    document.getElementById('sheetMeta').textContent = meta || '';
    last.html = body.textContent.replace(/\s+/g, ' ').trim();
    last.title = r.verdict;
    // 画布延到下一帧绘制，避免与 DOM 写入抢主线程
    requestAnimationFrame(function(){
      try { Charts.bars(document.getElementById('barChart'), r.chart, r.thresholds.hi); } catch(e){}
    });
  }
  var SECTION_MARK = { verdict:'定', axes:'轴', drivers:'因', targets:'解', modes:'模', drop:'爆', data:'数', trust:'信', disputes:'冲', advice:'建' };

  /* 纯文本报告（复制用） */
  function plainText(data, r){
    var dv = r.derived, L = [];
    L.push('三角洲行动 · 黑屋匹配推测（v8.6 / 引擎 ' + r.version + ' / ' + (r.seasonBasis ? r.seasonBasis.label : 'S12') + '）');
    L.push('时间：' + new Date().toLocaleString('zh-CN'));
    L.push('判定：' + r.verdict + '｜匹配池：' + r.pool);
    L.push('综合 ' + r.composite + '（阈值 ' + r.thresholds.hi.toFixed(0) + '，边缘 ' + r.thresholds.mid.toFixed(0) + '）｜高压轴 ' + r.pressure + '｜低爆轴 ' + r.suppress);
    L.push('置信 ' + Math.round(r.trust*100) + '%（覆盖率 ' + Math.round(r.coverage*100) + '%，样本 ' + dv.n + ' 局，五维标定 ' + r.dimCalibratedCount + '/5）');
    L.push('对局标签：' + r.label.name);
    if (r.headline) L.push('一句话：' + r.headline.text);
    L.push('');
    L.push('【模式定向】');
    r.modes.forEach(function(m){ L.push('  ' + m.name + '：' + m.verdict + '，综合 ' + m.composite + '（高 ' + m.pressure + '/低 ' + m.suppress + '），红品 ' + m.redR.toFixed(3) + '%，系数 ' + m.mult.toFixed(2) + '×'); });
    L.push('');
    L.push('【归因 TOP】');
    L.push('  高压轴：' + r.attrP.slice(0,4).map(function(x){ return x.name + ' ' + Math.round(x.val) + '（拉回最优档 −' + Math.round(x.lift) + '）'; }).join('；'));
    L.push('  低爆轴：' + r.attrD.slice(0,4).map(function(x){ return x.name + ' ' + Math.round(x.val) + '（拉回最优档 −' + Math.round(x.lift) + '）'; }).join('；'));
    if (r.targets.length){
      L.push('');
      L.push('【单变量降档】' + (r.targetsNone ? '（无单项可降档，以下为极限效果）' : ''));
      r.targets.forEach(function(t){ L.push('  ' + t.name + '：' + t.from.toFixed(t.fmt) + (t.unit||'') + ' → ' + t.to.toFixed(t.fmt) + (t.unit||'') + '，综合分 −' + Math.round(t.gain)); });
    }
    L.push('');
    L.push('【爆率合成】F_base ' + r.fbase.value.toFixed(2) + '（' + r.fbase.tier + '）；当局 ' + r.raid.value.toFixed(2) + '；战损 ' + r.loss.value.toFixed(2) + '；事件 ' + r.event.value.toFixed(2) + '；额度闸门 ' + r.quota.value.toFixed(2) + '；标签闸门 ×' + r.drop.finalMult.toFixed(2) + ' 合成；预估红品 ' + r.drop.red.toFixed(3) + '%／金品 ' + r.drop.gold.toFixed(2) + '%');
    if (r.triggers.length){ L.push(''); L.push('【硬触发】'); r.triggers.forEach(function(t){ L.push('  · ' + t); }); }
    if (r.stability){ L.push(''); L.push('【稳健度】' + r.stability.grade + '，±8% 扰动重算 ' + r.stability.N + ' 次，95% 区间 [' + r.stability.lo.toFixed(0) + ',' + r.stability.hi.toFixed(0) + ']，翻转率 ' + Math.round(r.stability.flipRate*100) + '%'); }
    L.push('');
    L.push('【风险】');
    r.advices.risks.forEach(function(x){ L.push('  · ' + x.replace(/<[^>]+>/g, '')); });
    L.push('【建议】');
    r.advices.tips.forEach(function(x){ L.push('  · ' + x.replace(/<[^>]+>/g, '')); });
    L.push('');
    L.push('注：本工具为社区推测性质，阈值全部来自社区实测与第三方拆解，不代表官方判定。');
    return L.join('\n');
  }

  return { esc: esc, render: render, plainText: plainText, SECTIONS: SECTIONS, last: function(){ return last; } };
})();
</script>
<script>
/* ============================================================
   SECTION: history store
   ============================================================ */
var History = (function(){
  /* 键名用运行期拼接，避免任何非 ASCII 字符混入。
     v8.6 起历史记录写入新键 delta_blackroom_history_v86；
     OLD_KEYS 同时兼容 v8.5 / v8.4 及更早版本（v85/v6/v3 与含省略号字符的旧键），
     首次加载自动把旧记录按 id 去重合并进新键（新键已有记录时也合并），
     旧键原样保留作备份，保证同设备升级、以及「旧版导出 JSON → 新版导入」都不丢历史。 */
  var KEY = ['delta','blackroom','history','v86'].join('_');
  var MIGRATED_KEY = ['delta','blackroom','history','migrated','v86'].join('_');
  var ELL = String.fromCharCode(0x2026);
  var OLD_KEYS = [
    ['delta','blackroom','history','v85'].join('_'),
    ['delta','blackroom','history','v6'].join('_'),
    ['delta','blackroom','history','v3'].join('_'),
    'delta_blac' + ELL + 'y_v3',
    'delta_blac' + ELL + 'y_v6'
  ];
  var MAX = 300;
  var cache = null;          // 内存缓存，避免每次渲染重复 JSON.parse
  var lastDeleted = null;    // 撤销用（仅内存，不落盘）

  function readRaw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  /* 跨版本归集：仅当没打过迁移标记时检查旧键；旧键确有记录时才合并并置位标记
     （新键已有记录也合并，按 id 去重，覆盖「升级后先分析了新记录」的场景）；
     标记置位后即使新键被清空也不再"复活"旧记录，防止误删后恢复。 */
  function mergeOldIfNeeded(arr){
    try{ if (localStorage.getItem(MIGRATED_KEY) === '1') return arr; }catch(e){ return arr; }
    var oldArr = [];
    for (var i = 0; i < OLD_KEYS.length; i++){
      var old = readRaw(OLD_KEYS[i]);
      if (old){ oldArr = normalizeAll(safeParse(old)); break; }
    }
    if (!oldArr.length) return arr;
    try{ localStorage.setItem(MIGRATED_KEY, '1'); }catch(e){}
    var seen = {}; arr.forEach(function(x){ seen[x.id] = 1; });
    var add = oldArr.filter(function(x){ return !seen[x.id]; });
    if (!add.length) return arr;
    var merged = add.concat(arr).sort(function(a,b){ return b.ts - a.ts; });
    if (merged.length > MAX) merged = merged.slice(0, MAX);
    persist(merged);
    return merged;
  }
  /* 旧版记录归一化：补齐 id/ts/bucket/note 等必备字段；
     缺结论字段的旧记录按当前算法补算（与导入逻辑共用），保证筛选与趋势有数可用。 */
  function normalizeRec(x){
    if (!x || typeof x !== 'object' || !x.input) return null;
    if (typeof x.risk !== 'number' || !x.verdictKey){
      if (typeof Analyzer === 'undefined') return null;
      try{
        var rr = Analyzer.analyze(x.input, dimsOf(x));
        x.risk = rr.composite; x.pressure = rr.pressure; x.suppress = rr.suppress;
        x.verdict = rr.verdict; x.verdictKey = rr.verdictKey; x.pool = rr.pool;
        x.tone = rr.poolTone; x.th = Math.round(rr.thresholds.hi);
        x.trust = Math.round(rr.trust * 100); x.cov = Math.round(rr.coverage * 100);
        x.fbase = Number(rr.fbase.value.toFixed(2));
        x.drop = Number(rr.drop.finalMult.toFixed(2));
        x.red = Number(rr.drop.red.toFixed(3)); x.gold = Number(rr.drop.gold.toFixed(2));
        x.label = rr.label.name; x.labelTone = rr.label.tone; x.mode = rr.mode.name;
        x.season = x.input.seasonPhase || 'mid'; x.squad = x.input.squadType || 'solo';
        x.dimC = rr.dimCalibratedCount; x.trig = rr.triggers.length; x.trigList = rr.triggers.slice(0,3);
        x.drvP = (rr.attrP||[]).filter(function(y){ return y.lift > 2; }).slice(0,3).map(function(y){ return y.name; });
        x.drvD = (rr.attrD||[]).filter(function(y){ return y.lift > 2; }).slice(0,3).map(function(y){ return y.name; });
      }catch(e){ return null; }
    }
    if (!x.id) x.id = 'h' + (Number(x.ts) || Date.now()) + Math.floor(Math.random()*1000);
    x.ts = Number(x.ts) || Date.now();
    if (!x.bucket) x.bucket = bucketOf(x.verdictKey || '');
    if (x.note == null) x.note = '';
    return x;
  }
  function normalizeAll(list){
    var out = [];
    (list || []).forEach(function(x){ var n = normalizeRec(x); if (n) out.push(n); });
    return out;
  }
  function load(force){
    if (cache && !force) return cache;
    var arr = safeParse(readRaw(KEY) || '[]');
    arr = mergeOldIfNeeded(arr);
    cache = arr;
    return arr;
  }
  function safeParse(s){ try{ var a = JSON.parse(s); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  function persist(list){
    cache = list;
    try{ localStorage.setItem(KEY, JSON.stringify(list)); return true; }
    catch(e){
      // 空间不足时逐级瘦身：先砍触发详情，再砍最旧记录
      try{
        var thin = list.map(function(x){ var y = {}; for (var k in x) if (k !== 'trigList' && k !== 'input') y[k] = x[k]; y.input = x.input; return y; });
        localStorage.setItem(KEY, JSON.stringify(thin.slice(0, 60)));
        cache = thin.slice(0, 60);
      }catch(e2){ return false; }
      return false;
    }
  }
  function stamp(ts){
    var d = new Date(ts), p = function(n){ return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function dayOf(ts){ var d = new Date(ts); return (d.getMonth()+1) + '/' + d.getDate(); }
  function bucketOf(key){
    if (key === 'dual' || key === 'pressure' || key === 'suppress') return 'black';
    if (key === 'edge') return 'edge';
    if (key === 'unknown') return 'unknown';
    return 'normal';
  }
  function names(arr){ return (arr || []).slice(0, 3).map(function(x){ return x.name; }); }

  function save(data, result){
    var list = load().slice();
    var d = result.derived;
    list.unshift({
      id: 'h' + Date.now() + Math.floor(Math.random()*1000),
      v: 7, ts: Date.now(),
      risk: result.composite, pressure: result.pressure, suppress: result.suppress,
      verdict: result.verdict, verdictKey: result.verdictKey, pool: result.pool,
      bucket: bucketOf(result.verdictKey), tone: result.poolTone,
      th: Math.round(result.thresholds.hi), trust: Math.round(result.trust*100), cov: Math.round(result.coverage*100),
      label: result.label ? result.label.name : '', labelTone: result.label ? result.label.tone : '',
      mode: result.mode ? result.mode.name : '', season: data.seasonPhase || 'mid', squad: data.squadType || 'solo',
      fbase: Number(result.fbase.value.toFixed(2)), drop: Number(result.drop.finalMult.toFixed(2)),
      red: Number(result.drop.red.toFixed(3)), gold: Number(result.drop.gold.toFixed(2)),
      avgTime: d.avgTime == null ? null : Number(d.avgTime.toFixed(1)),
      hourly: d.yieldMh == null ? null : Number(d.yieldMh.toFixed(2)),
      perGame: d.perGameM == null ? null : Number(d.perGameM.toFixed(2)),
      games: d.n || null, dimC: result.dimCalibratedCount,
      trig: result.triggers.length, trigList: result.triggers.slice(0, 3),
      drvP: names(result.attrP.filter(function(x){ return x.lift > 2; })),
      drvD: names(result.attrD.filter(function(x){ return x.lift > 2; })),
      flip: result.stability ? Math.round(result.stability.flipRate*100) : null,
      dimsTouched: result.dimsTouched || (data && data.dimsTouched) || null,
      note: '', input: data
    });
    if (list.length > MAX) list = list.slice(0, MAX);
    persist(list);
    return list.length;
  }
  function removeMany(ids){
    var before = load().slice();
    var set = {}; ids.forEach(function(i){ set[i] = 1; });
    var removed = before.filter(function(x){ return set[x.id]; });
    var list = before.filter(function(x){ return !set[x.id]; });
    lastDeleted = { ids: ids.slice(), snapshot: before };
    persist(list);
    return { left: list.length, removed: removed.length };
  }
  function undo(){
    if (!lastDeleted) return false;
    persist(lastDeleted.snapshot);
    lastDeleted = null;
    return true;
  }
  function replaceAll(list){ persist(list.slice(0, MAX)); return list; }
  function setNote(id, text){
    var list = load().slice(), hit = false;
    for (var i = 0; i < list.length; i++) if (list[i].id === id){ list[i].note = String(text || '').slice(0, 120); hit = true; }
    if (hit) persist(list);
    return hit;
  }
  function exportJson(){ return JSON.stringify(load(), null, 1); }
  function importJson(text){
    var arr = (typeof text === 'string') ? JSON.parse(text) : text;
    if (!Array.isArray(arr) && arr && typeof arr === 'object'){
      if (Array.isArray(arr.records)) arr = arr.records;
      else if (Array.isArray(arr.data)) arr = arr.data;
      else if (arr.input && typeof arr.input === 'object') arr = [arr];
    }
    if (!Array.isArray(arr)) throw new Error('内容里找不到记录数组（请粘贴导出的完整 JSON）');
    /* 兼容旧版导出：normalizeRec 会补齐缺失字段，缺结论的旧记录按当前算法补算 */
    var old = load(), seen = {}, add = [], skipped = 0;
    old.forEach(function(x){ seen[x.id] = 1; });
    arr.forEach(function(x){
      var n = normalizeRec(x);
      if (!n || seen[n.id]) { skipped++; return; }
      seen[n.id] = 1;
      add.push(n);
    });
    if (!add.length) return { added: 0, total: old.length, msg: '没有可导入的新记录（跳过 ' + skipped + ' 条：已存在或缺少输入数据）' };
    var merged = add.concat(old).sort(function(a,b){ return b.ts - a.ts; }).slice(0, MAX);
    persist(merged);
    return { added: add.length, total: merged.length, skipped: skipped };
  }
  /* 记录里的五维标定标记：新记录直接存 dimsTouched，旧记录按 dimC 数量尽力还原 */
  function dimsOf(rec){
    var all = { combat:false, wealth:false, search:false, coop:false, survival:false };
    if (!rec) return all;
    var f = rec.dimsTouched || (rec.input && rec.input.dimsTouched);
    if (f) { for (var k in all) all[k] = !!f[k]; return all; }
    if (rec.dimC == null) return all;
    var order = ['combat','search','survival','wealth','coop'];
    for (var i = 0; i < rec.dimC && i < order.length; i++) all[order[i]] = true;
    return all;
  }
  return { load: load, save: save, removeMany: removeMany, undo: undo, replaceAll: replaceAll, setNote: setNote, dimsOf: dimsOf,
           clear: function(){ lastDeleted = { snapshot: load().slice() }; persist([]); },
           canUndo: function(){ return !!lastDeleted; },
           stamp: stamp, dayOf: dayOf, bucketOf: bucketOf, exportJson: exportJson, importJson: importJson, KEY: KEY, MAX: MAX };
})();
</script>
<script>
/* ============================================================
   SECTION: history view controller
   ============================================================ */
(function(){
  var state = { verdict:'all', kw:'', sort:'time', minRisk:0, range:'all', mode:'all', batch:false, sel:{}, limit:40 };
  var PAGE = 40;
  function q(id){ return document.getElementById(id); }
  function has(v){ return typeof v === 'number' && isFinite(v); }
  function fmt(v, d, u){ return has(v) ? v.toFixed(d) + (u || '') : '—'; }
  function esc(s){ return UI.esc(s); }
  function filtered(){
    var list = History.load(), now = Date.now(), day = 86400000, kw = state.kw.toLowerCase();
    return list.filter(function(it){
      if (state.verdict === 'note'){ if (!it.note) return false; }
      else if (state.verdict !== 'all' && it.bucket !== state.verdict) return false;
      if ((it.risk || 0) < state.minRisk) return false;
      if (state.mode !== 'all' && it.mode !== state.mode) return false;
      if (state.range !== 'all' && now - it.ts > Number(state.range) * day) return false;
      if (kw){
        var hay = [History.stamp(it.ts), it.pool, it.verdict, it.label, it.mode, (it.squad||''), (it.note||''),
                   (it.drvP||[]).join(' '), (it.drvD||[]).join(' '), (it.trigList||[]).join(' ')].join(' ').toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      return true;
    }).sort(function(a,b){
      if (state.sort === 'riskDesc') return b.risk - a.risk;
      if (state.sort === 'riskAsc')  return a.risk - b.risk;

      if (state.sort === 'drop')     return a.drop - b.drop;
      return b.ts - a.ts;
    });
  }
  function chipCounts(){
    var all = History.load(), c = { all: all.length, normal:0, edge:0, black:0, note:0 };

    if (c.unknown) delete c.unknown;
    return c;
  }
  /* 只切高亮、不动 DOM —— 打字过程中调用它，避免输入框焦点与内容被重写 */
  function syncChipsActive(){
    Array.prototype.forEach.call(document.querySelectorAll('#verdictChips .chip'), function(el){
      el.classList.toggle('on', el.getAttribute('data-v') === state.verdict);
    });
  }
  function renderChips(){
    var c = chipCounts();
    Array.prototype.forEach.call(document.querySelectorAll('#verdictChips .chip'), function(el){
      var v = el.getAttribute('data-v');
      var n = c[v];
      var base = el.getAttribute('data-label') || el.textContent.replace(/\s*\d+$/, '').trim();
      el.setAttribute('data-label', base);
      el.innerHTML = esc(base) + (n != null ? ' <span class="n">' + n + '</span>' : '');
      el.classList.toggle('on', v === state.verdict);
    });
  }
  function scopeLabel(){
    var total = History.load().length, f = filtered().length;
    return f === total ? '全部记录' : ('当前筛选 ' + f + ' / 全库 ' + total + ' 条');
  }
  function renderStat(){
    var all = filtered(), total = History.load().length, el = q('histStat');
    if (!total){ el.innerHTML = '<div class="hs-cell" style="grid-column:1/-1"><div class="hs-k">尚无记录，完成一次分析后自动保存</div></div>'; return; }
    if (!all.length){ el.innerHTML = '<div class="hs-cell" style="grid-column:1/-1"><div class="hs-k">当前筛选没有命中记录，统计与趋势暂无数据</div></div>'; return; }
    var black = all.filter(function(x){ return x.bucket === 'black'; }).length;
    var avg = all.reduce(function(s,x){ return s + (x.risk||0); }, 0) / all.length;
    var span = Math.round((all[0].ts - all[all.length-1].ts) / 86400000);
    var recent = all.slice(0, 5), older = all.slice(5, 10), delta = null;
    if (recent.length && older.length){
      var a = recent.reduce(function(s,x){ return s+x.risk; },0)/recent.length;
      var b = older.reduce(function(s,x){ return s+x.risk; },0)/older.length;
      delta = a - b;
    }
    var cells = [
      { k: (all.length === total ? '累计分析' : '筛选内记录'), v: String(all.length), c:'' },
      { k:'判为黑屋/观察', v: String(black), c: black ? 'red' : 'green' },
      { k:'平均综合分', v: avg.toFixed(1), c: avg > 50 ? 'red' : '' },
      { k:'近5次变化', v: delta == null ? '—' : (delta > 0 ? '+' : '') + delta.toFixed(1), c: delta == null ? '' : delta > 0 ? 'red' : 'green' },
      { k:'时间跨度', v: all.length > 1 ? span + ' 天' : '—', c:'' },
      { k:'最近一次', v: all[0].risk + '', c: all[0].bucket === 'black' ? 'red' : all[0].bucket === 'edge' ? '' : 'green' }
    ];
    el.innerHTML = cells.map(function(x){
      return '<div class="hs-cell"><div class="hs-v ' + x.c + '">' + esc(x.v) + '</div><div class="hs-k">' + esc(x.k) + '</div></div>';
    }).join('');
  }
  function rowHtml(it){
    var seg = [it.verdict || it.pool || '—'];
    seg.push('高压 ' + fmt(it.pressure,0) + ' / 低爆 ' + fmt(it.suppress,0) + ' / 阈值 ' + fmt(has(it.th) ? it.th : 58, 0));
    if (has(it.avgTime)) seg.push('每局 ' + it.avgTime + ' 分');
    if (has(it.hourly)) seg.push('效率 ' + it.hourly + ' M/h');
    seg.push('F_base ' + fmt(it.fbase,2) + ' · 爆率 ' + fmt(it.drop,2,'×') + ' · 红品 ' + fmt(it.red,3,'%'));
    var tags = [];
    if (it.mode) tags.push('<span class="mtag cy">' + esc(it.mode) + '池</span>');
    if (it.label) tags.push('<span class="mtag">' + esc(it.label) + '</span>');
    if (it.squad && it.squad !== 'solo') tags.push('<span class="mtag">' + esc(({duo:'双排',trio:'三排',mixed:'混打'})[it.squad] || it.squad) + '</span>');
    if (it.trig) tags.push('<span class="mtag red">硬触发 ' + it.trig + '</span>');
    if (it.dimC != null) tags.push('<span class="mtag' + (it.dimC < 3 ? ' red' : '') + '">五维 ' + it.dimC + '/5</span>');
    if (it.cov != null) tags.push('<span class="mtag">覆盖 ' + it.cov + '%</span>');
    if (it.th != null) tags.push('<span class="mtag">阈值 ' + it.th + '</span>');
    if (it.flip != null) tags.push('<span class="mtag">翻转率 ' + it.flip + '%</span>');
    if (it.drvD && it.drvD.length) tags.push('<span class="mtag">主因 ' + esc(it.drvD.slice(0,2).join('/')) + '</span>');
    if (it.note) tags.push('<span class="mtag note">备注 ' + esc(it.note) + '</span>');
    return '<div class="hrow' + (state.sel[it.id] ? ' sel' : '') + '" data-id="' + esc(it.id) + '">' +
      '<span class="hrail ' + esc(it.bucket || '') + '"></span>' +
      '<span class="hck"><input type="checkbox" data-ck="' + esc(it.id) + '"' + (state.sel[it.id] ? ' checked' : '') + ' aria-label="选择记录"></span>' +
      '<span class="hscore ' + esc(it.bucket || '') + '">' + fmt(it.risk,0) + '</span>' +
      '<div class="hbody"><div class="ht"><span class="dt">' + History.stamp(it.ts) + '</span><span>' + esc(it.pool || '') + '</span></div>' +
      '<div class="hm">' + esc(seg.join(' ｜ ')) + '</div><div class="htags">' + tags.join('') + '</div></div>' +
      '<div class="hops">' +
        '<button class="btn tiny" type="button" data-op="detail">详情</button>' +
        '<button class="btn tiny" type="button" data-op="load">载入</button>' +
        '<button class="btn tiny" type="button" data-op="note">备注</button>' +
        '<button class="btn tiny danger" type="button" data-op="del">删除</button>' +
      '</div></div>';
  }
  function filterSummary(list, total){
    var act = [];
    if (state.verdict !== 'all') act.push('判定=' + ({normal:'正常池',edge:'边缘池',black:'黑屋/观察',note:'有备注'})[state.verdict]);
    if (state.mode !== 'all') act.push('模式=' + state.mode);
    if (state.range !== 'all') act.push('近 ' + state.range + ' 天');
    if (state.minRisk > 0) act.push('风险 ≥' + state.minRisk);
    if (state.kw) act.push('关键词「' + state.kw + '」');
    if (state.sort !== 'time'){ var so = q('histSort'); act.push('排序=' + (so.selectedOptions[0] ? so.selectedOptions[0].textContent : so.value)); }
    return '生效筛选：' + (act.length ? act.join(' ｜ ') : '无（显示全库 ' + total + ' 条）') +
      ' → 命中 ' + list.length + ' 条' + (state.batch ? ' ｜ 批量已选 ' + Object.keys(state.sel).length + ' 条' : '');
  }
  function renderList(){
    var box = q('histList'), empty = q('histEmpty'), hint = q('histCountHint');
    var list = filtered(), total = History.load().length;
    syncChipsActive();
    hint.textContent = filterSummary(list, total);   /* 先给反馈：0 命中也要看得见生效条件 */
    renderStat();                                     /* 统计条跟随筛选，不再是永远全量 */
    if (!total){
      empty.innerHTML = '<span class="empty-t">还没有记录</span>完成一次分析后，结果会保存在本机，可在此查询、备注、删除与对比';
      empty.style.display = 'block'; box.innerHTML = '';
      q('btnMore').style.display = 'none';
      renderTrend();
      return;
    }
    if (!list.length){
      empty.innerHTML = '<span class="empty-t">没有匹配记录</span>全库共 ' + total + ' 条，当前筛选条件下无结果，可重置筛选';
      empty.style.display = 'block'; box.innerHTML = '';
      q('btnMore').style.display = 'none';
      renderTrend();
      return;
    }
    empty.style.display = 'none';
    var slice = list.slice(0, state.limit);
    box.innerHTML = slice.map(rowHtml).join('');
    q('btnMore').style.display = list.length > state.limit ? '' : 'none';
    q('btnMore').textContent = '加载更多（还有 ' + (list.length - slice.length) + ' 条）';
    updateBatchBtn();
    renderTrend();
  }
  function updateBatchBtn(){
    var k = Object.keys(state.sel).length;
    q('btnDelSel').textContent = '删除所选（' + k + '）';
    q('btnDelSel').disabled = !k;
    q('btnCompareSel').disabled = k !== 2;
  }
  /* ---- 趋势 ---- */
  function renderTrend(){
    var cv = q('trendCanvas'); if (!cv) return;
    var metric = q('trendMetric').value;
    var all = filtered().slice(0, 40).reverse();
    var isDrop = metric === 'drop';
    var pts = all.map(function(it, i, arr){
      var v = it[metric] == null ? (isDrop ? 1 : 0) : it[metric];
      var s = 0, c = 0;
      for (var k = Math.max(0, i-6); k <= i; k++){ var x = arr[k][metric]; s += x == null ? (isDrop ? 1 : 0) : x; c++; }
      return { v: v, ma: s / c, tone: it.tone || it.bucket, label: History.dayOf(it.ts) };
    });
    Charts.trend(cv, pts, { max: isDrop ? 2 : 100, unit: isDrop ? '×' : '', threshold: isDrop ? 1 : (all.length ? (all[all.length-1].th || 58) : 58) });
    q('trendLegend').innerHTML = isDrop
      ? '<span><i style="background:' + PAL.ok + '"></i>合成爆率系数（0–2）</span><span><i style="background:' + PAL.info + '"></i>7 点均线</span><span><i style="background:' + PAL.danger + '"></i>1.0 基准线</span>'
      : '<span><i style="background:' + PAL.ok + '"></i>' + esc(({risk:'综合风险分',pressure:'高压轴',suppress:'低爆轴'})[metric]) + '</span><span><i style="background:' + PAL.info + '"></i>7 点均线</span><span><i style="background:' + PAL.danger + '"></i>判定阈值</span>';
    q('trendHint').textContent = '[' + scopeLabel() + '] ' + (all.length < 2
      ? (all.length + ' 条记录，至少 2 条才能连线。')
      : ('展示最近 ' + all.length + ' 次（时间正序）。判定阈值随置信度浮动，图中取最近一次的阈值 ' + (all[all.length-1].th || 58) + ' 作参考。'));
  }
  /* ---- 操作 ---- */
  function detail(it){
    if (typeof window.__showReport !== 'function'){ window.toast && window.toast('报告渲染器未就绪'); return; }
    window.__showReport(it.input, { title: '历史记录回放 · ' + History.stamp(it.ts), dimCalibrated: History.dimsOf(it) });
  }
  function restore(it){
    window.__fillForm(it.input, it);
    showView('analysis');
    window.scrollTo(0, 0);
    window.toast && window.toast('已载入 ' + History.stamp(it.ts) + ' 的输入');
  }
  function del(id, ts){
    removeIds([id], '已删除 1 条记录', true);
  }
  function removeIds(ids, msg, allowUndo){
    var snapshot = History.load().slice();
    var r = History.removeMany(ids);
    state.sel = {};
    renderAll();
    if (typeof InsightView !== 'undefined') InsightView.invalidate();
    window.toast && window.toast((msg || ('已删除 ' + r.removed + ' 条')), allowUndo !== false ? function(){
      History.undo(); renderAll(); if (typeof InsightView !== 'undefined') InsightView.invalidate();
      window.toast && window.toast('已恢复删除的记录');
    } : null);
    return r;
  }
  function bind(){
    q('verdictChips').addEventListener('click', function(e){
      var c = e.target.closest ? e.target.closest('.chip[data-v]') : null;

    });
    var kw = q('histKw');
    var t = null;
    function kwNow(){
      clearTimeout(t);
      t = setTimeout(function(){
        var v = kw.value.trim();
        if (v === state.kw) return;
        state.kw = v; state.limit = PAGE; renderList();
      }, 160);
    }
    if (kw) ['input','keyup','search','change','propertychange'].forEach(function(ev){ kw.addEventListener(ev, kwNow); });
    [['histSort','sort'],['histRange','range'],['histMode','mode'],['trendMetric','trend']].forEach(function(p){
      var el = q(p[0]); if (!el) return;
      el.addEventListener('change', function(){
        if (p[1] === 'trend'){ renderTrend(); return; }
        state[p[1]] = el.value; state.limit = PAGE; renderList();
      });
    });

    if (mr) mr.addEventListener('input', function(){
      state.minRisk = Number(mr.value); q('minRiskVal').textContent = mr.value; state.limit = PAGE; renderList();
    });
    /* 列表事件委托 */
    q('histList').addEventListener('click', function(e){
      var btn = e.target.closest ? e.target.closest('[data-op],[data-ck]') : null;
      if (!btn) return;
      var row = btn.closest('.hrow'); if (!row) return;
      var id = row.getAttribute('data-id');
      var it = History.load().filter(function(x){ return x.id === id; })[0];
      if (!it) return;
      if (btn.hasAttribute('data-ck')){
        if (btn.checked) state.sel[id] = 1; else delete state.sel[id];
        row.classList.toggle('sel', !!btn.checked);
        updateBatchBtn(); renderList();
        return;
      }
      var op = btn.getAttribute('data-op');
      if (op === 'detail') detail(it);
      else if (op === 'load') restore(it);
      else if (op === 'del') del(it.id, it.ts);
      else if (op === 'note') editNote(it, row);

    if (more) more.addEventListener('click', function(){ state.limit += 60; renderList(); });
    /* 批量 */
    function setBatch(on){
      state.batch = on;

    }

      filtered().forEach(function(x){ state.sel[x.id] = 1; }); renderList();
    });

    q('btnDelSel').addEventListener('click', function(){
      var ids = Object.keys(state.sel);
      if (!ids.length) return;
      if (!window.confirm('删除所选 ' + ids.length + ' 条记录？删除后可在提示条点「撤销」恢复。')) return;
      removeIds(ids, '已删除 ' + ids.length + ' 条记录');
    });
    q('btnCompareSel').addEventListener('click', function(){
      var ids = Object.keys(state.sel);
      if (ids.length !== 2) return;
      showView('insight');
      if (typeof InsightView !== 'undefined') InsightView.setCompare(ids[1], ids[0]);
    });
    q('btnResetFilter').addEventListener('click', function(){
      state = { verdict:'all', kw:'', sort:'time', minRisk:0, range:'all', mode:'all', batch:state.batch, sel:state.sel, limit:PAGE };
      if (kw) kw.value = '';
      q('histSort').value = 'time'; q('histRange').value = 'all'; q('histMode').value = 'all';
      q('minRisk').value = 0; q('minRiskVal').textContent = '0';
      renderList();
    });
    q('btnDelBefore').addEventListener('click', function(){
      var list = filtered();
      if (list.length <= 5){ window.toast && window.toast('当前筛选结果只有 ' + list.length + ' 条，无需清理'); return; }
      var cut = list.slice(5);
      if (!window.confirm('将删除当前筛选结果中除最近 5 条以外的 ' + cut.length + ' 条记录（保留最近 5 条）。可撤销。继续？')) return;
      removeIds(cut.map(function(x){ return x.id; }), '已清理 ' + cut.length + ' 条旧记录');
    });
    q('btnClear').addEventListener('click', function(){
      var n = History.load().length;
      if (!n){ window.toast && window.toast('历史记录已为空'); return; }
      if (!window.confirm('将删除本机全部 ' + n + ' 条历史记录。可在提示条点「撤销」恢复（关闭页面前有效）。继续？')) return;
      removeIds(History.load().map(function(x){ return x.id; }), '已清空 ' + n + ' 条记录');
    });
    /* 导出 / 导入：App 内嵌浏览器常拦截 a[download] 与 file picker，
       这里统一改为「面板里给出可复制的 JSON + 尝试下载 + 可调系统分享」三重通路 */
    function doExport(list, label){
      var total = History.load().length;
      if (!list || !list.length){ window.toast && window.toast('没有可导出的记录'); return; }
      var text = JSON.stringify(list, null, 1);
      var fname = '黑屋分析历史_' + History.stamp(Date.now()).replace(/[: ]/g, '-') +
                  (list.length < total ? '_筛选' + list.length : '') + '.json';
      var bridge = false;
      if (window.AndroidBridge && typeof window.AndroidBridge.saveTextFile === 'function'){
        try { bridge = window.AndroidBridge.saveTextFile(fname, text) === 'ok'; } catch(e){ bridge = false; }
      }
      var dl = bridge ? false : tryDownload(text, fname);
      var why = bridge ? '已通过 App 保存到 Downloads 目录。'
                : (dl ? '已尝试触发下载。若没有弹出保存框，说明当前环境禁止直接下载——请改用下面的按钮。'
                      : '当前环境不支持直接下载文件，请用下面的按钮。');
      openIo('out', text, '本次导出 <b>' + list.length + '</b> 条（' + label + '，全库 ' + total + ' 条）｜文件名 ' + esc(fname) + '。' + why +
        '<br><b>存到手机最稳的两条路：</b>① 点「复制全部」→ 打开手机备忘录/微信收藏/夸克网盘上传框粘贴；② 点「调起系统分享保存」→ 选「存储到文件」或夸克网盘。');
      ioState.fname = fname;
    }
    function applyImport(text, from){
      var t = String(text || '').trim();
      if (!t){ window.toast && window.toast('请先粘贴导出的 JSON 内容'); return; }
      var r;
      try { r = History.importJson(t); }
      catch(e){ window.toast && window.toast('导入失败：' + String(e.message).slice(0, 50) + '（请粘贴「导出 JSON」的完整原文）'); return; }
      renderAll(); bindCount();
      if (typeof InsightView !== 'undefined') InsightView.invalidate();
      closeIo();
      window.toast && window.toast(r.added ? ('导入成功 ' + r.added + ' 条' + (from?('（来自'+from+'）'):'') + '，共 ' + r.total + ' 条')
                                           : (r.msg || '未导入新记录（可能已存在或格式不含 input 字段）'));
    }
    q('btnExport').addEventListener('click', function(){ doExport(History.load(), '全部记录'); });
    var bfe = q('btnExportFiltered');
    if (bfe) bfe.addEventListener('click', function(){ doExport(filtered(), '当前筛选'); });
    q('btnImport').addEventListener('click', function(){
      var fi = q('fileImport');
      if (!fi) return;
      fi.value = '';
      var opened = false;
      try { fi.click(); opened = true; } catch(e){ opened = false; }
      if (!opened) openIo('in', '', '当前环境不支持文件选择器，请直接粘贴导出的 JSON 内容后点「应用」。');
    });

    if (fi2) fi2.addEventListener('change', function(){
      var f = fi2.files && fi2.files[0];

      if (!f) return;
      var fr = new FileReader();
      fr.onload = function(){ applyImport(fr.result, '文件 ' + (f.name || '')); };
      fr.onerror = function(){ window.toast && window.toast('文件读取失败，请把内容粘贴到下方输入框'); };
      try { fr.readAsText(f); } catch(e){ openIo('in', '', '该文件无法直接读取，请把内容粘贴到下方。'); }
    });
    if (q('btnIoClose')) q('btnIoClose').addEventListener('click', closeIo);
    if (q('btnIoCopy')) q('btnIoCopy').addEventListener('click', function(){
      var text = q('ioText').value || '';
      if (!text){ window.toast && window.toast('没有内容可复制'); return; }
      if (typeof InsightView !== 'undefined') InsightView.copy(text, '已复制 ' + text.length + ' 个字符，去手机备忘录或网盘粘贴即可');
      else { try{ q('ioText').select(); document.execCommand('copy'); window.toast && window.toast('已复制'); }catch(e){} }
    });
    if (q('btnIoApply')) q('btnIoApply').addEventListener('click', function(){ applyImport(q('ioText').value, '粘贴内容'); });
    if (q('btnIoShare')) q('btnIoShare').addEventListener('click', function(){
      var text = q('ioText').value || '';
      if (!text){ window.toast && window.toast('没有内容可分享'); return; }
      if (!shareFile(text, ioState.fname || '黑屋分析历史.json')) window.toast && window.toast('当前环境不支持系统分享，请用「复制全部」');
    });
  }
  var ioState = { fname:'' };
  function openIo(mode, text, note){
    var p = q('ioPanel'); if (!p) return;
    p.style.display = 'block';
    q('ioTitle').textContent = mode === 'in' ? '粘贴 JSON 导入' : '导出结果';
    q('ioNote').innerHTML = note || '';
    q('ioText').value = text || '';
    q('ioText').readOnly = (mode !== 'in');
    q('btnIoApply').style.display = mode === 'in' ? '' : 'none';
    q('btnIoShare').style.display = mode === 'in' ? 'none' : '';
    try { p.scrollIntoView({ behavior:'smooth', block:'nearest' }); } catch(e){}
  }
  function closeIo(){ var p = q('ioPanel'); if (p) p.style.display = 'none'; }
  function tryDownload(text, fname){
    try{
      var blob = new Blob([text], { type:'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fname; a.rel = 'noopener';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
      return true;
    }catch(e){ return false; }
  }
  function shareFile(text, fname){
    try{
      var f = new File([text], fname, { type:'application/json' });
      if (navigator.canShare && navigator.canShare({ files:[f] })){
        navigator.share({ files:[f], title: fname });
        return true;
      }
      if (navigator.share && navigator.share){ navigator.share({ title: fname, text: text.slice(0, 60000) }); return true; }
    }catch(e){ return false; }
    return false;
  }
  function editNote(it, row){
    var body = row.querySelector('.hbody');
    if (row.querySelector('.note-editor')) return;
    var box = document.createElement('div');
    box.className = 'note-editor';
    box.style.cssText = 'display:flex;gap:6px;margin-top:7px';
    var inp = document.createElement('input');
    inp.className = 'ctrl'; inp.style.minHeight = '34px'; inp.style.fontSize = '.8rem';
    inp.maxLength = 120; inp.value = it.note || '';
    inp.placeholder = '写一句备注，如「换了新号」「活动期」「三排连坐」';
    var sv = document.createElement('button'); sv.className = 'btn tiny on'; sv.textContent = '保存';
    var cc = document.createElement('button'); cc.className = 'btn tiny ghost'; cc.textContent = '取消';
    box.appendChild(inp); box.appendChild(sv); box.appendChild(cc); body.appendChild(box);
    inp.focus();
    function done(save){
      if (save){ History.setNote(it.id, inp.value); renderChips(); }
      renderList();
    }
    sv.addEventListener('click', function(){ done(true); });
    cc.addEventListener('click', function(){ done(false); });
    inp.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); done(true); }
      else if (e.key === 'Escape'){ done(false); }
    });
  }
  function bindCount(){
    var n = History.load().length, c = q('tabHistCount');
    if (c) c.textContent = n ? String(n) : '';
  }
  function renderAll(){ bindCount(); renderChips(); renderList(); }
  window.HistoryView = { init: function(){ bind(); renderAll(); }, refresh: renderAll, renderAll: renderAll,
                         filtered: filtered, removeIds: removeIds };
})();
</script>
<script>
/* ============================================================
   SECTION: insight view（历史分析）
   ============================================================ */
(function(){
  var dirty = true;
  function esc(s){ return UI.esc(s); }
  function q(id){ return document.getElementById(id); }
  function avg(a){ return a.length ? a.reduce(function(s,x){ return s+x; },0)/a.length : null; }
  function median(a){ if (!a.length) return null; var b = a.slice().sort(function(x,y){ return x-y; }); var m = Math.floor(b.length/2); return b.length % 2 ? b[m] : (b[m-1]+b[m])/2; }
  function pearson(pairs){
    var n = pairs.length;
    if (n < 5) return null;
    var mx = avg(pairs.map(function(p){ return p[0]; })), my = avg(pairs.map(function(p){ return p[1]; }));
    if (mx == null || my == null) return null;
    var sxy = 0, sxx = 0, syy = 0;
    pairs.forEach(function(p){ var dx = p[0]-mx, dy = p[1]-my; sxy += dx*dy; sxx += dx*dx; syy += dy*dy; });
    if (sxx <= 1e-9 || syy <= 1e-9) return null;
    return { r: sxy / Math.sqrt(sxx*syy), n: n };
  }
  var CORR_FIELDS = [
    { k:'fbase', name:'F_base' }, { k:'hourly', name:'收益效率 M/h' }, { k:'avgTime', name:'每局时长' },
    { k:'perGame', name:'场均带出 M' }, { k:'games', name:'战局数' }, { k:'drop', name:'合成爆率系数' },
    { g:'profitRatio', name:'赚损比（输入）' }, { g:'kdSecret', name:'机密KD（输入）' }, { g:'kdTopSecret', name:'绝密KD（输入）' },
    { g:'evacRate', name:'撤离率（输入）' }, { g:'hitRate', name:'命中率（输入）' }, { g:'precisionRate', name:'精准击败（输入）' },
    { g:'gearValue', name:'入场战备（输入）' }, { g:'dimCombat', name:'战斗五维（输入）' }
  ];
  function val(it, c){ return c.g ? (it.input ? it.input[c.g] : null) : it[c.k]; }

  function kpi(k, v, u, cls){
    return '<div class="kpi"><div class="k">' + esc(k) + '</div><div class="v ' + (cls||'') + '">' + esc(String(v)) + (u ? '<span class="u">' + esc(u) + '</span>' : '') + '</div></div>';
  }

  function renderKpis(list){
    var el = q('insKpis'), vt = q('insVerdictText');
    if (list.length < 2){
      el.innerHTML = kpi('记录数', list.length, '条', 'mute');
      vt.innerHTML = '<div class="line-item info">至少需要 2 条记录才能做历史分析。多分析几次（例如换模式、换时段各存一次），这里会给出分布、趋势、模式差异、驱动项排行与输入相关性。</div>';
      q('insDist').innerHTML = ''; q('insModeTbl').innerHTML = ''; q('insDrivers').innerHTML = ''; q('insCorr').innerHTML = '';
      q('insReport').textContent = '暂无足够的历史记录。';
      return;
    }
    var risks = list.map(function(x){ return x.risk || 0; });
    var black = list.filter(function(x){ return x.bucket === 'black'; }).length;
    var edge = list.filter(function(x){ return x.bucket === 'edge'; }).length;
    var span = Math.max(1, Math.round((list[0].ts - list[list.length-1].ts) / 86400000));
    var first = risks[risks.length-1], last = risks[0];
    var trendD = last - first;
    var drops = list.map(function(x){ return x.drop; }).filter(function(x){ return x != null; });
    var flips = list.map(function(x){ return x.flip; }).filter(function(x){ return x != null; });
    el.innerHTML =
      kpi('记录数', list.length, '条', 'mute') +
      kpi('时间跨度', span, '天', 'mute') +
      kpi('平均综合分', (avg(risks)||0).toFixed(1), '', avg(risks) > 50 ? 'dg' : 'ok') +
      kpi('中位综合分', (median(risks)||0).toFixed(1), '', 'mute') +
      kpi('判为黑屋', black, '次', black ? 'dg' : 'ok') +
      kpi('边缘状态', edge, '次', edge ? 'wn' : 'ok') +
      kpi('首末变化', (trendD > 0 ? '+' : '') + trendD.toFixed(0), '分', trendD > 5 ? 'dg' : trendD < -5 ? 'ok' : 'mute') +
      kpi('平均爆率系数', (avg(drops)||0).toFixed(2), '×', (avg(drops)||1) < 0.85 ? 'dg' : 'ok');
    var dir = trendD > 5 ? '上升' : trendD < -5 ? '下降' : '基本持平';
    var stable = flips.length && avg(flips) < 15;
    vt.innerHTML = '<div class="line-item ' + (black/list.length > 0.4 ? 'risk' : black ? 'info' : 'tip') + '">' +
      '<b>历史结论：</b>' + list.length + ' 次分析跨越 ' + span + ' 天，综合分从 ' + first + ' → ' + last + '（' + dir + '）；' +
      '其中判为黑屋 ' + black + ' 次（' + Math.round(black/list.length*100) + '%）、边缘 ' + edge + ' 次。' +
      (black === 0 ? '没有任何一次达到黑屋档，账号级调控的可能性低，更像是额度/爆率条的周期性消耗。'
                   : black === list.length ? '每一次都命中黑屋档，且跨越 ' + span + ' 天 —— 这已不是一次随机波动可以解释的，指向账号级画像。'
                   : '判定在不同批次间会切换，' + (stable ? '且扰动翻转率平均仅 ' + Math.round(avg(flips)) + '%，说明切换来自你输入数据本身的变化，而非算法不稳定。' : '翻转率偏高（平均 ' + Math.round(avg(flips)) + '%），先把数据填全再下结论。')) +
      '</div>';
  }
  function renderDist(list){
    var el = q('insDist');
    if (list.length < 2){ el.innerHTML = ''; return; }
    var bins = [[0,20],[20,40],[40,60],[60,80],[80,101]];
    var lab = ['0–19 健康','20–39 正常','40–59 边缘','60–79 黑屋','80+ 高危'];
    var cnt = bins.map(function(b){ return list.filter(function(x){ return x.risk >= b[0] && x.risk < b[1]; }).length; });
    var mx = Math.max.apply(null, cnt) || 1;
    el.innerHTML = cnt.map(function(c, i){
      var cls = i >= 3 ? 'dg' : i === 2 ? 'wn' : '';
      return '<div class="col ' + cls + '"><span class="n">' + (c || '') + '</span>' +
        '<span class="bar" style="height:' + Math.max(2, Math.round(c / mx * 66)) + 'px"></span>' +
        '<span class="x">' + lab[i] + '</span></div>';
    }).join('');
    q('insDistHint').textContent = '共 ' + list.length + ' 条。风险分布集中在 ' + lab[cnt.indexOf(Math.max.apply(null, cnt))] + '。分布若长期偏向右侧，说明画像稳定越线；只在 40–60 之间摆动，多为收益效率与战备档位的日常波动。';
  }
  function renderModes(list){
    var el = q('insModeTbl');
    if (!list.length){ el.innerHTML = ''; return; }
    var keys = ['机密','普通','绝密'];
    var h = ['<thead><tr><th>模式池</th><th>次数</th><th>平均综合</th><th>最高</th><th>黑屋/边缘</th><th class="last">平均爆率系数</th></tr></thead><tbody>'];
    keys.forEach(function(k){
      var s = list.filter(function(x){ return x.mode === k; });
      if (!s.length) return;
      var rs = s.map(function(x){ return x.risk; });
      var dp = avg(s.map(function(x){ return x.drop == null ? 1 : x.drop; }));
      h.push('<tr><td>' + k + '</td><td class="n">' + s.length + '</td><td class="n ' + (avg(rs) > 50 ? 'dg' : 'ok') + '">' + avg(rs).toFixed(1) + '</td>' +
        '<td class="n">' + Math.max.apply(null, rs) + '</td>' +
        '<td class="n">' + s.filter(function(x){ return x.bucket === 'black'; }).length + ' / ' + s.filter(function(x){ return x.bucket === 'edge'; }).length + '</td>' +
        '<td class="n last ' + (dp < 0.85 ? 'dg' : 'ok') + '">' + dp.toFixed(2) + '×</td></tr>');
    });
    h.push('</tbody>');
    el.innerHTML = h.join('');
  }
  function renderDrivers(list){
    var el = q('insDrivers');
    var cnt = {};
    list.forEach(function(it){
      (it.drvP || []).forEach(function(n){ cnt[n] = cnt[n] || { p:0, d:0 }; cnt[n].p++; });
      (it.drvD || []).forEach(function(n){ cnt[n] = cnt[n] || { p:0, d:0 }; cnt[n].d++; });
    });
    var arr = Object.keys(cnt).map(function(k){ return { name:k, p:cnt[k].p, d:cnt[k].d, t:cnt[k].p + cnt[k].d }; });
    arr.sort(function(a,b){ return b.t - a.t; });
    if (!arr.length){ el.innerHTML = '<div class="hint">记录中没有可用的归因数据（可能是较早版本存入的记录），重新分析一次即可积累。</div>'; return; }
    var mx = arr[0].t || 1;
    el.innerHTML = arr.slice(0, 6).map(function(x, i){
      return '<div class="drv ' + (i === 0 ? 't1' : i === 1 ? 't2' : '') + '"><span class="rk">' + (i+1) + '</span>' +
        '<span class="nm">' + esc(x.name) + '</span>' +
        '<span class="bar"><i style="width:' + Math.max(3, Math.round(x.t/mx*100)) + '%;background:' + PAL.info + '"></i></span>' +
        '<span class="vv">' + x.t + ' 次</span>' +
        '<span class="lb">高压 ' + x.p + ' / 低爆 ' + x.d + '</span></div>';
    }).join('');
  }
  function renderCorr(list){
    var el = q('insCorr');
    if (list.length < 5){ el.innerHTML = '<div class="hint">需要 ≥5 条记录才能计算相关性（当前 ' + list.length + ' 条）。</div>'; return; }
    var rows = [];
    CORR_FIELDS.forEach(function(c){
      var pairs = [];
      list.forEach(function(it){
        var x = val(it, c), y = it.risk;
        if (typeof x === 'number' && isFinite(x) && typeof y === 'number') pairs.push([x, y]);
      });
      var r = pearson(pairs);
      if (r) rows.push({ name:c.name, r:r.r, n:pairs.length });
    });
    rows.sort(function(a,b){ return Math.abs(b.r) - Math.abs(a.r); });
    if (!rows.length){ el.innerHTML = '<div class="hint">各输入项的变化幅度都不足，无法计算相关性。</div>'; return; }
    el.innerHTML = rows.slice(0, 8).map(function(x){
      var pct = Math.round(Math.abs(x.r) * 100);
      var pos = x.r > 0;
      return '<div class="drv"><span class="rk">' + (pos ? '+' : '−') + '</span>' +
        '<span class="nm">' + esc(x.name) + '</span>' +
        '<span class="bar"><i style="width:' + Math.max(3, pct) + '%;background:' + (pos ? PAL.danger : PAL.ok) + '"></i></span>' +
        '<span class="vv">r=' + x.r.toFixed(2) + '</span><span class="lb">n=' + x.n + '</span></div>';
    }).join('') + '<div class="hint">相关系数只描述「你历史上哪一项与风险分同步变化最明显」，不构成因果，也不代表官方的加权方式；样本量与填写口径都会影响它。</div>';
  }
  /* ---- 两条记录对比 ---- */
  function setCompare(a, b){
    var A = q('cmpA'), B = q('cmpB');
    if (A) A.value = a; if (B) B.value = b;
    renderCompare();
  }
  function renderCompare(){
    var list = History.load();
    var A = q('cmpA'), B = q('cmpB');
    if (!A || !B) return;
    var va = A.value, vb = B.value;
    var ia = list.filter(function(x){ return x.id === va; })[0];
    var ib = list.filter(function(x){ return x.id === vb; })[0];
    var box = q('cmpBox'), dbox = q('cmpDelta');
    if (!ia || !ib || ia.id === ib.id){
      box.innerHTML = '<div class="hint" style="grid-column:1/-1">在上方选择两条<b>不同</b>的记录；也可以在「历史记录」页勾选两条后点「对比所选两条」。</div>';
      dbox.innerHTML = ''; return;
    }
    function col(it, tag){
      var rows = [
        ['时间', History.stamp(it.ts)], ['判定', it.verdict], ['池', it.pool],
        ['综合 / 阈值', it.risk + ' / ' + (it.th || 58)], ['高压 / 低爆', it.pressure + ' / ' + it.suppress],
        ['模式 / 标签', (it.mode || '—') + ' / ' + (it.label || '—')],
        ['F_base / 爆率', it.fbase.toFixed(2) + ' / ' + it.drop.toFixed(2) + '×'],
        ['红品', (it.red != null ? it.red.toFixed(3) + '%' : '—')],
        ['每局 / 效率', (it.avgTime != null ? it.avgTime + '分' : '—') + ' / ' + (it.hourly != null ? it.hourly + 'M/h' : '—')],
        ['硬触发 / 翻转', (it.trig || 0) + ' 项 / ' + (it.flip != null ? it.flip + '%' : '—')]
      ];
      return '<div class="cmp-col"><div class="h">' + tag + '</div>' +
        rows.map(function(r){ return '<div class="cmp-row"><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>'; }).join('') + '</div>';
    }
    box.innerHTML = col(ia, 'A · ' + History.stamp(ia.ts)) + col(ib, 'B · ' + History.stamp(ib.ts));
    /* 差异归因：把 A 的每个输入换成 B 的值，看综合分怎么动 */
    var movers = [];
    var base = ia.input || {};
    var KEYS = ['profitRatio','extractValue','totalGames','playTime','kdSecret','kdTopSecret','hitRate',
                'precisionRate','evacRate','teammateValue','rescueCount','gearValue','dimCombat','dimWealth','dimSearch','dimCoop','dimSurvival'];
    var NAMES = Analyzer.FACTOR_NAME;
    var rA = Analyzer.analyze(base, dimFrom(ia));
    KEYS.forEach(function(k){
      var x = base[k], y = (ib.input || {})[k];
      if (typeof x !== 'number' || typeof y !== 'number' || x === y) return;
      var d2 = {}; for (var j in base) d2[j] = base[j];
      d2[k] = y;
      var rb = Analyzer.analyze(d2, dimFrom(ib));
      movers.push({ k:k, name: labelOf(k), from:x, to:y, dComposite: rb.composite - rA.composite,
                    dP: rb.pressure - rA.pressure, dD: rb.suppress - rA.suppress });
    });
    movers.sort(function(a,b){ return Math.abs(b.dComposite) - Math.abs(a.dComposite); });
    var h = [];
    h.push('<div class="mini-hd">差异归因<span class="q">在 A 的基础上单独换成 B 的该项，综合分如何变化</span></div>');
    if (!movers.length) h.push('<div class="hint">两条记录的输入数值没有差异项（或差异项不参与评分）。</div>');
    movers.slice(0, 7).forEach(function(m, i){
      var up = m.dComposite > 0;
      var w = Math.min(100, Math.abs(m.dComposite) * 4);
      h.push('<div class="drv ' + (i === 0 ? (up ? 't1' : 't2') : '') + '"><span class="rk">' + (i+1) + '</span>' +
        '<span class="nm">' + esc(m.name) + '</span>' +
        '<span class="bar"><i style="width:' + Math.max(3,w) + '%;background:' + (up ? PAL.danger : PAL.ok) + '"></i></span>' +
        '<span class="vv ' + (up ? 'dg' : 'ok') + '">' + (up ? '+' : '') + m.dComposite + '</span>' +
        '<span class="lb">' + fmtNum(m.from) + ' → ' + fmtNum(m.to) + '</span></div>');
    });
    var tot = ib.risk - ia.risk;
    h.push('<div class="hint" style="margin-top:10px">两次综合分实际相差 <b class="' + (tot > 0 ? 'dg' : 'ok') + '">' + (tot > 0 ? '+' : '') + tot + '</b> 分。' +
      (movers.length ? '其中单项影响最大的是「' + esc(movers[0].name) + '」，单独替换即可解释 ' + Math.abs(movers[0].dComposite) + ' 分；其余差异来自多项叠加、赛季阶段与模式池的变化。' : '') +
      ' 注意记录里存的是当时的算法结果，此处按<b>当前算法</b>重算，可能与记录当时略有出入。</div>');
    dbox.innerHTML = h.join('');
  }
  function fmtNum(v){ return (typeof v === 'number' ? (Math.abs(v) >= 100 ? v.toFixed(0) : String(+v.toFixed(2))) : '—'); }
  function labelOf(k){
    var map = { profitRatio:'赚损比', extractValue:'带出价值', totalGames:'战局数', playTime:'游戏时长',
      kdSecret:'机密KD', kdTopSecret:'绝密KD', hitRate:'命中率', precisionRate:'精准击败率', evacRate:'撤离率',
      teammateValue:'带出队友价值', rescueCount:'救助队友', gearValue:'入场战备', dimCombat:'战斗五维',
      dimWealth:'财富五维', dimSearch:'搜索五维', dimCoop:'合作五维', dimSurvival:'生存五维' };
    return map[k] || k;
  }
  function dimFrom(it){ return History.dimsOf(it); }
  /* ---- 诊断文本 ---- */
  function reportText(){
    var list = History.load();
    if (list.length < 2) return '历史记录不足 2 条，暂无法生成历史诊断。';
    var risks = list.map(function(x){ return x.risk; });
    var black = list.filter(function(x){ return x.bucket === 'black'; });
    var L = [];
    L.push('三角洲行动 · 黑屋匹配历史诊断（' + list.length + ' 次分析，' + History.stamp(list[list.length-1].ts) + ' 至 ' + History.stamp(list[0].ts) + '）');
    L.push('综合分：均值 ' + avg(risks).toFixed(1) + '，中位 ' + median(risks).toFixed(1) + '，区间 ' + Math.min.apply(null, risks) + '–' + Math.max.apply(null, risks) + '；首末变化 ' + (risks[0] - risks[risks.length-1]).toFixed(0) + ' 分');
    L.push('判定：黑屋/观察 ' + black.length + ' 次（' + Math.round(black.length/list.length*100) + '%），边缘 ' + list.filter(function(x){ return x.bucket === 'edge'; }).length + ' 次，正常 ' + list.filter(function(x){ return x.bucket === 'normal'; }).length + ' 次');
    var cnt = {};
    list.forEach(function(it){ (it.drvD || []).forEach(function(n){ cnt[n] = (cnt[n] || 0) + 1; }); (it.drvP || []).forEach(function(n){ cnt[n] = (cnt[n] || 0) + 1; }); });
    var top = Object.keys(cnt).sort(function(a,b){ return cnt[b] - cnt[a]; }).slice(0, 3);
    if (top.length) L.push('反复出现的主因：' + top.map(function(k){ return k + '（' + cnt[k] + ' 次）'; }).join('、'));
    ['机密','普通','绝密'].forEach(function(k){
      var s = list.filter(function(x){ return x.mode === k; });
      if (s.length) L.push(k + '池：' + s.length + ' 次，平均综合 ' + avg(s.map(function(x){ return x.risk; })).toFixed(1) + '，平均爆率系数 ' + avg(s.map(function(x){ return x.drop == null ? 1 : x.drop; })).toFixed(2) + '×');
    });
    var tca = list.map(function(x){ return x.trig || 0; });
    L.push('硬触发：平均 ' + avg(tca).toFixed(1) + ' 项/次，最高 ' + Math.max.apply(null, tca) + ' 项');
    L.push('');
    L.push(black.length === 0
      ? '结论：全部记录均未达到黑屋档，账号级调控证据不足。若仍感觉不出货，优先排查每日额度（普通 800 万）与该模式爆率条消耗，并用「换模式/停 1–2 天」做可证伪验证。'
      : (black.length >= list.length * 0.6
        ? '结论：多数记录命中黑屋档且跨期稳定，画像层面的特征（收益效率、击杀强度、战备档位）是主因，属账号级调控的典型形态。建议按「解锁目标」组合调整并维持 10–15 局，再回看趋势是否收敛。'
        : '结论：判定在档位间来回切换，更像是收益节奏与模式池的日常波动，而不是稳定的账号级处理。建议固定时段、固定模式连续记录 5 次以上再判断。'));
    L.push('免责：以上为社区推测模型的统计结果，阈值来自实测与第三方拆解，不代表官方判定；真实算法未公开且可能随版本调整。');
    return L.join('\n');
  }
  function render(){
    var list = History.load();
    var selA = q('cmpA'), selB = q('cmpB');
    if (selA){
      var opts = list.map(function(it){ return '<option value="' + esc(it.id) + '">' + esc(History.stamp(it.ts) + ' · ' + it.risk + '分 · ' + (it.verdict || '') + (it.note ? ' · ' + it.note : '')) + '</option>'; }).join('');
      var va = selA.value, vb = selB.value;
      selA.innerHTML = opts; selB.innerHTML = opts;
      if (va && list.some(function(x){ return x.id === va; })) selA.value = va;
      if (vb && list.some(function(x){ return x.id === vb; })) selB.value = vb;
      else if (list[1]) selB.value = list[1].id;
      if (!va && list[0]) selA.value = list[0].id;
    }
    renderKpis(list); renderDist(list); renderModes(list); renderDrivers(list); renderCorr(list); renderCompare();
    q('insReport').textContent = reportText();
    dirty = false;
  }
  function bind(){
    var t = null;
    ['cmpA','cmpB'].forEach(function(id){
      var el = q(id); if (el) el.addEventListener('change', function(){ renderCompare(); });
    });
    var bc = q('btnCopyInsight');
    if (bc) bc.addEventListener('click', function(){ copy(reportText(), '历史诊断已复制到剪贴板'); });
  }
  function copy(text, okMsg){
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();
      var done = false;
      try { done = document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta);
      window.toast && window.toast(done ? okMsg : '复制失败，请长按选中文本手动复制');
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ window.toast && window.toast(okMsg); }, fallback);
    } else fallback();
  }
  window.InsightView = {
    init: function(){ bind(); },
    invalidate: function(){ dirty = true; },
    render: function(){ render(); },
    renderIfDirty: function(){ if (dirty || !q('insKpis').innerHTML) render(); },
    setCompare: function(a, b){ setCompare(a, b); },
    reportText: reportText, copy: copy
  };
})();
</script>
<script>
/* ============================================================

var SimView = (function(){

    { k:'dimCombat',     n:'五维 · 战斗',   u:'分', min:0,  max:100,  step:1, dim:'combat',    g:'五维标定', hint:'近10局战斗活跃度：高压轴最高权重 24%' },
    { k:'dimSearch',     n:'五维 · 搜索',   u:'分', min:0,  max:100,  step:1, dim:'search',    g:'五维标定', hint:'高值容器加分；过低按活跃度归零限流' },
    { k:'dimSurvival',   n:'五维 · 生存',   u:'分', min:0,  max:100,  step:1, dim:'survival',  g:'五维标定', hint:'与战斗/搜索共同构成三维同向偏离' },
    { k:'dimWealth',     n:'五维 · 财富',   u:'分', min:0,  max:100,  step:1, dim:'wealth',    g:'五维标定', hint:'社区拆解称已辟谣（未获官方证实）：存量资产不压爆率，仅影响匹配档' },
    { k:'dimCoop',       n:'五维 · 合作',   u:'分', min:0,  max:100,  step:1, dim:'coop',      g:'五维标定', hint:'团队正向分，轻微加分' }
  ];
  var SELS = [
    { k:'mainMode', n:'作战模式', opts:[['normal','普通池（红品 0.08%）'],['secret','机密池（红品 0.35%）'],['topsecret','绝密池（红品 0.80%）']] },
    { k:'seasonPhase', n:'赛季阶段', opts:[['early','赛季初'],['mid','赛季中'],['late','赛季末']] },
    { k:'squadType', n:'组队方式', opts:[['solo','单排为主'],['duo','双排为主'],['trio','三排为主'],['mixed','单排/组排混打']] },
    { k:'recentGames', n:'近期波动', opts:[['no','无明显波动'],['up','近期突然变好'],['down','近期突然变差'],['unknown','没注意']] }
  ];
  var byKey = {}; VARS.forEach(function(v){ byKey[v.k] = v; });

  var S = { base:{}, dimBase:{}, over:{}, dimOver:{}, cur:'evacRate', src:'form', built:false, last:null };
  var q = function(id){ return document.getElementById(id); };
  var esc = function(s){ return UI.esc(s); };
  var f2 = function(v,d){ return (typeof v === 'number' && isFinite(v)) ? v.toFixed(d) : '—'; };

  function clone(o){ return JSON.parse(JSON.stringify(o || {})); }
  /* 基线来源：当前录入 / 最近一次分析 / 历史记录 */
  function baseline(kind, id){
    var d = {}, dc = {};
    if (kind === 'rec'){
      var rec = (History.load().filter(function(x){ return x.id === id; })[0]) || History.load()[0];
      if (rec){ d = clone(rec.input || {}); dc = History.dimsOf(rec); }
    } else if (kind === 'last' && window.__lastAnalysis){
      d = clone(window.__lastAnalysis.data); dc = clone(window.__lastAnalysis.dimCal);
    } else if (typeof window.__getFormState === 'function'){
      var st = window.__getFormState(); d = clone(st.data); dc = clone(st.dimCal);
    }
    ['mainMode','seasonPhase','squadType','recentGames','feltExperience'].forEach(function(k){ if (d[k] == null) d[k] = (k==='mainMode'?'secret':(k==='squadType'||k==='recentGames'?(k==='recentGames'?'no':'solo'):(k==='seasonPhase'?'mid':'normal'))); });
    return { d:d, dc:dc };
  }
  function merged(){

  }

  }
  /* 响应曲线 + 降档点：对当前选中变量全域扫描 */
  function scan(key){
    var v = byKey[key], m = merged(), n = 56, out = [];
    var cur = run(m.d, m.dc);
    if (!cur) return null;
    var baseSev = cur.sev, curV = (m.over == null ? null : null);
    var lo = v.min, hi = v.max, span = hi - lo;
    for (var i = 0; i <= n; i++){
      var x = lo + span * i / n;
      var d2 = clone(m.d); d2[key] = x;
      var dc2 = clone(m.dc);
      if (v.dim){ dc2[v.dim] = true; d2[key] = x; }
      var r = run(d2, dc2);
      if (r) out.push({ x:x, red:r.drop.red, gold:r.drop.gold, comp:r.composite, p:r.pressure, dd:r.suppress, sev:r.sev, mult:r.drop.finalMult, verdict:r.verdict });
    }
    /* 找「比当前更优」的最小 Crossing：从当前值向两侧扫描判定档位变化 */
    var curVal = (S.over[key] != null) ? S.over[key] : m.d[key];
    if (typeof curVal !== 'number') curVal = (lo + hi) / 2;
    var cross = null, dir = (baseSev >= 1) ? -1 : 0;
    if (dir === -1){
      /* 目标：档位下降（sev 变小）。分别往两端找最近 crossing */
      [1, -1].forEach(function(sg){
        var prev = baseSev, stepN = 160;
        for (var j = 1; j <= stepN; j++){
          var x2 = curVal + sg * span * j / stepN;
          if (x2 < lo || x2 > hi) break;
          var d3 = clone(m.d); d3[key] = x2;
          var dc3 = clone(m.dc); if (v.dim) dc3[v.dim] = true;
          var r3 = run(d3, dc3); if (!r3) continue;
          if (r3.sev < prev){ if (!cross || Math.abs(x2 - curVal) < Math.abs(cross.x - curVal)) cross = { x:x2, sevFrom:prev, sevTo:r3.sev, verdict:r3.verdict }; break; }
          prev = Math.min(prev, r3.sev);
        }
      });
    }
    return { pts: out, cur: cur, curVal: curVal, cross: cross, v: v, th: cur.thresholds.hi };
  }

  /* ---------- UI ---------- */
  function build(){

      if (v.g !== lastG){ html.push('<div class="fgroup-hd" style="margin-top:14px"><span class="name">' + esc(v.g) + '</span><span class="line"></span></div>'); lastG = v.g; }

        '<span class="sim-mark" id="sim-m-' + v.k + '" title="降档点"></span></div>' +
        '<div class="sim-row-f"><span class="sim-base" id="sim-b-' + v.k + '"></span></div>' +
        '</div>');
    });
    g.innerHTML = html.join('');
    var sg = q('sim-selects');
    sg.innerHTML = SELS.map(function(s){
      return '<div class="field"><label for="sim-s-' + s.k + '">' + esc(s.n) + '</label><select class="ctrl" id="sim-s-' + s.k + '">' +
        s.opts.map(function(o){ return '<option value="' + o[0] + '">' + esc(o[1]) + '</option>'; }).join('') + '</select></div>';
    }).join('');
    /* 曲线图图例 */

      '<span><i style="background:' + PAL.danger + '"></i>判定阈值横线</span><span><i style="background:' + PAL.ink + '"></i>降档点竖线</span>' +
      '<span><i style="background:rgba(23,25,28,.18)"></i>档位底纹：正常 / 边缘 / 黑屋</span>';
    S.built = true;
  }
  function bind(){
    var g = q('sim-sliders');
    if (g) g.addEventListener('input', function(e){
      var el = e.target.closest ? e.target.closest('input[type=range]') : null; if (!el) return;
      var key = el.id.replace('sim-r-', '');
      var v = byKey[key]; if (!v) return;

  function setBaseline(kind, rid){
