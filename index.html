    if (note){
      var t = kind === 'form' ? '当前「数据分析」页的录入值' : (kind === 'last' ? '最近一次完整分析时锁定的快照' : '历史记录快照');

  function fillBaseOptions(){
    var bs = q('sim-sel'); if (!bs) return;
    var keep = bs.value;
    var opts = ['<option value="form">当前录入值</option>'];
    if (window.__lastAnalysis) opts.push('<option value="last">最近一次分析快照</option>');
    var list = History.load().slice(0, 40);
    if (list.length){
      opts.push('<option disabled>—— 历史记录 ——</option>');
      list.forEach(function(it){ opts.push('<option value="rec:' + esc(it.id) + '">' + esc(History.stamp(it.ts) + ' · ' + (it.risk||'—') + '分 · ' + (it.verdict||'')) + '</option>'); });
    }
    bs.innerHTML = opts.join('');
    bs.value = (keep && bs.querySelector('option[value="' + keep + '"]')) ? keep : (window.__lastAnalysis ? 'last' : 'form');
  }
  var pending = false;
  function schedule(){ if (pending) return; pending = true; requestAnimationFrame(function(){ pending = false; render(); }); }

  function render(){
    if (!S.built) build();
    fillBaseOptions();
    var m = merged(), cur = run(m.d, m.dc);
    if (!cur){ q('sim-verdict').innerHTML = '<div class="line-item risk">无法计算：基线数据为空。请先在「数据分析」页填入数据，或选一条历史记录作为基线。</div>'; return; }
    /* 滑块与下拉同步（不回写录入页） */

      } else { de.textContent = ''; de.className = 'sim-delta'; row.classList.remove('changed'); }

      }
    });
    SELS.forEach(function(s){ var el = q('sim-s-' + s.k); if (el) el.value = m.d[s.k] || (s.opts[0][0]); });
    /* 派生量 */
    var dv = cur.derived;
    q('sim-derived').innerHTML =
      kp('每局时长', f2(dv.avgTime,1), '分') + kp('收益效率', f2(dv.yieldMh,2), 'M/h') +
      kp('场均带出', f2(dv.perGameM,2), 'M') + kp('主模式KD', f2(dv.kdMain,2), '') +
      kp('F_base', cur.fbase.value.toFixed(2), '', cur.fbase.tier) +
      kp('输入覆盖率', Math.round(cur.coverage*100), '%');
    /* 判定 + 两轴 + 爆率 */
    var tone = cur.poolTone === 'danger' ? 'sev-danger' : cur.poolTone === 'warn' ? 'sev-warn' : cur.poolTone === 'info' ? 'sev-info' : 'sev-ok';
    var html = [];
    html.push('<div class="verdict ' + tone + '"><div class="vt">模拟结果（未写入历史）</div>');
    html.push('<div class="vh"><span class="vk">' + esc(cur.verdict) + '</span>' +
      '<span class="b ' + (cur.poolTone==='danger'?'danger':cur.poolTone==='warn'?'warn':cur.poolTone==='info'?'info':'ok') + '">综合 ' + cur.composite + ' / 阈值 ' + cur.thresholds.hi.toFixed(0) + '</span>' +
      '<span class="b mute">置信 ' + Math.round(cur.trust*100) + '%</span></div>');
    html.push('<div class="vp">匹配池：' + esc(cur.pool) + ' ｜ 对局标签：' + esc(cur.label.name) + ' ｜ 硬触发 ' + cur.triggers.length + ' 项</div>');
    html.push('<div class="vbadges"><span class="b ' + (cur.pressure>=cur.thresholds.hi?'danger':cur.pressure>=cur.thresholds.mid?'warn':'ok') + '">高压轴 ' + cur.pressure + '</span>' +
      '<span class="b ' + (cur.suppress>=cur.thresholds.hi?'danger':cur.suppress>=cur.thresholds.mid?'warn':'ok') + '">低爆轴 ' + cur.suppress + '</span>' +
      '<span class="b info">红品 ' + cur.drop.red.toFixed(3) + '%</span><span class="b info">金品 ' + cur.drop.gold.toFixed(2) + '%</span>' +
      '<span class="b ' + (cur.drop.finalMult<0.8?'danger':cur.drop.finalMult>=1.05?'ok':'mute') + '">系数 ' + cur.drop.finalMult.toFixed(2) + '×</span>' +
      '<span class="b mute">额度闸门 ' + cur.quota.value.toFixed(2) + '×</span></div></div>');
    q('sim-verdict').innerHTML = html.join('');
    /* 基线 vs 模拟 对比 */
    var bcur = run(S.base, S.dimBase);
    var cmp = q('sim-compare');
    if (bcur){
      var dRed = cur.drop.red - bcur.drop.red, dC = cur.composite - bcur.composite;
      var rows = [
        ['判定', esc(bcur.verdict), esc(cur.verdict), bcur.sev !== cur.sev ? (cur.sev < bcur.sev ? 'ok' : 'dg') : ''],
        ['综合分（阈值 ' + cur.thresholds.hi.toFixed(0) + '）', bcur.composite, cur.composite, dC === 0 ? '' : (dC < 0 ? 'ok' : 'dg')],
        ['高压轴 / 低爆轴', bcur.pressure + ' / ' + bcur.suppress, cur.pressure + ' / ' + cur.suppress, ''],
        ['红品爆率', bcur.drop.red.toFixed(3) + '%', cur.drop.red.toFixed(3) + '%', dRed === 0 ? '' : (dRed > 0 ? 'ok' : 'dg')],
        ['金品爆率', bcur.drop.gold.toFixed(2) + '%', cur.drop.gold.toFixed(2) + '%', ''],
        ['合成爆率系数', bcur.drop.finalMult.toFixed(2) + '×', cur.drop.finalMult.toFixed(2) + '×', ''],
        ['F_base 档位', bcur.fbase.value.toFixed(2) + '<br><i style="font-style:normal;font-size:.66rem;color:var(--t3);font-weight:400">' + esc(bcur.fbase.tier) + '</i>',
         cur.fbase.value.toFixed(2) + '<br><i style="font-style:normal;font-size:.66rem;color:var(--t3);font-weight:400">' + esc(cur.fbase.tier) + '</i>', '']
      ];
      cmp.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>指标</th><th>基线</th><th class="last">当前模拟</th></tr></thead><tbody>' +
        rows.map(function(r){ return '<tr><td>' + r[0] + '</td><td class="n">' + r[1] + '</td><td class="n last ' + r[3] + '">' + r[2] + '</td></tr>'; }).join('') +
        '</tbody></table></div><div class="hint">红品爆率变化 ' + (dRed >= 0 ? '+' : '') + (dRed * 100).toFixed(1) + ' 个基点（0.01% = 1 个基点），综合分变化 ' + (dC > 0 ? '+' : '') + dC + ' 分。' +
        '本表仅在本页显示，不会写入历史记录，也不影响「历史分析」的统计口径。</div>';
    }
    /* 曲线 */
    VARS.forEach(function(v){
      var r = document.querySelector('.sim-row[data-k="' + v.k + '"]');
      if (r) r.classList.toggle('active', v.k === S.cur);
    });
    var sc = scan(S.cur);
    S.last = { cur: cur, scan: sc };
    if (sc){
      q('sim-curve-name').textContent = sc.v.n + ' → 红品爆率 / 综合分';
      Charts.curve(q('sim-curve'), {
        pts: sc.pts, th: sc.th, curVal: sc.curVal, cross: sc.cross, v: sc.v, base: bcur ? bcur.drop.red : null
      });
      var mk = q('sim-m-' + S.cur);
      VARS.forEach(function(v){ var e2 = q('sim-m-' + v.k); if (e2){ e2.style.display = 'none'; e2.removeAttribute('data-x'); } });
      if (sc.cross && mk){
        var pct = (sc.cross.x - sc.v.min) / (sc.v.max - sc.v.min) * 100;
        mk.style.display = 'block'; mk.style.left = Math.max(0, Math.min(100, pct)) + '%';
        mk.setAttribute('title', '降到 ' + sc.cross.sevTo + ' 档：' + fmt(sc.cross.x, sc.v) + (sc.v.u||''));
        q('sim-curve-hint').innerHTML = '当前 <b>' + esc(sc.v.n) + '</b> = ' + fmt(sc.curVal, sc.v) + (sc.v.u||'') +
          '；<b class="ok">降到「' + esc(sc.cross.verdict) + '」需要 ' + fmt(sc.cross.x, sc.v) + (sc.v.u||'') + '</b>' +
          '<button class="btn tiny on" type="button" id="sim-jump" style="margin-left:8px">跳到该点</button>' +
          '　左/右拖动即在该点两侧模拟。';
        var jb = q('sim-jump');
        if (jb) jb.addEventListener('click', function(){ S.over[S.cur] = sc.cross.x; schedule(); });
      } else if (mk) {
        q('sim-curve-hint').innerHTML = '当前 <b>' + esc(sc.v.n) + '</b> = ' + fmt(sc.curVal, sc.v) + (sc.v.u||'') +
          '，在本变量整个可调区间内<b>都没有出现判定降档</b>（曲线上的平台段即为该变量的作用上限）。需要组合调整多个变量才能降档。';
      }
    }
    q('sim-touched').textContent = Object.keys(S.over).length ? ('已改动 ' + Object.keys(S.over).length + ' 个变量') : '未改动（与基线一致）';
  }
  function kp(k, v, u, sub){
    return '<div class="kpi"><div class="k">' + esc(k) + '</div><div class="v mute">' + esc(v) + (u ? '<span class="u">' + esc(u) + '</span>' : '') +
      (sub ? '<div style="font-size:.62rem;color:var(--t4);font-weight:400">' + esc(sub) + '</div>' : '') + '</div></div>';
  }
  function fmt(v, def){
    if (typeof v !== 'number' || !isFinite(v)) return '—';
    var d = def.step >= 1 ? 0 : (def.step >= 0.5 ? 1 : 2);
    return v.toFixed(d);
  }

  return {
    init: function(){ bind(); bindCurveClicks(); },
    bindCurveClicks: bindCurveClicks,
    /* 从报告页的「解锁目标」直接跳到模拟器：只影响本页快照 */
    openWith: function(key, toVal){
      if (!byKey[key]) return;
      if (!S.built) build();
      if (!Object.keys(S.base).length || S.src !== 'last') setBaseline(window.__lastAnalysis ? 'last' : 'form');
      S.cur = key; S.over[key] = Math.max(byKey[key].min, Math.min(byKey[key].max, Number(toVal)));
      if (byKey[key].dim) S.dimOver[byKey[key].dim] = true;
      if (typeof window.showView === 'function') window.showView('sim');
      render();
    },
    refresh: function(){ if (!S.built) build(); if (!Object.keys(S.base).length) setBaseline('form'); else render(); },
    isDirty: function(){ return !S.built || !Object.keys(S.base).length; },
    state: function(){ return S; }
  };
})();
</script>
<script>
/* ============================================================
   SECTION: app controller
   ============================================================ */
(function(){
  var NUM_IDS = ['profitRatio','extractValue','totalReward','totalGames','playTime','kdSecret','kdTopSecret',
                 'hitRate','precisionRate','evacRate','teammateValue','rescueCount','gearValue'];
  var SEL_IDS = ['seasonPhase','mainMode','squadType','recentGames','feltExperience'];
  var DIM_IDS = ['dimCombat','dimWealth','dimSearch','dimCoop','dimSurvival'];
  var DIM_KEYS = { dimCombat:'combat', dimWealth:'wealth', dimSearch:'search', dimCoop:'coop', dimSurvival:'survival' };
  var RANGES = { hitRate:[0,100], precisionRate:[0,100], evacRate:[0,100], totalGames:[0,5000], playTime:[0,100000],
                 gearValue:[0,2000], profitRatio:[0,50], extractValue:[0,20000], totalReward:[0,20000],
                 kdSecret:[0,50], kdTopSecret:[0,50], teammateValue:[0,20000], rescueCount:[0,5000] };
  var DRAFT_KEY = ['delta','blackroom','draft','v6'].join('_');
  var DRAFT_OLD = 'delta_b' + String.fromCharCode(0x2026) + 't_v6';
  var warn = [];

  function q(id){ return document.getElementById(id); }
  function num(id){
    var el = q(id); if (!el) return null;
    var raw = (el.value || '').trim();
    if (raw === '') return null;
    var v = parseFloat(raw);
    if (!isFinite(v)) return null;
    var r = RANGES[id];
    if (v < 0){ warn.push(labelOf(id) + '（负数已忽略）'); el.value = ''; return null; }
    if (r && v > r[1]){ warn.push(labelOf(id) + '（超上限，按 ' + r[1] + ' 计）'); v = r[1]; }
    return v;
  }
  function labelOf(id){
    var el = q(id);
    var lab = el && el.parentNode ? el.parentNode.querySelector('label') : null;
    return lab ? lab.textContent.replace(/\s*\*$/,'') : id;
  }
  /* dimTouched 一律用短名（combat/wealth/...），这里必须按短名取值 */
  var dimTouched = { combat:false, wealth:false, search:false, coop:false, survival:false };
  function dimCalibrated(){
    var o = {};
    for (var k in dimTouched) o[k] = dimTouched[k] === true;
    return o;
  }

  function gatherData(){
    warn = [];
    var d = { mainMode:'secret', seasonPhase:'mid', squadType:'solo', recentGames:'no', feltExperience:'normal' };
    NUM_IDS.forEach(function(id){ d[id] = num(id); });
    SEL_IDS.forEach(function(id){ var el = q(id); if (el) d[id] = el.value; });
    DIM_IDS.forEach(function(id){ d[id] = parseInt(q(id).value, 10); });
    var bad = warn.slice();
    return { data:d, bad:bad };
  }

  /* ---------- 草稿 ---------- */
  var draftTimer = null;
  function saveDraft(){
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function(){
      try{
        var o = { f:{}, t:{}, m:{}, d:dimTouched, ts:Date.now() };
        NUM_IDS.forEach(function(id){ o.f[id] = q(id).value; });
        SEL_IDS.forEach(function(id){ o.m[id] = q(id).value; });
        DIM_IDS.forEach(function(id){ o.t[id] = q(id).value; });
        localStorage.setItem(DRAFT_KEY, JSON.stringify(o));
      }catch(e){}
    }, 400);
  }
  function loadDraft(){
    var raw = null;
    try{
      raw = localStorage.getItem(DRAFT_KEY);
      if (!raw && DRAFT_OLD){
        var old = localStorage.getItem(DRAFT_OLD);      /* 兼容旧键，搬家一次 */
        if (old){ localStorage.setItem(DRAFT_KEY, old); localStorage.removeItem(DRAFT_OLD); raw = old; }
      }
    }catch(e){ return false; }
    if (!raw) return false;
    var o;
    try{ o = JSON.parse(raw); }catch(e){ return false; }
    if (!o || !o.f) return false;
    NUM_IDS.forEach(function(id){ if (q(id) && o.f[id] != null) q(id).value = o.f[id]; });
    SEL_IDS.forEach(function(id){ if (q(id) && o.m[id]) q(id).value = o.m[id]; });
    DIM_IDS.forEach(function(id){ if (q(id) && o.t[id] != null) q(id).value = o.t[id]; });
    if (o.d) for (var k in dimTouched) dimTouched[k] = !!o.d[k];
    return true;
  }
  window.__fillForm = function(input, rec){
    NUM_IDS.forEach(function(id){ if (q(id)) q(id).value = input && input[id] != null ? String(input[id]) : ''; });
    SEL_IDS.forEach(function(id){ if (q(id) && input && input[id]) q(id).value = input[id]; });
    DIM_IDS.forEach(function(id){ if (q(id)) q(id).value = input && input[id] != null ? String(input[id]) : '50'; });
    var dt = (typeof History !== 'undefined' && rec) ? History.dimsOf(rec) : (input && input.dimsTouched) || null;
    if (dt) for (var k in dimTouched) dimTouched[k] = !!dt[k];
    syncDimUi(); preflight(); saveDraft();
  };

  /* ---------- 五维 ---------- */
  function syncDimUi(){
    DIM_IDS.forEach(function(id){
      var key = DIM_KEYS[id], el = q(id);
      var nm = q(id + 'Num');
      /* 正在数字框里输入时不回写，避免打断键入（如连续输入 "1" "0" 组成 10） */
      if (nm && document.activeElement !== nm) nm.value = el.value;
      var row = el.closest('.dim-row');
      if (row){
        row.classList.toggle('touched', !!dimTouched[key]);
        var un = row.querySelector('.unset');
        if (un) un.textContent = dimTouched[key] ? '已标定' : '未标定';
        if (un) un.style.color = dimTouched[key] ? 'var(--brand)' : '';
      }
    });
    drawRadar();
  }
  var radarPending = false;
  function drawRadar(){
    if (radarPending) return;
    radarPending = true;
    requestAnimationFrame(function(){
      radarPending = false;
      var vals = DIM_IDS.map(function(id){ return parseInt(q(id).value, 10); });
      var touched = DIM_IDS.map(function(id){ return !!dimTouched[DIM_KEYS[id]]; });
      try{ Charts.radar(q('radarCanvas'), vals, touched); }catch(e){}
      var n = touched.filter(Boolean).length;
      /* 说明性文案不上界面：仅显示标定进度 */
      q('dimNote').textContent = n === 0 ? '' : '已标定 ' + n + '/5';
    });
  }

  /* ---------- 实时预检（轻计算，不产生历史） ---------- */
  var pfTimer = null;
  function preflight(){
    clearTimeout(pfTimer);
    pfTimer = setTimeout(function(){
      var g = gatherData(), d = g.data;
      var filled = NUM_IDS.filter(function(id){ return d[id] != null; }).length;
      q('pfCount').textContent = filled + '/' + NUM_IDS.length;
      var r = null;
      try{ r = Analyzer.compute(d, { light:true, dimCalibrated: dimCalibrated() }); }catch(e){}
      var cov = r ? Math.round(r.coverage * 100) : 0;
      q('pfCov').textContent = cov + '%';
      q('pfBar').style.width = Math.min(100, cov) + '%';
      var el = q('pfFlag');
      if (!r || filled === 0){ el.className = 'pf-k pf-flag'; el.textContent = '填写数据后开始判定'; return; }
      if (r.verdictKey === 'unknown'){ el.className = 'pf-k pf-flag'; el.textContent = '数据不足（覆盖率 ' + cov + '%）'; return; }
      el.className = 'pf-k pf-flag' + (r.sev <= 0 ? ' ok' : '');
      el.textContent = '预判：' + r.verdict + ' 综合 ' + r.composite + '／阈值 ' + Math.round(r.thresholds.hi) +
        (r.triggers.length ? ' · 硬触发 ' + r.triggers.length : '');
      if (g.bad.length) el.textContent += ' · ' + g.bad.length + ' 项口径已修正';
    }, 160);
  }

  /* ---------- 分析主流程（无假进度） ---------- */
  var btn = q('btnAnalyze'), bar = q('calcbar'), calcText = q('calcText'), calcMs = q('calcMs');
  var overlay = q('modalOverlay'), body = q('sheetBody');
  var running = false;

  function run(opts){
    if (running) return;
    var g = gatherData(), d = g.data;
    var filled = NUM_IDS.filter(function(id){ return d[id] != null; }).length;
    if (!filled && !(opts && opts.force)){
      window.toast && window.toast('请至少填写一项面板数据（战局数、赚损比、KD、撤离率…）');
      q('totalGames').focus();
      return;
    }
    running = true;
    btn.disabled = true; btn.classList.add('busy');
    q('btnAnalyzeText').textContent = '计算中';
    bar.classList.add('busy');
    calcText.textContent = g.bad.length ? ('口径修正：' + g.bad.join('；')) : '正在本机计算…';
    calcMs.textContent = '';
    /* 让按钮禁用态与骨架先绘制一帧，再做重计算，避免点击后出现「卡住」的观感 */
    requestAnimationFrame(function(){
      setTimeout(function(){
        var t0 = performance.now(), res = null;
        try{
          res = Analyzer.analyze(d, dimCalibrated());
        }catch(err){
          running = false; btn.disabled = false; btn.classList.remove('busy');
          q('btnAnalyzeText').textContent = '立即分析'; bar.classList.remove('busy');
          calcText.textContent = '计算异常：' + err.message;
          return;
        }
        var t1 = performance.now();
        try{
          window.__lastAnalysis = { data: JSON.parse(JSON.stringify(d)),
            dimCal: JSON.parse(JSON.stringify(dimCalibrated())), at: Date.now(), composite: res.composite, verdict: res.verdict };
        }catch(e){}
        try{
          if (typeof History !== 'undefined' && res.verdictKey !== 'unknown' && !(opts && opts.suppressHistory)){
            var dt = { combat:dimTouched.combat, wealth:dimTouched.wealth, search:dimTouched.search,
                       coop:dimTouched.coop, survival:dimTouched.survival };
            res.dimsTouched = dt; d.dimsTouched = dt;
            History.save(d, res);
          }
        }catch(e){ console.warn('history save failed', e); }
        try{
          UI.render(d, res, metaOf(res, !!opts && !!opts.title, opts && opts.title));
          openSheet(opts && opts.title ? opts.title : '黑屋匹配分析报告');
        }catch(err){
          openSheet('报告渲染异常');
          body.innerHTML = '<div class="line-item risk">渲染出错：' + UI.esc(err.message) + '。分析计算已完成，请把此行反馈以便修复。</div>';
          console.error(err);
        }
        var t2 = performance.now();
        running = false;
        btn.disabled = false; btn.classList.remove('busy');
        q('btnAnalyzeText').textContent = '再次分析';
        bar.classList.remove('busy');
        calcText.textContent = '完成 · 算法 ' + Math.round(t1-t0) + 'ms（含 ' + (res.stability ? res.stability.N : 0) + ' 次扰动重算与降档反解）+ 渲染 ' + Math.round(t2-t1) + 'ms';
        calcMs.textContent = '共 ' + Math.round(t2-t0) + 'ms';
        try{ HistoryView.refresh(); }catch(e){ console.warn('history refresh failed', e); }
        InsightView.invalidate();
      }, 16);
    });
  }
  function metaOf(r, isReplay, title){
    var sb = r.seasonBasis ? r.seasonBasis.label + ' · ' : '';
    return (isReplay ? '回放 · ' : '') + sb + '引擎 ' + r.version + ' · 阈值 ' + Math.round(r.thresholds.hi) + ' · 置信 ' + Math.round(r.trust*100) + '%';
  }
  function openSheet(title){
    q('sheetTitle').textContent = title || '黑屋匹配分析报告';
    overlay.classList.add('on');
    document.body.classList.add('sheet-open');
    document.body.style.overflow = 'hidden';
    var sheet = q('sheet');
    sheet.setAttribute('tabindex','-1');
    try{ sheet.focus({ preventScroll:true }); }catch(e){}
    lastFocus = document.activeElement;
  }
  var lastFocus = null;
  function closeSheet(){
    overlay.classList.remove('on');
    document.body.classList.remove('sheet-open');
    document.body.style.overflow = '';
    try{ HistoryView.refresh(); }catch(e){}
    InsightView.invalidate();
  }
  window.__showReport = function(input, opts){
    opts = opts || {};
    var res = Analyzer.analyze(input, opts.dimCalibrated || (input && input.dimsTouched) || {});
    /* 历史回放：用记录里存的标定标记，避免把未标定项当观测值 */
    UI.render(input, res, metaOf(res, true, true));
    openSheet((opts && opts.title) || '历史记录回放');
  };

  /* ---------- 结果窗口交互（事件委托，一次绑定） ---------- */
  /* ---- 供「爆率模拟」沙盒页读取的只读出口（不回写、不落盘） ---- */
  window.__getFormState = function(){
    var g = gatherData();
    return { data: g.data, dimCal: dimCalibrated() };
  };
  window.__lastAnalysis = null;

  function bindSheet(){
    q('modalClose').addEventListener('click', closeSheet);
    q('btnCloseFoot').addEventListener('click', closeSheet);
    overlay.addEventListener('click', function(e){ if (e.target === overlay) closeSheet(); });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && overlay.classList.contains('on')) closeSheet();
    });
    q('btnRerun').addEventListener('click', function(){ closeSheet(); run({ suppressHistory:true }); });
    q('btnToHistory').addEventListener('click', function(){ closeSheet(); showView('history'); });
    q('btnCopyReport').addEventListener('click', function(){
      var g = gatherData();
      try{
        var res = Analyzer.analyze(g.data, dimCalibrated());
        InsightView.copy(UI.plainText(g.data, res), '报告全文已复制到剪贴板');
      }catch(e){ window.toast && window.toast('复制失败：' + e.message); }
    });
    /* 折叠 + 锚点 */
    function toggle(sec, force){
      var el = typeof sec === 'string' ? q('sec-' + sec) : sec;
      if (!el) return;
      if (force === true) el.classList.add('open');
      else if (force === false) el.classList.remove('open');
      else el.classList.toggle('open');
    }
    body.addEventListener('click', function(e){
      var sim = e.target.closest ? e.target.closest('[data-sim]') : null;
      if (sim){
        e.stopPropagation();
        if (typeof SimView === 'undefined'){ window.toast && window.toast('模拟器未就绪'); return; }
        closeSheet();
        SimView.openWith(sim.getAttribute('data-sim'), sim.getAttribute('data-simto'));
        window.toast && window.toast('已在沙盒中载入该方案，录入值与历史未改动');
        return;
      }
      var hd = e.target.closest ? e.target.closest('.sec-hd') : null;
      if (hd && hd.parentNode && hd.parentNode.classList.contains('sec')) hd.parentNode.classList.toggle('open');
    });
    body.addEventListener('keydown', function(e){
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var hd = e.target.closest ? e.target.closest('.sec-hd') : null;
      if (hd){ e.preventDefault(); hd.parentNode.classList.toggle('open'); }
    });
    q('sheetAnchors').addEventListener('click', function(e){
      var b = e.target.closest ? e.target.closest('button[data-sec]') : null;
      if (!b) return;
      Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      var id = b.getAttribute('data-sec');
      toggle(id, true);
      var sec = q('sec-' + id);
      if (sec) body.scrollTo({ top: Math.max(0, sec.offsetTop - 8), behavior: 'smooth' });
    });
  }

  /* ---------- 表单绑定 ---------- */
  function bindForm(){
    NUM_IDS.forEach(function(id){
      var el = q(id); if (!el) return;
      el.addEventListener('input', function(){
        el.classList.remove('bad');
        var v = parseFloat(el.value);
        var r = RANGES[id];
        if (isFinite(v) && r && (v < 0 || v > r[1])) el.classList.add('bad');
        preflight(); saveDraft();
      });
      el.addEventListener('blur', function(){ preflight(); });
    });
    SEL_IDS.forEach(function(id){
      var el = q(id); if (el) el.addEventListener('change', function(){ preflight(); saveDraft(); });
    });
    DIM_IDS.forEach(function(id){
      var el = q(id); if (!el) return;
      var nm = q(id + 'Num');
      /* 拖拉滑块：原有方式，拖动即标定 */
      el.addEventListener('input', function(){
        dimTouched[DIM_KEYS[id]] = true;
        syncDimUi(); preflight(); saveDraft();
      });
      /* 直接输入数字：与滑块实时同步，输入即标定 */
      if (nm){
        nm.addEventListener('input', function(){
          var v = parseInt(nm.value, 10);
          if (!isFinite(v)) return;                     /* 输入中间态（空值/负号）不处理 */
          v = Math.max(0, Math.min(100, v));
          el.value = v;
          dimTouched[DIM_KEYS[id]] = true;
          syncDimUi(); preflight(); saveDraft();
        });
        nm.addEventListener('blur', function(){
          var v = parseInt(nm.value, 10);
          if (!isFinite(v)){ nm.value = el.value; return; }   /* 非法输入回退为滑块当前值 */
          v = Math.max(0, Math.min(100, v));
          nm.value = v; el.value = v;
          dimTouched[DIM_KEYS[id]] = true;
          syncDimUi(); preflight(); saveDraft();
        });
        nm.addEventListener('keydown', function(e){
          if (e.key === 'Enter'){ nm.blur(); }
        });
      }
    });
    q('btnDimReset').addEventListener('click', function(){
      DIM_IDS.forEach(function(id){
        q(id).value = 50;
        var nm = q(id + 'Num'); if (nm) nm.value = 50;
        dimTouched[DIM_KEYS[id]] = false;
      });
      syncDimUi(); preflight(); saveDraft();
      window.toast && window.toast('五维已复原为「未标定」');
    });
    q('btnPreset').addEventListener('click', function(){
      var p = { profitRatio:'1.15', extractValue:'286', totalReward:'96', totalGames:'268', playTime:'5360',
                kdSecret:'1.24', kdTopSecret:'0.86', hitRate:'29.4', precisionRate:'38.2', evacRate:'33.6',
                teammateValue:'18.5', rescueCount:'72', gearValue:'26' };
      for (var k in p) q(k).value = p[k];
      q('mainMode').value = 'secret'; q('seasonPhase').value = 'mid'; q('squadType').value = 'solo';
      ['combat','search','survival'].forEach(function(k){ dimTouched[k] = true; });
      q('dimCombat').value = 62; q('dimSearch').value = 58; q('dimSurvival').value = 55;
      syncDimUi(); preflight(); saveDraft();
      window.toast && window.toast('已填入示例（战斗/搜索/生存三项已标定）');
    });
    q('btnClearForm').addEventListener('click', function(){
      NUM_IDS.forEach(function(id){ q(id).value = ''; q(id).classList.remove('bad'); });
      DIM_IDS.forEach(function(id){ q(id).value = 50; dimTouched[DIM_KEYS[id]] = false; });
      q('mainMode').value = 'secret'; q('seasonPhase').value = 'mid'; q('squadType').value = 'solo';
      q('recentGames').value = 'no'; q('feltExperience').value = 'normal';
      syncDimUi(); preflight(); saveDraft();
      calcText.textContent = '已清空录入（历史记录不受影响）'; calcMs.textContent = '';
      window.toast && window.toast('录入已清空');
    });
    btn.addEventListener('click', function(){ run({}); });
  }

  /* ---------- 页签 ---------- */
  var lazyInit = { history:false, insight:false, sim:false };
  function showView(name){
    Array.prototype.forEach.call(document.querySelectorAll('.view'), function(v){
      v.classList.toggle('on', v.id === 'view-' + name);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.tab-btn'), function(b){
      var on = b.getAttribute('data-view') === name;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    if (name === 'history') { try{ if(!lazyInit.history){ HistoryView.init(); lazyInit.history=true; } HistoryView.renderAll(); }catch(e){ console.warn(e); } }
    if (name === 'insight'){ try{ if(!lazyInit.insight){ InsightView.init(); lazyInit.insight=true; } InsightView.renderIfDirty(); }catch(e){ console.warn(e); } }
    if (name === 'sim'){ try{ if(!lazyInit.sim){ SimView.init(); lazyInit.sim=true; } SimView.refresh(); }catch(e){ console.warn(e); } }
    window.scrollTo(0, 0);
  }
  window.showView = showView;
  function bindTabs(){
    Array.prototype.forEach.call(document.querySelectorAll('.tab-btn'), function(b){
      b.addEventListener('click', function(){ showView(b.getAttribute('data-view')); });
    });
  }
  /* ---------- toast（带可选「撤销」动作） ---------- */
  var toastEl = q('toastBox'), toastTimer = null;
  window.toast = function(msg, action){
    if (!toastEl) return;
    toastEl.innerHTML = '';
    var s = document.createElement('span'); s.textContent = msg; toastEl.appendChild(s);
    if (typeof action === 'function'){
      var a = document.createElement('span'); a.className = 'undo'; a.textContent = '撤销';
      a.addEventListener('click', function(){
        toastEl.classList.remove('on','has-action'); clearTimeout(toastTimer);
        action(); window.toast('已撤销');
      });
      toastEl.appendChild(a);
    }
    toastEl.classList.toggle('has-action', typeof action === 'function');
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); toastEl.classList.remove('has-action'); }, action ? 7000 : 2600);
  };
  function boot(){
    var t0 = performance.now();
    var restored = loadDraft();
    bindForm(); bindTabs(); bindSheet(); syncDimUi();
    /* v7.4：非首屏模块改为首次进入对应页签时再初始化，降低启动与常驻开销 */
    try{
      var hc = document.getElementById('tabHistCount');
      if (hc){ var hn = History.load().length; hc.textContent = hn ? String(hn) : ''; }
    }catch(e){ console.warn(e); }


    preflight();
    var t1 = performance.now();
    calcText.textContent = restored
      ? '已恢复草稿 · ' + Math.round(t1-t0) + 'ms'
      : '尚未运行';
    calcMs.textContent = restored ? '' : '';
    /* 首屏后再绘制一次，避免与首屏布局争抢 */
    requestAnimationFrame(drawRadar);
    var rt = null;
    window.addEventListener('resize', function(){
      clearTimeout(rt);
      rt = setTimeout(function(){
        drawRadar();
        try{ if (q('view-history').classList.contains('on')) HistoryView.renderAll(); }catch(e){}
      }, 240);
    }, { passive:true });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
<script>
/* ============================================================
   SECTION: shell（顶栏标题 / 右侧竖轨 / 入场节奏）
   ------------------------------------------------------------
   只负责界面外壳，不参与任何推测计算。
   与原 app controller 的分工：切换视图时先做过渡，再交给
   window.showView 处理懒初始化与数据刷新。
   ============================================================ */
(function(){
  'use strict';

  var TITLES = {
    analysis: '数据分析',
    history:  '历史记录',
    insight:  '历史分析',
    sim:      '爆率模拟'
  };
  var BASE_TITLE = '三角洲行动 · 黑屋匹配推测系统 v8.6';
  var current = 'analysis';

  function q(id){ return document.getElementById(id); }

  function updateChrome(name){
    var titleEl = q('pageTitle');
    if (titleEl) titleEl.textContent = TITLES[name] || TITLES.analysis;
    document.title = (name === 'analysis') ? BASE_TITLE : BASE_TITLE + ' · ' + TITLES[name];
    var items = document.querySelectorAll('.rail-item');
    for (var i = 0; i < items.length; i++){
      var b = items[i];
      var on = b.getAttribute('data-view') === name;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      /* 未选中仅图标，用原生 title 作悬停提示；选中项常显名称，无需提示 */
      if (on) b.removeAttribute('title');
      else b.setAttribute('title', TITLES[b.getAttribute('data-view')] || '');
    }
  }

  function go(name){
    if (!TITLES[name] || name === current) return;
    var oldView = document.querySelector('.view.on');
    if (oldView && oldView.id !== 'view-' + name){
      /* 退场：短距离上移 + 淡出 + 轻微模糊，位移很小，不飞出视口 */
      oldView.classList.remove('on');
      oldView.classList.add('leaving');
      window.setTimeout(function(){ oldView.classList.remove('leaving'); }, 210);
    }
    if (typeof window.showView === 'function') window.showView(name);
    else {
      var nv = q('view-' + name);
      if (nv){
        var all = document.querySelectorAll('.view');
        for (var j = 0; j < all.length; j++) all[j].classList.remove('on');
        nv.classList.add('on');
      }
    }
    current = name;
    updateChrome(name);
  }

  function bind(){
    var items = document.querySelectorAll('.rail-item');
    for (var i = 0; i < items.length; i++){
      (function(b){
        b.addEventListener('click', function(){ go(b.getAttribute('data-view')); });
        b.addEventListener('keydown', function(e){
          if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
            e.preventDefault();
            go(b.getAttribute('data-view'));
          }
        });
      })(items[i]);
    }
    updateChrome(current);
  }

  function boot(){
    bind();
    /* 首帧后再放开入场过渡，避免与首屏布局争抢；错峰延迟在 CSS 中按序给定 */
    window.requestAnimationFrame(function(){
      window.requestAnimationFrame(function(){
        document.documentElement.classList.add('ready');
      });
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
