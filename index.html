<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2315181b' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='24' height='24' rx='5' fill='%23ffffff' stroke='none'/%3E%3Cpath d='M4 18V10l4-3 4 3v8'/%3E%3Cpath d='M12 14h8v4'/%3E%3Cpath d='M16 14v-3'/%3E%3C/svg%3E">
<title>三角洲行动 · 黑屋匹配推测系统 v8.6</title>
<meta name="description" content="《三角洲行动》S12 赛季黑屋匹配推测与爆率分析工具，完全本地运行。">
<style>
/* ============================================================
   三角洲行动 · 黑屋匹配推测系统
   设计系统：中性浅色 / 同心圆角 / 多层柔和阴影 / 统一线性图标
   ------------------------------------------------------------
   约定
   1. 颜色只走语义令牌，禁止在组件内硬编码色值（#fff/#000 除外）
   2. 圆角同心：外层半径 = 内层半径 + 内边距（24-16=8 / 12-4=8）
   3. 间距只用 4/8/12/16/24/32/48 七档
   4. 所有数字使用等宽数字（tabular-nums），避免数值跳动时位移
   5. 不使用装饰性渐变、发光、emoji 与感叹号
   ============================================================ */

/* ---------- 1. 令牌 ---------- */
:root{
  /* 中性灰阶：底色略暗于面板，靠明度差分层，不靠边框 */
  --bg:#f4f5f6;
  --bg-sunken:#edeef0;
  --panel:#ffffff;
  --panel-2:#f7f8f9;
  --panel-3:#f0f1f3;

  --ink:#15181b;
  --ink-2:#4a5057;
  --ink-3:#878d94;
  --ink-4:#adb2b8;

  --line:#e5e7ea;
  --line-2:#d8dbdf;

  /* 语义色：低饱和、深色化，保证浅底上的对比度 */
  --ok:#0f6f5c;
  --ok-bg:#e9f2f0;
  --warn:#8a5a12;
  --warn-bg:#f7f1e5;
  --danger:#b3382f;
  --danger-bg:#f8edeb;
  --info:#3b4f86;
  --info-bg:#eceff6;

  /* 圆角：固定档位 */
  --r-1:6px;
  --r-2:8px;
  --r-3:10px;
  --r-4:12px;
  --r-6:20px;
  --r-7:24px;
  --r-pill:999px;

  /* 间距：固定档位 */
  --s-1:4px;
  --s-2:8px;
  --s-3:12px;
  --s-4:16px;
  --s-5:24px;
  --s-6:32px;
  --s-7:48px;

  /* 多层柔和阴影：替代实线边框 */
  --sh-1:0 1px 2px rgba(21,24,27,.05);
  --sh-2:0 1px 2px rgba(21,24,27,.04), 0 2px 6px rgba(21,24,27,.035);
  --sh-3:0 1px 3px rgba(21,24,27,.035), 0 8px 20px rgba(21,24,27,.05);
  --sh-4:0 2px 6px rgba(21,24,27,.05), 0 24px 56px rgba(21,24,27,.10);

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;

  /* 快起轻收：起步快、收尾缓，避免机械匀速 */
  --ease:cubic-bezier(.22,.68,.24,1);
  --ease-out:cubic-bezier(.16,.84,.44,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  font-size:14px;
  line-height:1.6;
  color:var(--ink-2);
  background:var(--bg);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  /* 等宽数字：数值刷新时字符宽度不变，避免左右位移 */
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}
input,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;color:inherit}
a{color:var(--info);text-decoration:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--r-1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grow{flex:1}
.num,.mono,.n,.v,.vv,.hs-v,.hscore,.meta,.dt{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- 2. 骨架 ---------- */
.app{
  max-width:1120px;
  margin:0 auto;
  padding:0 var(--s-5) calc(var(--s-7) + env(safe-area-inset-bottom));
}

/* 透明顶栏：无实心底色，与页面背景连续 */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--s-4);
  padding:var(--s-5) 0 var(--s-4);
}
.brand{display:flex;align-items:center;gap:var(--s-3);min-width:0}
.brand-mark{
  display:grid;place-items:center;
  width:34px;height:34px;flex:0 0 auto;
  border-radius:var(--r-2);
  background:var(--panel);
  box-shadow:var(--sh-2);
  color:var(--ink);
}
.brand-mark svg{width:19px;height:19px;display:block}
.brand-tx{display:flex;flex-direction:column;min-width:0}
.brand-tx b{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:.01em;line-height:1.35}
.brand-tx i{font-size:11.5px;font-style:normal;color:var(--ink-3);line-height:1.4;letter-spacing:.04em}
.topbar-meta{display:flex;align-items:center;gap:var(--s-2);flex:0 0 auto}

/* 状态标签：无边框、无描边徽章感 */
.tag{
  font-size:11.5px;
  letter-spacing:.03em;
  color:var(--ink-2);
  background:var(--panel);
  border-radius:var(--r-pill);
  padding:5px 11px;
  box-shadow:var(--sh-1);
  white-space:nowrap;
}
.tag-quiet{background:transparent;box-shadow:none;color:var(--ink-3);padding-left:2px;padding-right:2px}

/* 主体：左内容 + 右竖轨（贴右） */
.stage{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:var(--s-6);
  align-items:start;
}
.main{min-width:0;position:relative}

/* 页面大标题：标明当前位置 */
.page-head{padding:var(--s-2) 0 var(--s-5)}
.page-head h1{
  font-size:26px;
  font-weight:600;
  letter-spacing:-.015em;
  color:var(--ink);
  line-height:1.25;
  /* 标题均衡换行：末行不留单个词 */
  text-wrap:balance;
}
.page-sub{
  margin-top:var(--s-2);
  font-size:13px;
  color:var(--ink-3);
  max-width:46ch;
  text-wrap:pretty;
}

/* 右侧竖轨：融入背景，未选中仅图标 */
.rail{
  position:fixed;
  right:var(--s-5);
  top:50%;
  transform:translateY(-50%);
  z-index:80;
  display:flex;
  flex-direction:column;
  gap:var(--s-1);
  padding:var(--s-2);
  border-radius:var(--r-4);
  background:transparent;
}
.rail-item{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:var(--s-2);
  min-height:44px;
  padding:11px 12px;
  border-radius:var(--r-2);
  color:var(--ink-3);
  transition:background .26s var(--ease), color .26s var(--ease);
  white-space:nowrap;
  overflow:hidden;
}
.rail-ic{display:grid;place-items:center;width:20px;height:20px;flex:0 0 auto}
.rail-ic svg{
  width:20px;height:20px;display:block;
  transition:transform .34s var(--ease-out), opacity .34s var(--ease-out), filter .34s var(--ease-out);
}
/* 未选中：图标轻微收缩 + 极淡模糊，切换时与新项交叉淡化 */
.rail-item:not(.on) .rail-ic svg{transform:scale(.92);opacity:.66;filter:blur(.2px)}
.rail-item:hover{background:var(--panel-3);color:var(--ink-2)}
.rail-item:hover .rail-ic svg{opacity:.9;filter:none;transform:scale(1)}
/* 选中：常显名称，图标清晰 */
.rail-item.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh-2)}
.rail-item.on .rail-ic svg{transform:scale(1);opacity:1;filter:none}
.rail-tx{
  font-size:13px;
  font-weight:500;
  line-height:1.4;
  max-width:0;
  opacity:0;
  overflow:hidden;
  transform:translateX(-3px);
  transition:max-width .34s var(--ease-out), opacity .28s var(--ease-out), transform .34s var(--ease-out);
}
.rail-item.on .rail-tx{max-width:88px;opacity:1;transform:none}
.rail-cnt{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ink-4);
  max-width:0;
  opacity:0;
  overflow:hidden;
  transition:max-width .3s var(--ease-out), opacity .3s var(--ease-out);
}
.rail-item.on .rail-cnt{max-width:40px;opacity:1}

.footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--s-3);
  flex-wrap:wrap;
  margin-top:var(--s-7);
  padding-top:var(--s-5);
  font-size:11.5px;
  color:var(--ink-4);
}
.footer .src{color:var(--ink-4);opacity:.85}

/* ---------- 3. 卡片 ---------- */
.card{
  background:var(--panel);
  border-radius:var(--r-7);
  padding:var(--s-4);
  box-shadow:var(--sh-3);
  margin-bottom:var(--s-4);
}
.card-hd{
  display:flex;
  align-items:center;
  gap:var(--s-3);
  min-height:28px;
  margin-bottom:var(--s-4);
  flex-wrap:wrap;
}
/* 同类面板标题左缘统一对齐 */
.card-hd h2{
  font-size:13.5px;
  font-weight:600;
  color:var(--ink);
  letter-spacing:.01em;
  line-height:1.4;
  margin-right:auto;
  text-wrap:balance;
}
.hd-act{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap}
.hd-sub{font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}

.mini-hd{
  display:flex;
  align-items:baseline;
  gap:var(--s-2);
  font-size:12px;
  font-weight:600;
  color:var(--ink-2);
  letter-spacing:.02em;
  margin:var(--s-5) 0 var(--s-3);
}
.card > .mini-hd:first-of-type,.card-hd + .mini-hd{margin-top:0}
.mini-hd .q{
  font-family:var(--font);
  font-size:11.5px;
  font-weight:400;
  color:var(--ink-4);
  letter-spacing:0;
}

/* ---------- 4. 表单 ---------- */
.fgroup + .fgroup{margin-top:var(--s-5)}
.fgroup-hd{
  display:flex;
  align-items:center;
  gap:var(--s-3);
  margin-bottom:var(--s-3);
}
.fgroup-hd .name{
  font-size:12px;
  font-weight:600;
  color:var(--ink-3);
  letter-spacing:.06em;
  flex:0 0 auto;
}
.fgroup-hd .line{flex:1;height:0;border-top:1px solid var(--line)}

.grid{display:grid;gap:var(--s-3)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fgrid{display:grid;gap:var(--s-3);margin-bottom:var(--s-3)}
.fg2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fg3{grid-template-columns:repeat(3,minmax(0,1fr))}

.field{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.field > label{
  font-size:11.5px;
  font-weight:500;
  color:var(--ink-3);
  letter-spacing:.02em;
  line-height:1.4;
}
.field > label .v{
  font-family:var(--mono);
  color:var(--ink-2);
  margin-left:var(--s-1);
}
.field-inline{display:flex;align-items:center;gap:var(--s-2)}
.req{color:var(--warn)}

.ctrl{
  width:100%;
  min-height:40px;
  padding:9px 12px;
  font-size:13px;
  color:var(--ink);
  background:var(--panel-3);
  border:none;
  border-radius:var(--r-3);
  box-shadow:none;
  transition:box-shadow .2s var(--ease), background .2s var(--ease);
  appearance:none;
  -webkit-appearance:none;
}
.ctrl:hover{background:#e8eaec}
.ctrl:focus{
  outline:none;
  background:var(--panel);
  box-shadow:0 0 0 2px var(--ink), var(--sh-1);
}
.ctrl::placeholder{color:var(--ink-4)}
select.ctrl{
  padding-right:32px;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23878d94' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 10px center;
  cursor:pointer;
}
.ctrl-sm{min-height:32px;padding:5px 28px 5px 10px;font-size:12px;width:auto}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.has-suffix{padding-right:38px}
.unit-suffix{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  margin-top:11px;
  font-size:11.5px;
  color:var(--ink-4);
  pointer-events:none;
  font-family:var(--mono);
}
.field > .unit-suffix{top:auto;bottom:12px;right:13px;transform:none;margin-top:0}

.range-field{gap:var(--s-2);justify-content:flex-end;padding-bottom:2px}
input[type=range]{
  width:100%;
  height:20px;
  appearance:none;
  -webkit-appearance:none;
  background:transparent;
  cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:3px;border-radius:var(--r-pill);background:var(--line-2);
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;-webkit-appearance:none;
  width:14px;height:14px;margin-top:-5.5px;
  border-radius:50%;background:var(--panel);
  box-shadow:0 0 0 1.5px var(--ink), var(--sh-1);
  transition:transform .18s var(--ease-out);
}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.1)}
input[type=range]::-moz-range-track{height:3px;border-radius:var(--r-pill);background:var(--line-2)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:1.5px solid var(--ink);border-radius:50%;background:var(--panel)}

.hint{
  font-size:11.5px;
  line-height:1.65;
  color:var(--ink-4);
  margin-top:var(--s-2);
  text-wrap:pretty;
}
.hint.c{text-align:center}
.hint b{color:var(--ink-3);font-weight:500}

/* ---------- 5. 按钮 ---------- */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:36px;
  padding:7px 14px;
  font-size:12.5px;
  font-weight:500;
  color:var(--ink-2);
  background:var(--panel);
  border-radius:var(--r-3);
  box-shadow:inset 0 0 0 1px var(--line-2), var(--sh-1);
  transition:background .2s var(--ease), box-shadow .2s var(--ease), color .2s var(--ease), transform .14s var(--ease-out);
  white-space:nowrap;
}
.btn:hover{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2), var(--sh-2)}
.btn:active{transform:translateY(.5px)}
.btn.tiny{min-height:30px;padding:5px 11px;font-size:12px;border-radius:var(--r-2)}
.btn.ghost{box-shadow:none;background:transparent;color:var(--ink-3);padding-left:8px;padding-right:8px}
.btn.ghost:hover{background:var(--panel-3);color:var(--ink);box-shadow:none}
.btn.danger{background:var(--danger-bg);color:var(--danger);box-shadow:none}
.btn.danger:hover{background:var(--danger-bg);box-shadow:inset 0 0 0 1px rgba(179,56,47,.22)}
.btn.danger-ghost{box-shadow:none;background:transparent;color:var(--danger)}
.btn.danger-ghost:hover{background:var(--danger-bg);box-shadow:none}
.btn.warn{background:var(--warn-bg);color:var(--warn);box-shadow:none}
.btn.on,.btn.is-on{background:var(--ink);color:#fff;box-shadow:none}
.btn.on:hover,.btn.is-on:hover{background:#2a2f34;color:#fff}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;margin-top:var(--s-3)}

/* 主操作：用明暗对比而非彩色突出 */
.btn-main{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:var(--s-2);
  width:100%;
  min-height:50px;
  margin-top:var(--s-2);
  font-size:14.5px;
  font-weight:600;
  letter-spacing:.02em;
  color:#fff;
  background:var(--ink);
  border-radius:var(--r-4);
  box-shadow:var(--sh-3);
  transition:background .22s var(--ease), transform .16s var(--ease-out), box-shadow .22s var(--ease);
}
.btn-main:hover{background:#282d32;box-shadow:var(--sh-4)}
.btn-main:active{transform:translateY(1px)}
.btn-main.is-busy{opacity:.72;pointer-events:none}
.spin{display:none;border-radius:50%}
.btn-main.is-busy .spin{
  display:block;
  width:14px;height:14px;
  border:2px solid rgba(255,255,255,.32);
  border-top-color:#fff;
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.calcbar{
  display:flex;
  align-items:center;
  gap:var(--s-2);
  margin-top:var(--s-3);
  font-size:11.5px;
  color:var(--ink-4);
  min-height:18px;
}
.calcbar .sk{flex:1;height:1px;background:var(--line);border-radius:var(--r-pill);overflow:hidden}
.calcbar .sk i{display:block;height:100%;width:0;background:var(--ink-4);transition:width .5s var(--ease-out)}
.calcbar .t{font-family:var(--mono);color:var(--ink-4)}

/* ---------- 6. 预检条 ---------- */
.preflight{
  display:flex;
  align-items:center;
  gap:var(--s-3);
  flex-wrap:wrap;
  padding:10px var(--s-4);
  margin-bottom:var(--s-4);
  background:var(--panel-2);
  border-radius:var(--r-4);
  box-shadow:inset 0 0 0 1px var(--line);
  font-size:11.5px;
  color:var(--ink-3);
}
.pf-k{flex:0 0 auto;letter-spacing:.02em}
.pf-k b{font-family:var(--mono);color:var(--ink-2);font-weight:600;margin-left:2px}
.pf-bar{
  flex:1;
  min-width:60px;
  height:3px;
  border-radius:var(--r-pill);
  background:var(--line-2);
  overflow:hidden;
}
.pf-bar i{display:block;height:100%;width:0;background:var(--ink-2);border-radius:var(--r-pill);transition:width .42s var(--ease-out)}
.pf-flag{margin-left:auto;color:var(--ink-2);font-weight:500}
.pf-flag.ok{color:var(--ok)}
.pf-flag.warn{color:var(--warn)}
.pf-flag.danger{color:var(--danger)}

/* ---------- 7. 五维 ---------- */
.dim-wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:var(--s-5);align-items:center}
.dim-canvas{display:grid;place-items:center;background:var(--panel-2);border-radius:var(--r-4);padding:var(--s-2)}
.dim-canvas canvas{width:270px;height:270px;max-width:100%;display:block}
.dim-side{min-width:0}
.dim-list{display:flex;flex-direction:column;gap:var(--s-2)}
.dim-row{
  display:grid;
  grid-template-columns:52px minmax(0,1fr) 58px 50px;
  align-items:center;
  gap:var(--s-3);
  padding:7px 10px;
  border-radius:var(--r-2);
  background:var(--panel-2);
  transition:background .2s var(--ease);
}
.dim-row.is-set{background:var(--panel-3)}
.dim-row > label{font-size:12px;color:var(--ink-2);font-weight:500;letter-spacing:.02em}
.dim-num{
  width:100%;
  min-height:28px;
  padding:3px 7px;
  font-family:var(--mono);
  font-size:12px;
  text-align:center;
  color:var(--ink);
  background:var(--panel);
  border:none;
  border-radius:var(--r-1);
  box-shadow:none;
}
.dim-num:focus{outline:none;box-shadow:0 0 0 2px var(--ink)}
.dim-row .unset{
  font-size:10.5px;
  color:var(--ink-4);
  letter-spacing:.02em;
  text-align:right;
  transition:color .2s var(--ease), opacity .2s var(--ease);
}
.dim-row.is-set .unset{color:var(--ok);opacity:1}
.dim-row.is-set .unset::after{content:""}
.dim-note{font-size:11.5px;color:var(--ink-4);margin-top:var(--s-3);line-height:1.6}

/* ---------- 8. 筛选 / 标签 ---------- */
.filters{margin-top:var(--s-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--s-3)}
.chip{
  min-height:30px;
  padding:5px 12px;
  font-size:12px;
  color:var(--ink-3);
  background:transparent;
  border-radius:var(--r-pill);
  transition:background .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease);
}
.chip:hover{background:var(--panel-3);color:var(--ink-2)}
.chip.on{background:var(--ink);color:#fff}

.mtag{
  display:inline-flex;
  align-items:center;
  font-size:10.5px;
  letter-spacing:.02em;
  color:var(--ink-3);
  background:var(--panel-3);
  border-radius:var(--r-1);
  padding:2px 7px;
  white-space:nowrap;
}
.mtag.red{color:var(--danger);background:var(--danger-bg)}
.mtag.cy{color:var(--info);background:var(--info-bg)}
.mtag.note{color:var(--warn);background:var(--warn-bg)}

/* ---------- 9. 统计格 ---------- */
.hs-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  gap:var(--s-2);
  margin-bottom:var(--s-2);
}
.hs-cell{
  padding:var(--s-3);
  background:var(--panel-2);
  border-radius:var(--r-3);
  min-width:0;
}
.hs-v{
  font-size:17px;
  font-weight:600;
  color:var(--ink);
  line-height:1.3;
  letter-spacing:-.01em;
}
.hs-v.dg,.hs-v.danger{color:var(--danger)}
.hs-v.wn,.hs-v.warn{color:var(--warn)}
.hs-v.ok{color:var(--ok)}
.hs-v.info{color:var(--info)}
.hs-v .n{font-size:10px;color:var(--ink-4);margin-left:2px;font-weight:400}
.hs-k{font-size:10.5px;color:var(--ink-4);margin-top:2px;letter-spacing:.02em}

/* KPI（历史分析 / 模拟） */
.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
  gap:var(--s-2);
  margin-top:var(--s-2);
}
.kpi{
  padding:var(--s-3);
  background:var(--panel-2);
  border-radius:var(--r-3);
  min-width:0;
}
.kpi .k{font-size:10.5px;color:var(--ink-4);letter-spacing:.02em;line-height:1.4}
.kpi .v{
  margin-top:3px;
  font-size:17px;
  font-weight:600;
  color:var(--ink);
  line-height:1.3;
  letter-spacing:-.01em;
}
.kpi .v.dg,.kpi .v.danger{color:var(--danger)}
.kpi .v.wn,.kpi .v.warn{color:var(--warn)}
.kpi .v.ok{color:var(--ok)}
.kpi .v.info{color:var(--info)}
.kpi .u{font-size:10px;color:var(--ink-4);margin-left:2px;font-weight:400}

/* ---------- 10. 图表 ---------- */
.chart-box{
  position:relative;
  width:100%;
  min-height:190px;
  background:var(--panel-2);
  border-radius:var(--r-3);
  padding:var(--s-2);
  overflow:hidden;
}
.chart-box canvas{width:100%;height:auto;display:block}
.chart-lg{
  display:flex;
  align-items:center;
  gap:var(--s-4);
  flex-wrap:wrap;
  margin-top:var(--s-3);
  font-size:11px;
  color:var(--ink-3);
}
.chart-lg span{display:inline-flex;align-items:center;gap:5px}
.chart-lg i{width:9px;height:9px;border-radius:2px;flex:0 0 auto}

/* ---------- 11. 表格 ---------- */
.tbl-wrap{
  width:100%;
  overflow-x:auto;
  background:var(--panel-2);
  border-radius:var(--r-3);
  padding:var(--s-1) var(--s-2);
  -webkit-overflow-scrolling:touch;
}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{
  padding:8px 10px;
  text-align:left;
  vertical-align:middle;
  border-bottom:1px solid var(--line);
}
.tbl thead th{
  font-size:10.5px;
  font-weight:500;
  color:var(--ink-4);
  letter-spacing:.04em;
  white-space:nowrap;
  border-bottom:1px solid var(--line-2);
}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl td.n{font-family:var(--mono);color:var(--ink-2)}
.tbl td.dg{color:var(--danger)}
.tbl td.ok{color:var(--ok)}
.tbl .last{text-align:right}
.tbl td.concl{font-weight:500;color:var(--ink)}
.tbl tr[data-secrow] td{padding-top:2px;font-size:11px;color:var(--ink-4)}
.tbl th.last{text-align:right}

/* ---------- 12. 列表行 ---------- */
.hrow{
  display:grid;
  grid-template-columns:3px 20px 44px minmax(0,1fr) auto;
  align-items:center;
  gap:var(--s-3);
  padding:var(--s-3) var(--s-2);
  border-bottom:1px solid var(--line);
  border-radius:var(--r-2);
  transition:background .18s var(--ease);
}
.hrow:last-child{border-bottom:none}
.hrow:hover{background:var(--panel-2)}
.hrow.sel{background:var(--panel-3)}
.hrail{width:3px;height:26px;border-radius:var(--r-pill);background:transparent;display:block}
.hrail.ok{background:var(--ok)}
.hrail.edge{background:var(--warn)}
.hrail.black{background:var(--danger)}
.hck{display:grid;place-items:center}
.hck input{width:15px;height:15px;accent-color:var(--ink);cursor:pointer}
.hscore{
  font-size:15px;
  font-weight:600;
  text-align:right;
  color:var(--ink-2);
  letter-spacing:-.01em;
}
.hscore.ok{color:var(--ok)}
.hscore.edge{color:var(--warn)}
.hscore.black{color:var(--danger)}
.hbody{min-width:0}
.ht{
  display:flex;
  align-items:baseline;
  gap:var(--s-2);
  flex-wrap:wrap;
  font-size:12.5px;
  color:var(--ink);
  line-height:1.45;
}
.ht .dt{font-size:11px;color:var(--ink-4)}
.hm{font-size:11.5px;color:var(--ink-3);margin-top:1px;line-height:1.5}
.htags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.hops{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}

/* 空态 */
.empty{
  padding:var(--s-6) var(--s-4);
  text-align:center;
  font-size:12.5px;
  color:var(--ink-4);
  line-height:1.9;
}
.empty-t{
  display:block;
  font-size:13px;
  font-weight:600;
  color:var(--ink-3);
  margin-bottom:6px;
  letter-spacing:.02em;
}

/* ---------- 13. 报告分节 ---------- */
.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.sec-hd{
  display:flex;
  align-items:center;
  gap:var(--s-3);
  padding:var(--s-3) 0;
  cursor:pointer;
  user-select:none;
}
.sec-hd .st{
  display:grid;place-items:center;
  width:20px;height:20px;flex:0 0 auto;
  border-radius:var(--r-1);
  background:var(--panel-3);
  font-size:10.5px;
  color:var(--ink-3);
}
.sec-hd h3{font-size:12.5px;font-weight:600;color:var(--ink);margin-right:auto;letter-spacing:.01em}
.sec-hd .sub{font-size:11px;color:var(--ink-4);white-space:nowrap;flex:0 0 auto}
/* 折叠指示箭头：必须限定尺寸，否则 svg 会撑满整行 */
.sec-hd .cv{width:15px;height:15px;flex:0 0 auto;color:var(--ink-4);transition:transform .26s var(--ease)}
.sec.open .sec-hd .cv{transform:rotate(180deg)}
.sec-bd{display:none;padding-bottom:var(--s-4)}
.sec.open .sec-bd{display:block}
.sec-row{
  display:grid;
  grid-template-columns:96px minmax(0,1fr);
  gap:var(--s-3);
  padding:6px 0;
  font-size:12.5px;
  line-height:1.65;
}
.sec-row > .k{color:var(--ink-4);font-size:11.5px}

.line-item{
  position:relative;
  padding:9px 12px 9px 14px;
  margin:6px 0;
  font-size:12.5px;
  line-height:1.7;
  color:var(--ink-2);
  background:var(--panel-2);
  border-radius:var(--r-2);
  text-wrap:pretty;
}
.line-item::before{
  content:"";
  position:absolute;left:0;top:9px;bottom:9px;
  width:2px;border-radius:var(--r-pill);
  background:var(--line-2);
}
.line-item.risk{background:var(--danger-bg);color:#7d2a23}
.line-item.risk::before{background:var(--danger)}
.line-item.tip{background:var(--ok-bg);color:#0b4f42}
.line-item.tip::before{background:var(--ok)}
.line-item.info{background:var(--info-bg);color:#324470}
.line-item.info::before{background:var(--info)}
.line-item.warn{background:var(--warn-bg);color:#6d4710}
.line-item.warn::before{background:var(--warn)}
.line-item b{color:inherit;font-weight:600}
.line-item .mute,.mute{color:var(--ink-4)}
.line-item .src{display:block;margin-top:3px;font-size:11px;color:var(--ink-4)}

/* ---------- 14. 判定块 ---------- */
.verdict{
  padding:var(--s-4);
  background:var(--panel-2);
  border-radius:var(--r-4);
  margin-bottom:var(--s-3);
}
.verdict.sev-danger{background:var(--danger-bg)}
.verdict.sev-warn{background:var(--warn-bg)}
.verdict.sev-ok{background:var(--ok-bg)}
.verdict.sev-info{background:var(--info-bg)}
.vt{
  font-size:10.5px;
  letter-spacing:.1em;
  color:var(--ink-4);
  margin-bottom:var(--s-2);
  text-transform:uppercase;
}
.vh{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap;margin-bottom:var(--s-2)}
.vk{font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.015em;line-height:1.3;text-wrap:balance}
.vp{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.vp b{color:var(--ink);font-weight:600}
.vbadges{display:flex;gap:5px;flex-wrap:wrap;margin:var(--s-3) 0}
.b{
  display:inline-flex;
  align-items:center;
  font-size:11px;
  font-family:var(--mono);
  letter-spacing:.01em;
  padding:3px 8px;
  border-radius:var(--r-1);
  background:rgba(255,255,255,.7);
  color:var(--ink-2);
  white-space:nowrap;
}
.b.ok{color:var(--ok);background:#fff}
.b.warn{color:var(--warn);background:#fff}
.b.danger{color:var(--danger);background:#fff}
.b.info{color:var(--info);background:#fff}
.b.mute{color:var(--ink-3);background:rgba(255,255,255,.55)}
.vsum{font-size:12.5px;color:var(--ink-2);line-height:1.75;text-wrap:pretty}
.vsum b{color:var(--ink);font-weight:600}

/* ---------- 15. 两轴 ---------- */
.axes{display:grid;gap:var(--s-3);margin-bottom:var(--s-3)}
.axis{padding:var(--s-3);background:var(--panel-2);border-radius:var(--r-3)}
.axis-hd{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-2);margin-bottom:var(--s-2)}
.axis-hd .t{font-size:12px;font-weight:500;color:var(--ink-2)}
.axis-hd .n{font-size:15px;font-weight:600;color:var(--ink);font-family:var(--mono)}
.axis-hd .n small{font-size:10px;color:var(--ink-4);font-weight:400}
.axis-hd .n.dg,.axis-hd .n.danger{color:var(--danger)}
.axis-hd .n.wn,.axis-hd .n.warn{color:var(--warn)}
.axis-hd .n.ok{color:var(--ok)}
.axis-track{
  position:relative;
  height:5px;
  border-radius:var(--r-pill);
  background:var(--line-2);
  margin:var(--s-3) 0 var(--s-2);
}
.axis-track > i{
  position:absolute;left:0;top:0;bottom:0;
  border-radius:var(--r-pill);
  background:var(--ink-2);
  transition:width .5s var(--ease-out), background .3s var(--ease);
}
.axis-track > i.dg,.axis-track > i.danger{background:var(--danger)}
.axis-track > i.wn,.axis-track > i.warn{background:var(--warn)}
.axis-track > i.ok{background:var(--ok)}
.axis-track .th{
  position:absolute;top:-4px;bottom:-4px;width:1px;
  background:var(--ink-4);
  border-radius:var(--r-pill);
}
.axis-track .th::after{
  content:attr(data-l);
  position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);
  font-size:9.5px;color:var(--ink-4);white-space:nowrap;font-family:var(--mono);
}
.axis .note{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin-top:4px;text-wrap:pretty}

/* ---------- 16. 驱动条 ---------- */
.drv{
  display:grid;
  grid-template-columns:20px minmax(64px,auto) minmax(0,1fr) 44px;
  align-items:center;
  gap:var(--s-2);
  padding:7px 0;
  border-bottom:1px solid var(--line);
  font-size:12px;
}
.drv:last-of-type{border-bottom:none}
.drv .rk{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);text-align:center}
.drv.t1 .rk,.drv.t2 .rk{color:var(--ink-2);font-weight:600}
.drv .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drv .bar{height:5px;border-radius:var(--r-pill);background:var(--line);overflow:hidden}
.drv .bar i{display:block;height:100%;border-radius:var(--r-pill);background:var(--ink-2);transition:width .5s var(--ease-out)}
.drv .vv{font-family:var(--mono);font-size:11.5px;color:var(--ink);text-align:right;font-weight:500}
.drv .lb{
  grid-column:2 / -1;
  font-size:10.5px;
  color:var(--ink-4);
  line-height:1.5;
  margin-top:-2px;
}

/* ---------- 17. 分布柱 ---------- */
.dist:empty{display:none}
.dist{
  display:flex;
  align-items:flex-end;
  gap:var(--s-1);
  height:88px;
  padding:var(--s-2) var(--s-2) 0;
  background:var(--panel-2);
  border-radius:var(--r-3);
}
.dist .col{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:4px;
  min-width:0;
  height:100%;
}
.dist .col .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);line-height:1}
.dist .col .bar{
  width:100%;
  max-width:34px;
  border-radius:3px 3px 0 0;
  background:var(--ink-4);
  transition:height .5s var(--ease-out), background .3s var(--ease);
}
.dist .col.ok .bar{background:var(--ok)}
.dist .col.warn .bar{background:var(--warn)}
.dist .col.danger .bar{background:var(--danger)}
.dist .col .x{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);line-height:1;height:12px}

/* ---------- 18. 对比 ---------- */
.cmp{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:var(--s-2);
  margin-top:var(--s-2);
}
.cmp-col{
  padding:var(--s-3);
  background:var(--panel-2);
  border-radius:var(--r-3);
  min-width:0;
}
.cmp-col h4{font-size:11px;font-weight:500;color:var(--ink-4);letter-spacing:.04em;margin-bottom:6px}
.cmp-col .big{font-size:15px;font-weight:600;color:var(--ink);line-height:1.35;text-wrap:balance}
.cmp-delta{margin-top:var(--s-3)}
.cmp-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 64px 64px 56px;
  gap:var(--s-2);
  align-items:center;
  padding:6px 0;
  border-bottom:1px solid var(--line);
  font-size:12px;
}
.cmp-row:last-child{border-bottom:none}
.cmp-row .k{color:var(--ink-3);font-size:11.5px}
.cmp-row .v{font-family:var(--mono);color:var(--ink-2);text-align:right}
.cmp-row .d{font-family:var(--mono);font-size:11px;text-align:right}
.cmp-row .d.up{color:var(--danger)}
.cmp-row .d.down{color:var(--ok)}

/* ---------- 19. 模拟 ---------- */
.sim-row{
  padding:var(--s-3) 0;
  border-bottom:1px solid var(--line);
}
.sim-row:last-child{border-bottom:none}
.sim-row-h{
  display:flex;
  align-items:center;
  gap:var(--s-2);
  margin-bottom:6px;
  flex-wrap:wrap;
}
.sim-row-h label{font-size:12.5px;color:var(--ink-2);font-weight:500;margin-right:auto}
.sim-val{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:600;min-width:44px;text-align:right}
.sim-delta{font-family:var(--mono);font-size:11px;color:var(--ink-4);min-width:44px;text-align:right}
.sim-delta.up{color:var(--danger)}
.sim-delta.down{color:var(--ok)}
.sim-track{position:relative}
.sim-mark{
  position:absolute;
  top:50%;
  width:1px;height:14px;
  transform:translate(-50%,-50%);
  background:var(--ink-4);
  opacity:.5;
  pointer-events:none;
}
.sim-row-f{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:var(--s-2);
  margin-top:4px;
  font-size:10.5px;
  color:var(--ink-4);
  line-height:1.5;
}
.sim-base{font-family:var(--mono);color:var(--ink-4);flex:0 0 auto}

/* ---------- 20. 历史分析补充 ---------- */
.ins-verdict{margin-top:var(--s-3)}
.ins-report{
  white-space:pre-wrap;
  font-size:12px;
  line-height:1.85;
  color:var(--ink-2);
  background:var(--panel-2);
  padding:var(--s-4);
  border-radius:var(--r-3);
}
.ins-report::before{display:none}

/* IO 面板 */
.io-panel{
  margin-top:var(--s-3);
  padding:var(--s-3);
  background:var(--panel-2);
  border-radius:var(--r-3);
}
.io-hd{display:flex;align-items:center;gap:var(--s-2);margin-bottom:var(--s-2)}
.io-hd b{font-size:12.5px;color:var(--ink);font-weight:600;margin-right:auto}
.io-text{
  min-height:150px;
  font-family:var(--mono);
  font-size:11.5px;
  line-height:1.6;
  resize:vertical;
  background:var(--panel);
}
.batchbar{display:none}
.batchbar.on{display:flex}

/* ---------- 21. 弹层 ---------- */
.overlay{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:var(--s-4);
  background:rgba(21,24,27,.32);
  opacity:0;
  visibility:hidden;
  transition:opacity .26s var(--ease), visibility .26s;
}
.overlay.on{opacity:1;visibility:visible}
.sheet{
  width:100%;
  max-width:640px;
  max-height:88vh;
  display:flex;
  flex-direction:column;
  background:var(--panel);
  border-radius:var(--r-7);
  box-shadow:var(--sh-4);
  /* 退场：短距离下移 + 淡出 + 轻微模糊，不飞出屏幕 */
  opacity:0;
  transform:translateY(10px);
  filter:blur(2px);
  transition:opacity .26s var(--ease), transform .3s var(--ease-out), filter .26s var(--ease);
}
.overlay.on .sheet{opacity:1;transform:none;filter:none}
.sheet-grip{
  width:36px;height:3px;
  margin:10px auto 0;
  border-radius:var(--r-pill);
  background:var(--line-2);
  flex:0 0 auto;
}
.sheet-hd{
  display:flex;
  align-items:center;
  gap:var(--s-3);
  padding:var(--s-3) var(--s-4) var(--s-3);
  flex:0 0 auto;
}
.sheet-hd h2{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:.01em}
.sheet-hd .meta{font-size:11px;color:var(--ink-4);margin-right:auto}
.sheet-x{
  display:grid;place-items:center;
  width:30px;height:30px;
  border-radius:var(--r-2);
  color:var(--ink-3);
  transition:background .2s var(--ease), color .2s var(--ease);
}
.sheet-x:hover{background:var(--panel-3);color:var(--ink)}
.sheet-x svg{width:16px;height:16px}
.anchors{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  padding:0 var(--s-4) var(--s-3);
  flex:0 0 auto;
}
.anchors button{
  font-size:11px;
  color:var(--ink-3);
  background:var(--panel-2);
  border-radius:var(--r-pill);
  padding:3px 9px;
  transition:background .18s var(--ease), color .18s var(--ease);
}
.anchors button:hover{background:var(--panel-3);color:var(--ink)}
.anchors button.on{background:var(--ink);color:#fff}
.sheet-body{
  flex:1 1 auto;
  overflow-y:auto;
  padding:0 var(--s-4) var(--s-3);
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.sheet-ft{
  display:flex;
  align-items:center;
  gap:var(--s-2);
  flex-wrap:wrap;
  padding:var(--s-3) var(--s-4) var(--s-4);
  flex:0 0 auto;
  border-top:1px solid var(--line);
}

/* ---------- 22. Toast ---------- */
#toastBox{
  position:fixed;
  left:50%;
  bottom:var(--s-6);
  transform:translate(-50%,8px);
  z-index:300;
  display:flex;
  align-items:center;
  gap:var(--s-3);
  padding:10px 16px;
  font-size:12.5px;
  color:#fff;
  background:rgba(21,24,27,.94);
  border-radius:var(--r-pill);
  box-shadow:var(--sh-4);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .24s var(--ease), transform .28s var(--ease-out), visibility .24s;
  max-width:calc(100vw - 32px);
}
#toastBox.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
#toastBox .undo{
  color:#9fc7ff;
  cursor:pointer;
  font-weight:500;
  flex:0 0 auto;
  pointer-events:auto;
}
#toastBox.has-action{pointer-events:auto}

/* ---------- 23. 入场：错峰、快起轻收、可打断 ---------- */
/* 默认隐藏；html.ready 后按序入场。用 transition 而非 keyframes，
   任意时刻切换视图都不会"从头重放"。 */
.view > *{
  opacity:0;
  transform:translateY(7px);
  transition:opacity .42s var(--ease-out), transform .46s var(--ease-out);
}
html.ready .view.on > *{opacity:1;transform:none}
html.ready .view.on > *:nth-child(1){transition-delay:0ms}
html.ready .view.on > *:nth-child(2){transition-delay:38ms}
html.ready .view.on > *:nth-child(3){transition-delay:70ms}
html.ready .view.on > *:nth-child(4){transition-delay:96ms}
html.ready .view.on > *:nth-child(5){transition-delay:118ms}
html.ready .view.on > *:nth-child(6){transition-delay:136ms}
html.ready .view.on > *:nth-child(n+7){transition-delay:150ms}

/* 视图切换：旧视图不飞出，仅快速淡出；新视图按上面的错峰入场 */
.view{display:none}
.view.on{display:block}
.view.leaving{
  display:block;
  position:absolute;
  left:0;right:0;
  opacity:0;
  transform:translateY(-4px);
  filter:blur(1.5px);
  pointer-events:none;
  transition:opacity .16s var(--ease), transform .16s var(--ease), filter .16s var(--ease);
}

/* ---------- 24. 响应式 ---------- */
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dim-wrap{grid-template-columns:minmax(0,1fr)}
  .dim-canvas{justify-items:center}
  .rail{
    position:fixed;
    left:50%;
    right:auto;
    bottom:calc(var(--s-4) + env(safe-area-inset-bottom));
    top:auto;
    transform:translateX(-50%);
    flex-direction:row;
    gap:2px;
    padding:5px;
    background:var(--panel);
    box-shadow:var(--sh-4);
    border-radius:var(--r-pill);
    z-index:120;
  }
  .rail-item{padding:9px 12px;min-height:42px}
  .rail-item .rail-tx{max-width:0;opacity:0}
  .rail-item.on .rail-tx{max-width:72px;opacity:1;transform:none}
  .rail-cnt{display:none}
  .app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
}
@media (max-width:640px){
  .app{padding-left:var(--s-4);padding-right:var(--s-4)}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page-head h1{font-size:22px}
  .card{padding:var(--s-3);border-radius:var(--r-6)}
  .topbar{padding:var(--s-4) 0 var(--s-2)}
  .hs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hrow{grid-template-columns:3px 18px 38px minmax(0,1fr);grid-template-areas:"rail ck score body" "ops ops ops ops";row-gap:var(--s-2)}
  .hrail{grid-area:rail}
  .hck{grid-area:ck}
  .hscore{grid-area:score}
  .hbody{grid-area:body}
  .hops{grid-area:ops;justify-content:flex-start}
  .sheet{max-height:92vh}
}
@media (max-width:430px){
  .g3,.g4{grid-template-columns:minmax(0,1fr)}
  .dim-row{grid-template-columns:44px minmax(0,1fr) 52px}
  .dim-row .unset{display:none}
}

/* 减少动效偏好 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    transition-duration:.01ms !important;
    animation-duration:.01ms !important;
  }
}

/* 模拟基线选择器：按可用宽度自动排列，避免单个控件独占一行 */
#sim-selects{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.sim-base{font-size:10.5px}
</style>

  <!-- ============ 历史分析 ============ -->
  <section class="view" id="view-insight" role="tabpanel">
    <div class="card" id="insightOverview">
      <div class="card-hd"><h2>聚合总览</h2></div>

  /* ---------- 工具函数 ---------- */
  function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
  function has(v){ return v !== null && v !== undefined && !isNaN(v) && isFinite(v); }
  function pw(x, pts){
    if (x <= pts[0][0]){
      var a = pts[0], b = pts[1];
      return a[1] + (x - a[0]) * (b[1] - a[1]) / (b[0] - a[0]);
    }
    for (var i = 1; i < pts.length; i++){
      if (x <= pts[i][0]){ var p = pts[i-1], q = pts[i];
        return p[1] + (x - p[0]) * (q[1] - p[1]) / (q[0] - p[0]); }
    }
    var n = pts.length, pp = pts[n-2], qq = pts[n-1];
    return qq[1] + (x - qq[0]) * (qq[1] - pp[1]) / (qq[0] - pp[0]);
  }
  function curve(v, a){
    if (!has(v)) return null;
    if (v <= a[0][0]){
      var k = (v - a[0][0]) / (a[1][0] - a[0][0]);
      return { p: clamp(a[0][1] + k*(a[1][1]-a[0][1]), 0, 100),
               d: clamp(a[0][2] + k*(a[1][2]-a[0][2]), 0, 100), label: a[0][3] };
    }
    for (var i = 1; i < a.length; i++){
      if (v <= a[i][0]){
        var lo = a[i-1], hiA = a[i], t = (v - lo[0]) / (hiA[0] - lo[0]);
        return { p: clamp(lo[1] + t*(hiA[1]-lo[1]), 0, 100),
                 d: clamp(lo[2] + t*(hiA[2]-lo[2]), 0, 100),
                 label: t >= 0.5 ? hiA[3] : lo[3] };
      }
    }
    var L = a[a.length-1];
    return { p: clamp(L[1],0,100), d: clamp(L[2],0,100), label: L[3] };
  }
  function mk(key){
    return function(v){
      var r = curve(v, SPEC[key].anchors);
      if (r){ r.key = key; r.src = SPEC[key].src; }
      return r;
    };
  }
  var fProfit = mk('profit'), fKD = mk('kd'), fEvac = mk('evac'), fHit = mk('hit'),
      fPrec = mk('prec'), fCombat = mk('combat'), fWealth = mk('wealth'), fSearch = mk('search'),
      fSurv = mk('surv'), fYld = mk('yld'), fGear = mk('gear'), fTime = mk('time');

  /* 合作分：救助队友 + 带出队友价值，来源称权重约击杀分一半，单排不计分 */
  function fCoop(games, rescue, mateValue, extract, squad){
    if (!has(games) || games <= 0) return null;
    var rpg = has(rescue) ? rescue / games : 0;
    var share = (has(mateValue) && has(extract) && extract > 0) ? mateValue / extract : 0;
    if (!has(rescue) && !has(mateValue)) return null;
    var s = clamp(rpg / 0.5, 0, 1) * 0.6 + clamp(share / 0.2, 0, 1) * 0.4;
    if (squad === 'solo' && (share < 0.01 && rpg < 0.02)) s = 0;
    return { key:'coop', p: 6 + s*14, d: 34 - s*30, coop:rpg, share:share,
      src:'合作分权重约击杀分一半',
      level: s >= 0.7 ? '高（团队贡献充分，正向分受益）' : s >= 0.35 ? '中' : s > 0 ? '偏低' : '无记录（单排不计分）',
      label:'救助 ' + rpg.toFixed(2) + ' 次/局，带出队友占比 ' + (share*100).toFixed(1) + '%' };
  }

  /* 搜·打·撤三维同向偏离（v6：未标定即不计） */
  function coDirectional(dims){
    var so = dims.search, da = dims.combat, ch = dims.survival;
    var given = [so, da, ch].filter(has).length;
    if (given < 3) return { state: given ? '仅 ' + given + '/3 维已标定，不做同向判定' : '五维未标定，不做同向判定',
                            boost:0, dir:'none', mean:null, spread:null };
    var hi = so >= 65 && da >= 65 && ch >= 65;
    var lo = so <= 35 && da <= 35 && ch <= 35;
    var mid = so >= 40 && so <= 60 && da >= 40 && da <= 60 && ch >= 40 && ch <= 60;
    var mean = (so + da + ch) / 3;
    var spread = Math.max(so, da, ch) - Math.min(so, da, ch);
    if (hi)  return { state:'三项全部显著偏高', boost:16, dir:'up', mean:mean, spread:spread };
    if (lo)  return { state:'三项全部显著偏低', boost:14, dir:'down', mean:mean, spread:spread };
    if (mid) return { state:'三项均处赛季均值附近', boost:-6, dir:'mid', mean:mean, spread:spread };
    return { state:'仅部分项偏离（极差' + spread.toFixed(0) + '）',
             boost: spread >= 45 ? 6 : 0, dir:'partial', mean:mean, spread:spread };
  }

  /* F_base 账号基础系数 */
  function calcFBase(kd, profit, evac){
    var pts = { kd:[[0.5,0.30],[1.0,1.00],[1.8,1.50]],
                pr:[[0.7,0.30],[1.0,1.00],[2.0,1.50]],
                ev:[[18,0.50],[30,1.00],[65,1.55]] };
    var sKD = has(kd) ? clamp(pw(kd, pts.kd), 0.1, 2.2) : 1.0;
    var sPR = has(profit) ? clamp(pw(profit, pts.pr), 0.1, 2.2) : 1.0;
    var sEV = has(evac) ? clamp(pw(evac, pts.ev), 0.1, 2.2) : 1.0;
    var f = sKD*0.375 + sPR*0.375 + sEV*0.25;
    var tier, mult, desc;
    if (f >= 1.5)      { tier='优质账号'; mult=1.65; desc='社区拆解口径：基础爆率提升50%-80%（KD≥1.8、赚损比≥2.0、撤离率≥65% 三线齐达才算），代价是强度同步抬高'; }
    else if (f >= 1.0) { tier='标准账号'; mult=1.0 + (f-1.0)*1.2; desc='享受标准爆率'; }
    else if (f >= 0.8) { tier='临界账号'; mult=0.86 + (f-0.8)*0.7; desc='略低于标准线，社区拆解口径未单列此档，按 0.5-1.0 区间低端取值'; }
    else if (f >= 0.5) { tier='低迷账号'; mult=0.60 + f*0.4; desc='社区拆解口径：基础爆率降低20%-40%'; }
    else               { tier='黑屋账号'; mult=CAL.blackSuppression; desc='社区拆解口径：压制70%以上（2026-04 后实测约 40%，本工具取 0.60 乘数）'; }
    desc += '｜本次折算 ×' + mult.toFixed(2);
    return { value:f, tier:tier, mult:mult, desc:desc, parts:{kd:sKD, pr:sPR, ev:sEV} };
  }

  /* 局内动态爆率系数（含搜索边际递减） */
  function raidCoef(avgTime, combat, search, evac, coop, yieldV){
    var c = 1.0, items = [];
    if (has(avgTime)){
      if (avgTime >= 20){ c += 0.30; items.push('存活≥20min +30%'); }
      else if (avgTime >= 15){ c += 0.20; items.push('存活≥15min +20%'); }
      else if (avgTime >= 10){ c += 0.10; items.push('存活≥10min +10%'); }
      else if (avgTime < 3){ c -= 0.30; items.push('3分钟内速死 -30%'); }
      else { c -= 0.15; items.push('存活不足3~10min -15%'); }
    }
    if (has(combat)){
      if (combat >= 80){ c += 0.15; items.push('击杀+有效伤害（高档）+15%'); }
      else if (combat >= 60){ c += 0.10; items.push('击杀+有效伤害 +10%'); }
      else if (combat < 40){ c -= 0.30; items.push('全程避战/仅摸外围 -20%~40%，取 -30%'); }
    }
    if (has(search)){
      var gain = 0.20 * (1 - Math.max(0, (search - 60)) / 60);
      if (search >= 55 && gain > 0.02){ c += gain; items.push('高值容器（大保险箱+20%/小保险箱+12%/航空箱+8%，此处取边际递减上限+20%）'); }
      else if (search < 40){ c -= 0.12; items.push('容器数不足/只摸保险 -12%，另按低值容器每10个-3%回吐'); }
    }
    if (has(evac)){
      if (evac >= 30 && evac <= 40){ c += 0.15; items.push('成功撤离 +15%'); }
      else if (evac < 15){ c -= 0.15; items.push('极少撤离 -15%'); }
    }
    if (coop && coop.level.indexOf('高') === 0){ c += 0.08; items.push('团队贡献/救助 +8%'); }
    if (has(yieldV) && yieldV > CAL.yieldHigh){ c -= 0.20; items.push('收益超基准（>5.5M/h）平账 -20%'); }
    return { value: clamp(c, 0.40, 1.90), items: items };
  }

  /* 战损补偿 */
  function lossCoef(perGameM, gearWan){
    if (!has(perGameM) || !has(gearWan) || gearWan <= 0) return { value:1.0, note:'缺战备或带出数据' };
    var ratio = (perGameM * 100) / gearWan;
    var v, note;
    if (ratio < 0.8){ v = 1.60; note = '持续亏损 → 优质战损补偿 +30%~80%'; }
    else if (ratio < 1.2){ v = 1.35; note = '小幅亏损 → 战损补偿'; }
    else if (ratio < 2){ v = 1.15; note = '基本打平 → 轻微补偿'; }
    else if (ratio < 4){ v = 1.00; note = '盈利 → 无战损补偿'; }
    else { v = 0.92; note = '高盈利 → 损耗远低于带出，触发收益平衡'; }
    return { value:v, ratio:ratio, note:note };
  }

  function quotaGate(yieldMh){
    if (!has(yieldMh)) return { value:1.0, note:'无时长或带出数据' };

  /* 日期格式化为 YYYY-MM-DD（本地时区），供赛季窗口比较 */
  function fmtDate(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  /* 赛季基准：本引擎全部阈值只在 S12 窗口内成立 */
  function seasonBasis(now){
    var S = CAL.season, t = fmtDate(now);
    var ok = (t >= S.s12Start) && (t <= S.endGuard);
    var reason = '';
    if (t < S.s12Start) reason = '当前日期早于 S12 起点 ' + S.s12Start + '，本模型口径不适用';
    else if (t > S.endGuard) reason = '已超出 S12 校准窗口 ' + S.endGuard + '，赛季可能已切换';
    return { code:S.code, name:S.name, start:S.s12Start, intlStart:S.s12IntlStart,
             endGuard:S.endGuard, today:t, ok:ok, reason:reason,
             label:'S12「' + S.name + '」' };
  }

  /* 赛季阶段系数。
     v4.5：移除已过期的二周年庆（2026-09-26~10-15）与群星守望事件项——
     二者均不在 S12 窗口内，继续计入会污染 S12 结论。S12 期间未检索到
     官方公布的活动级全局爆率加成，故事件系数恒为 1，仅保留赛季阶段修正。 */
  function eventCoef(now, phase){
    var e = 1.0, note = [];
    if (phase === 'early'){
      e *= 1.25;
      note.push('赛季初：校准权重偏大（社区口径；"隐藏分重置为上赛季 60%"无官方出处，仅作模型参数）');
    } else if (phase === 'late'){
      e *= 0.85;
      note.push('赛季末段：额度与爆率条长期消耗偏高');
    }
    var sb = seasonBasis(now);
    if (!sb.ok) note.push(sb.reason);
    return { value: e, note: note.join('；') || 'S12 窗口内无活动级加成' };
  }

  /* 战斗分反推（场均击杀 → 经验换算） */
  function deriveCombat(kd, evac){
    if (!has(kd) || !has(evac)) return null;
    var kpg = Math.max(0, (1 - evac/100) * kd);
    var est = clamp(pw(kpg, [[1,60],[2,80],[4,100]]), 0, 100);
    return { kpg:kpg, est: Math.round(est) };
  }

  /* 扰动稳健度：±8% 抖动重算，v6 按样本量自适应采样次数 */
  function stability(base, inputs, runOnce, N){
    var seed = 20260926;
    function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    function sevClass(k){
      if (k === 'dual' || k === 'pressure' || k === 'suppress') return 2;
      if (k === 'edge') return 1;
      if (k === 'unknown') return -1;
      return 0;
    }
    N = N || 80;
    var keys = Object.keys(inputs);
    var risks = new Array(N), flip = 0, key = sevClass(base.verdictKey), sum = 0;
    var jittered = {};
    for (var i = 0; i < N; i++){
      for (var ki = 0; ki < keys.length; ki++){
        var k = keys[ki], v = inputs[k];
        jittered[k] = (has(v) && v !== 0) ? v * (1 + (rnd() * 2 - 1) * 0.08) : v;
      }
      var r = runOnce(jittered, true);
      risks[i] = r.composite; sum += r.composite;
      if (sevClass(r.verdictKey) !== key) flip++;
    }
    risks.sort(function(a,b){ return a-b; });
    var mean = sum / N;
    var sd = 0;
    for (var j = 0; j < N; j++){ var dd = risks[j] - mean; sd += dd*dd; }
    sd = Math.sqrt(sd / N);
    var fr = flip / N;
    return { mean:mean, compositeMean:mean, sd:sd, lo:risks[Math.floor(N*0.025)], hi:risks[Math.min(N-1, Math.ceil(N*0.975)-1)],
      flipRate:fr, sev:key, N:N,
      grade: fr < 0.10 ? '高（判定对输入扰动不敏感）'
           : fr < 0.28 ? '中（输入小幅偏差可能改变结论档位）'
           : '低（结论高度依赖个别输入，建议补全数据后重测）' };
  }

  /* ---------- 权重（唯一定义处） ---------- */
  /* 权重按 2026-10 复核口径重标（v4.4，在 v4.3 基础上微调）：
     高压轴对齐「对局强度四维」——战备分 / 战斗活跃度分 / 长期赚损比 / 账号综合身价
       （社区拆解整理《收益、损耗与补偿的底层原理》2026-06-25）；
       另社区实测称匹配权重约「近10局70% + 赛季30%」（B站专栏2025-10-24，属定性参考），
       故近10局口径的战斗活跃度分（五维战斗）取最高权重，长期 KD 相应下调。
       v4.4：S11 官方口径明示匹配参考「近期 KD、场均击杀、助攻数、团队贡献」
       （排位规则优化公告 + 社区解读 2026-09/10），合作分（coop）权重由 0.02 上调至 0.04。
     低爆轴对齐「爆率四组成」——基础爆率 / 补偿爆率 / 正向分 / 用户画像，
       其中压制证据集中在收益侧（额度闸门 + 收益效率 + 赚损比 + 稳定盈利）与消极行为侧
       （速死、避战速撤、只摸保险），而非击杀本身。 */
  var RAW_P = { combat:0.24, kd:0.16, hit:0.12, prec:0.10, gear:0.10, profit:0.07,
                evac:0.05, kdOff:0.04, surv:0.03, time:0.03, wealth:0.02, coop:0.04,
                search:0.02, yld:0.02 };
  var RAW_D = { yld:0.24, profit:0.22, evac:0.16, time:0.10, search:0.06, coop:0.04,
                wealth:0.05, hit:0.03, combat:0.03, prec:0.02, surv:0.02, kd:0.01,
                gear:0.01, kdOff:0.01 };
  function norm(W){ var t = 0, k; for (k in W) t += W[k]; var o = {}; for (k in W) o[k] = W[k]/t; return o; }
  var WP = norm(RAW_P), WD = norm(RAW_D);
  var SUM_P = 0, SUM_D = 0;
  (function(){ for (var k in RAW_P){ SUM_P += RAW_P[k]; SUM_D += RAW_D[k]; } })();
  /* 覆盖率权重：两轴平均权重 */
  var COV_KEYS = ['profit','kd','evac','hit','prec','combat','search','time','yld','gear'];
  var COV_W = {}; (function(){ var t = 0;
    for (var i = 0; i < COV_KEYS.length; i++){ var k = COV_KEYS[i]; var w = (WP[k] + WD[k]) / 2; COV_W[k] = w; t += w; }
    for (var j = 0; j < COV_KEYS.length; j++) COV_W[COV_KEYS[j]] /= t;
  })();

  /* 轴聚合：均值分 + 平滑峰值 + 极端项托底
     ax: 'p' | 'd'（v6 修正：v4.1 用 W === WD 的对象身份判断取哪一轴，
     在留一法传入克隆权重对象时会静默退回 p 轴，导致归因失真） */
  function axisAgg(F, W, extra, ax){
    ax = ax || 'p';
    var sum = 0, wsum = 0, vals = [], per = {};
    for (var k in W){
      var f = F[k];
      if (!f) continue;
      var val = ax === 'd' ? f.d : f.p;
      if (!has(val)) continue;
      sum += val * W[k]; wsum += W[k]; vals.push(val); per[k] = { val: val, w: W[k] };
    }
    if (!wsum) return { mean:0, score:0, base:0, top:[], per:per, floored:false, consensus:0 };
    var mean = clamp(sum / wsum, 0, 100);
    vals.sort(function(a,b){ return b - a; });
    var t1 = vals[0], t2 = vals.length > 1 ? vals[1] : t1;
    var score = mean + 0.42 * Math.max(0, t1 - mean) + 0.12 * Math.max(0, t2 - mean);
    var floor = t1 >= 75 ? 58 + (t1 - 75) * 0.9 : 0;
    var beforeFloor = score;
    score = Math.max(score, floor);
    /* 共识加成：来源把「多项同向显著偏离」列为最强触发条件，
       均值+峰值折中仍会低估 3 项以上同时越线的情况 */
    var n55 = 0, n70 = 0;
    for (var vi = 0; vi < vals.length; vi++){ if (vals[vi] >= 55) n55++; if (vals[vi] >= 70) n70++; }
    var consensus = n70 >= 2 ? 9 : n55 >= 4 ? 8 : n55 >= 3 ? 5 : 0;
    return { mean: mean, base: score, consensus: consensus,
             score: clamp(score + consensus + (extra || 0), 0, 100),
             top: vals.slice(0,3), per: per, floored: floor > beforeFloor, n55:n55, n70:n70 };
  }

  /* 每轴「最优档」锚点：用于量化「这一项把本轴抬高了多少钱」 */
  var NEUTRAL = {};
  (function(){
    for (var k in SPEC){
      var a = SPEC[k].anchors, ip = 0, id = 0;
      for (var i = 1; i < a.length; i++){
        if (a[i][1] < a[ip][1]) ip = i;
        if (a[i][2] < a[id][2]) id = i;
      }
      NEUTRAL[k] = { xP: a[ip][0], p: a[ip][1], xD: a[id][0], d: a[id][2] };
    }
  })();

  /* 归因（v6）：同时给出两种口径
     lift = 把该项拉回本轴最优档后，本轴下降多少（可操作，主口径）
     loo  = 直接剔除该项（权重自动归一）后本轴下降多少（保守口径） */
  function attribute(F, W, score, extra, ax){
    var out = [];
    for (var k in W){
      if (!F[k]) continue;
      var val = ax === 'd' ? F[k].d : F[k].p;
      var sub = {}, i2; for (i2 in W) if (i2 !== k) sub[i2] = W[i2];
      var loo = clamp(score - axisAgg(F, sub, extra, ax).score, 0, 100);
      var lift = 0, nx = null;
      if (NEUTRAL[k]){
        var swapped = {}; for (i2 in F) swapped[i2] = F[i2];
        swapped[k] = { p: NEUTRAL[k].p, d: NEUTRAL[k].d, label: F[k].label, src: F[k].src };
        lift = clamp(score - axisAgg(swapped, W, extra, ax).score, 0, 100);
        nx = ax === 'd' ? NEUTRAL[k].xD : NEUTRAL[k].xP;
      }
      out.push({ key:k, name:FACTOR_NAME[k] || k, w: W[k], val: val, lift: lift, loo: loo, drop: lift,
                 neutralX: nx, label: F[k].label, src: F[k].src });
    }
    out.sort(function(a,b){ return (b.lift + b.loo*0.3) - (a.lift + a.loo*0.3); });

  }
  /* 留一法（保留供历史对比使用） */
  function leaveOne(F, W, scoreFull, extra, ax){

      if (!F[k]) continue;
      var sub = {}; for (var j in W) if (j !== k) sub[j] = W[j];
      var agg = axisAgg(F, sub, extra, ax);
      out.push({ key:k, name:FACTOR_NAME[k] || k, w: W[k], val: (ax === 'd' ? F[k].d : F[k].p),
                 drop: clamp(scoreFull - agg.score, 0, 100), lift: clamp(scoreFull - agg.score, 0, 100),
                 label: F[k].label, src: F[k].src });
    }
    out.sort(function(a,b){ return b.drop - a.drop; });

  }

  /* 判定严重度 */
  function sevOf(k){

    if (k === 'unknown') return -1;

  }

  /* ---------- 主流程 ---------- */
  function compute(data, opts){
    opts = opts || {};
    var light = !!opts.light;
    var now = opts.now || new Date();
    var mode = data.mainMode || 'secret';
    var dimCal = opts.dimCalibrated || data.dimCalibrated || {};

    /* 衍生量 */
    var avgTime = (has(data.playTime) && has(data.totalGames) && data.totalGames > 0) ? data.playTime / data.totalGames : null;
    var hours = has(data.playTime) ? data.playTime / 60 : null;
    var yieldMh = (has(data.extractValue) && has(hours) && hours > 0) ? data.extractValue / hours : null;
    var perGameM = (has(data.extractValue) && has(data.totalGames) && data.totalGames > 0) ? data.extractValue / data.totalGames : null;
    var lossG = (has(data.totalGames) && has(data.evacRate)) ? data.totalGames * (1 - data.evacRate/100) : null;
    var prCheck = (has(data.extractValue) && has(lossG) && lossG > 0.5) ? data.extractValue / lossG : null;
    var kdMain = mode === 'topsecret' ? data.kdTopSecret
              : mode === 'secret' ? data.kdSecret
              : (has(data.kdSecret) ? data.kdSecret : data.kdTopSecret);
    var kdOff  = mode === 'secret' ? data.kdTopSecret : data.kdSecret;
    var div = null;
    if (has(data.kdSecret) && has(data.kdTopSecret)){

      div = loK > 0 ? hiK/loK : (hiK > 0 ? 99 : 1);
    }
    /* 五维：未标定 → null（注意 dimCal 的键是短名 combat/wealth/...，

    var DIM_KEY = { dimCombat:'combat', dimWealth:'wealth', dimSearch:'search', dimCoop:'coop', dimSurvival:'survival' };
    function dimOf(id){
      var v = data[id];
      return dimCal[DIM_KEY[id]] === true ? v : null;
    }
    var D = {
      combat: dimOf('dimCombat'), wealth: dimOf('dimWealth'), search: dimOf('dimSearch'),
      coop: dimOf('dimCoop'), survival: dimOf('dimSurvival')
    };
    var dimCalibratedCount = 0;
    for (var dk in D) if (has(D[dk])) dimCalibratedCount++;

    /* 因子 */
    var F = {
      profit: fProfit(data.profitRatio), kd: fKD(kdMain), kdOff: fKD(kdOff),
      evac: fEvac(data.evacRate), hit: fHit(data.hitRate), prec: fPrec(data.precisionRate),
      combat: fCombat(D.combat), wealth: fWealth(D.wealth), search: fSearch(D.search),
      surv: fSurv(D.survival), time: fTime(avgTime), yld: fYld(yieldMh), gear: fGear(data.gearValue)
    };
    F.coop = fCoop(data.totalGames, data.rescueCount, data.teammateValue, data.extractValue, data.squadType);

    /* 三维同向偏离 */
    var co = coDirectional({ search:D.search, combat:D.combat, survival:D.survival });

    /* 两轴聚合（先把 co / 连坐 / 波动的加成分量带进去） */
    var extraP = 0, extraD = 0;

    /* 硬触发 */
    var triggers = [];
    if (has(perGameM) && perGameM > CAL.singleGameBlack){
      extraP += 8; extraD += 8;
      triggers.push('场均带出 ' + (perGameM*100).toFixed(0) + ' 万，超过 600 万临时黑屋线');
    } else if (has(perGameM) && perGameM > CAL.singleGameLoose){
      triggers.push('场均带出 ' + (perGameM*100).toFixed(0) + ' 万，社区另有「超100万即进强度黑屋」说法（属定性参考，未计入评分）');
    }
    if (has(div) && div > 3){
      extraP += 7; triggers.push('机密/绝密战损比相差 ' + div.toFixed(1) + ' 倍（>3 倍），单排进入随机分配池');
    }
    if (has(data.hitRate) && data.hitRate > 55 && has(data.precisionRate) && data.precisionRate > 60){

    }
    if (has(data.evacRate) && data.evacRate > 40 && has(avgTime) && avgTime >= 15){
      extraP += 5; extraD += 4;
      triggers.push('撤离率 ' + data.evacRate.toFixed(0) + '% 且存活充足，三连撤触发检测局概率上升');
    }
    if (has(avgTime) && avgTime < 10){
      extraD += 8; triggers.push('平均每局 ' + avgTime.toFixed(1) + ' 分钟低于 10 分钟存活线，符合「连续3局存活<10分钟」消极判定');
    }
    if (has(data.evacRate) && data.evacRate >= 80){
      extraD += 6; triggers.push('撤离率稳定 80%+ 是社区明示的「高收益玩家」判据之一');
    }
    if (data.recentGames === 'up'){
      extraP += 4; extraD += 4; triggers.push('近 10 局数据突然变好——来源明示短期大幅波动会记录在案');
    } else if (data.recentGames === 'down'){
      extraD += 3; triggers.push('近 10 局数据突然变差（连败/速死增多），易触发消极与补偿双向标记');
    }
    var sq = CAL.squad[data.squadType] || CAL.squad.solo;
    if (data.squadType === 'duo' || data.squadType === 'trio'){

    var loss = lossCoef(perGameM, data.gearValue);
    var qg = quotaGate(yieldMh);

    var core = (Wc.base*fbase.mult + Wc.raid*raid.value + Wc.loss*loss.value + Wc.event*ev.value) / (Wc.base + Wc.raid + Wc.loss + Wc.event);
    var label = detectLabel(data, kdMain, avgTime, D);
    var labelGate = { '稳健均衡':1.00, '猛攻攻坚':1.08, '潜行跑刀':0.72, '消极型':0.66, '数据异常/神人局倾向':0.90 };

      else checks.push({ lv:'ok', text:'战斗分反推值 ' + dc.est + '（场均击杀 ' + dc.kpg.toFixed(2) + '），与标定值一致（差 ' + gap.toFixed(0) + ' 分）' });

      else checks.push({ lv:'ok', text:'赚损比口径自洽（推算值 ' + prCheck.toFixed(2) + 'M，偏差 ' + (dev*100).toFixed(0) + '%）' });
    }
    if (has(avgTime)){
      if (avgTime > 60) checks.push({ lv:'warn', text:'每局 ' + avgTime.toFixed(1) + ' 分钟明显超出常规对局长度，请确认「游戏时长」是否包含大厅与匹配等待时间' });
      else if (avgTime < 3) checks.push({ lv:'warn', text:'每局仅 ' + avgTime.toFixed(1) + ' 分钟，多为速死；此时时长口径直接决定消极判定，建议核对' });
      else checks.push({ lv:'ok', text:'每局时长 ' + avgTime.toFixed(1) + ' 分钟处于合理区间（3–60 分钟）' });
    }
    if (has(data.teammateValue) && has(data.extractValue) && data.teammateValue > data.extractValue)
      checks.push({ lv:'warn', text:'带出队友价值（' + data.teammateValue + 'M）大于本人累计带出（' + data.extractValue + 'M），口径可能有误' });
    if (has(data.totalReward) && has(data.extractValue) && data.totalReward > data.extractValue * 3)
      checks.push({ lv:'warn', text:'累计行动报酬远大于带出价值，说明大量收益留在仓库未带出，收益效率按「带出」计算会更低' });
    }

    /* 体感一致性（不进评分） */
    var feel = data.feltExperience || 'normal';
    var feelNote = null;
    if (!light){
    if (sev === 0 && (feel === 'worse' || feel === 'both' || feel === 'hard'))
      feelNote = '算法判为正常池，但体感' + (feel==='worse'?'明显不出货':feel==='hard'?'对手明显变强':'既不出货又被打压') + '。常见解释按可能性排序：① 当日额度已耗尽（每日 0 点重置）；② 该模式爆率条消耗完，换模式即可验证；③ 纯随机波动（红品 0.35% 下，连续 200 局不出红的概率约 50%）。建议走「可证伪自查」三步再定论。';
    else if (sev >= 2 && feel === 'normal')
      feelNote = '算法判为黑屋画像，但体感与平时一致。可能是数据口径问题（尤其赚损比与收益效率），也可能确实仍在正常池内——两轴分数虽高但未同步体现在出货上。以实际体验为准。';
    else if (sev >= 1 && (feel === 'worse' || feel === 'both'))
      feelNote = '体感与算法判定方向一致（数据特征与出货感受同时指向低爆），结论可信度提高。';
    else if (sev >= 1 && feel === 'better')
      feelNote = '体感反而变好，与数据特征相反。若近期活动加成生效（当前事件系数 ×' + ev.value.toFixed(2) + '），这是最可能的解释。';
    }

    var seEvac = (n > 0 && has(data.evacRate)) ? Math.sqrt((data.evacRate/100)*(1-data.evacRate/100)/n)*100 : null;
    var sb = seasonBasis(now);

    var out = {
      version:'v4.5', engine:'v8.6',
      seasonBasis: sb,
      pressure: Math.round(pressure), suppress: Math.round(suppress), composite: Math.round(composite),
      verdictKey: vKey, verdict: vName, pool: pool, poolTone: poolTone, sev: sev,
      thresholds: TH, trust: trust, coverage: coverage, sampleF: sampleF,
      axP: axP, axD: axD, co: co, triggers: triggers, checks: checks, feelNote: feelNote,
      obsRisk: obsRisk, F: F, D: D, dimCalibratedCount: dimCalibratedCount,
      fbase: fbase, raid: raid, loss: loss, quota: qg, event: ev, label: label, squad: sq,
      mode: mm, mainModeKey: mode,
      derived: { avgTime:avgTime, yieldMh:yieldMh, perGameM:perGameM, prCheck:prCheck,
                 kdMain:kdMain, kdOff:kdOff, div:div, combatEst:dc, seEvac:seEvac, n:n, hours:hours },
      drop: { mode: mm, finalMult: finalMult, core: core, red: red, gold: gold,
              redCapped: redRaw > CAL.redCap, goldCapped: goldRaw > CAL.goldCap,
              iridescent: CAL.IRIDESCENT }
    };

    /* 归因：仅完整分析计算，扰动重算时跳过 */
    out.attrP = light ? [] : attribute(F, WP, out.pressure, extraP, 'p');
    out.attrD = light ? [] : attribute(F, WD, out.suppress, extraD, 'd');

    if (!light){
      var N = coverage > 0.8 && n >= 100 ? 120 : coverage < 0.6 ? 50 : 80;
      out.stability = stability(out, pickInputs(data), function(j){ return compute(j, { light:true, now:now, dimCalibrated:dimCal }); }, N);
      if (coverage < 0.7) out.stability.grade = '低（输入覆盖率仅 ' + Math.round(coverage*100) + '%，缺失项过多）';
      out.modes = analyzeAllModes(data, now, dimCal);
      var tg = sev >= 1 ? solveTargets(out, data, now, dimCal) : { list: [], none: false };
    out.targets = tg.list; out.targetsNone = tg.none;
      out.advices = generateAdvice(out, data);
      out.trust_notes = buildTrust(out, data);
      out.chart = buildChart(out);
      out.headline = buildHeadline(out);
    }
    return out;
  }

  function pickInputs(d){
    var keys = ['profitRatio','extractValue','totalReward','totalGames','playTime','kdSecret','kdTopSecret',
                'hitRate','precisionRate','evacRate','teammateValue','rescueCount','gearValue'];
    var o = { mainMode:d.mainMode, seasonPhase:d.seasonPhase, squadType:d.squadType,
              recentGames:d.recentGames, feltExperience:d.feltExperience };
    for (var i = 0; i < keys.length; i++) o[keys[i]] = d[keys[i]];
    ['dimCombat','dimWealth','dimSearch','dimCoop','dimSurvival'].forEach(function(k){ o[k] = d[k]; });
    return o;
  }

  /* 对局标签（cls 与展示层样式类严格对应） */
  function detectLabel(d, kd, avgTime, D){
    var ag = (has(D.combat) && D.combat >= 75) || (has(kd) && kd >= 2.0) ||
             (has(d.hitRate) && d.hitRate >= 40 && has(d.precisionRate) && d.precisionRate >= 50);
    var sk = (has(d.evacRate) && d.evacRate >= 60) || (has(avgTime) && avgTime <= 10) ||
             (has(D.combat) && D.combat <= 45 && has(D.search) && D.search >= 80);
    var pa = (has(avgTime) && avgTime < 10) && (has(D.combat) && D.combat < 40);
    var an = (has(d.hitRate) && d.hitRate < 20) ||
             (has(d.evacRate) && d.evacRate < 12 && has(D.combat) && D.combat < 45) ||
             (has(d.precisionRate) && d.precisionRate > 60);
    if (an) return { name:'数据异常/神人局倾向', tone:'danger',
      eff:'命中率、精准击败率或撤离率落在正常值以外，来源明示会进入「神人局」——对手强度随机、人机增强。' };
    if (pa) return { name:'消极型', tone:'danger',
      eff:'被判消极对局：强制匹配高战斗分满编队，基础系数降低30%以上，且补偿局门槛提高。' };
    if (ag) return { name:'猛攻攻坚', tone:'ok',
      eff:'猛攻型标签：保险箱与高级容器爆率上调，但对局强度与举报概率同步上升，易入高压池。' };
    if (sk) return { name:'潜行跑刀', tone:'warn',
      eff:'潜行搜刮型标签：大红基础爆率下调20%-40%，被划入限流搜刮池。' };
    return { name:'稳健均衡', tone:'ok',
      eff:'均衡标签（KD 0.5-1、撤离率20%-35%）为当前版本爆率最优画像，匹配池跨度正常。' };
  }

  /* 三模式定向拆解 */
  function analyzeAllModes(data, now, dimCal){
    var keys = ['normal','secret','topsecret'];
    return keys.map(function(k){
      var d = pickInputs(data); d.mainMode = k;
      var r = compute(d, { light:true, now:now, dimCalibrated:dimCal });
      var mm = CAL.mode[k];
      return { key:k, name:mm.name, isMain:k === data.mainMode, kd:r.derived.kdMain,
               pressure:r.pressure, suppress:r.suppress, composite:r.composite,
               verdict:r.verdict, verdictKey:r.verdictKey, pool:r.pool, tone:r.poolTone,
               fbase:r.fbase.value, mult:r.drop.finalMult, red:r.drop.red, gold:r.drop.gold,
               redR:Math.round(r.drop.red*1000)/1000, goldR:Math.round(r.drop.gold*1000)/1000,
               redBase:mm.red, capped:r.drop.redCapped };
    });
  }

  /* 解锁目标反解：单变量二分，找把判定降档所需的最小改动 */
  var TARGET_CAND = [
    { k:'evacRate',  lo:2,   hi:95,  name:'撤离率',    unit:'%', fmt:1 },
    { k:'profitRatio', lo:0.2, hi:6,  name:'赚损比',    unit:'M', fmt:2 },
    { k:'kdSecret',  lo:0.2,  hi:8,   name:'机密战损比', unit:'',  fmt:2 },
    { k:'kdTopSecret', lo:0.2, hi:8,  name:'绝密战损比', unit:'',  fmt:2 },
    { k:'hitRate',   lo:5,    hi:80,  name:'命中率',    unit:'%', fmt:1 },
    { k:'precisionRate', lo:3, hi:85, name:'精准击败率', unit:'%', fmt:1 },
    { k:'gearValue', lo:1,    hi:320, name:'入场战备',  unit:'万', fmt:0 },
    { k:'extractValue', lo:1, hi:2000, name:'带出价值', unit:'M', fmt:1, note:'代表收益节奏：少带出或转存仓库不即时领取' },
    { k:'playTime',  lo:60,   hi:40000, name:'在线时长', unit:'分', fmt:0, note:'同产出下拉长在线时长＝摊薄收益效率' },
    { k:'dimCombat', lo:5,    hi:100, name:'战斗五维',  unit:'分', fmt:0, dim:true },
    { k:'dimSearch', lo:5,    hi:100, name:'搜索五维',  unit:'分', fmt:0, dim:true },
    { k:'dimSurvival', lo:5,  hi:100, name:'生存五维', unit:'分', fmt:0, dim:true }
  ];
  function solveTargets(out, data, now, dimCal){
    var wantSev = out.sev >= 2 ? 1 : 0;
    var res = [];
    /* 候选表是模块级共享对象，必须先清空上一轮的极限解缓存 */
    for (var cl = 0; cl < TARGET_CAND.length; cl++) TARGET_CAND[cl].partial = null;
    var base = pickInputs(data);
    function runWith(k, v){
      var d = {}; for (var j in base) d[j] = base[j];
      d[k] = v;
      if (TARGET_CAND.some(function(cc){ return cc.k === k && cc.dim; })){
        var dc2 = {}; for (var q in dimCal) dc2[q] = dimCal[q];
        var map = { dimCombat:'combat', dimSearch:'search', dimSurvival:'survival', dimWealth:'wealth', dimCoop:'coop' };
        dc2[map[k]] = true;
        return compute(d, { light:true, now:now, dimCalibrated:dc2 });
      }
      return compute(d, { light:true, now:now, dimCalibrated:dimCal });
    }
    for (var i = 0; i < TARGET_CAND.length; i++){
      var c = TARGET_CAND[i];
      var cur = base[c.k];
      if (!has(cur)) continue;
      if (c.dim && dimCal[{dimCombat:'combat',dimSearch:'search',dimSurvival:'survival'}[c.k]] !== true) continue;
      if (c.dim && !has(base[c.k])) continue;
      var best = null;
      for (var dir = 0; dir < 2; dir++){
        var to = dir === 0 ? c.lo : c.hi;
        var rEnd = runWith(c.k, to);
        if (!(sevOf(rEnd.verdictKey) <= wantSev || rEnd.composite <= out.composite - 8)){
          /* 不能降档：退回网格扫描，找该方向上的最优极限效果（避免给出荒谬的端点值） */
          for (var gi = 1; gi <= 6; gi++){
            var gv = cur + (to - cur) * (gi / 6);
            var rg = runWith(c.k, gv);
            var g2 = out.composite - rg.composite;
            if (g2 > 2 && (!c.partial || g2 > c.partial.gain))
              c.partial = { key:c.k, name:c.name, unit:c.unit, fmt:c.fmt, from:cur, to:gv, note:c.note || '',
                            dir: gv > cur ? 'up' : 'down', toVerdict: rg.verdict, toComposite: rg.composite,
                            gain: g2, partial: true };
          }
          continue;
        }
        var a = cur, b = to;
        for (var it = 0; it < 16; it++){
          var m = (a + b) / 2;
          var rm = runWith(c.k, m);
          var ok = sevOf(rm.verdictKey) <= wantSev || rm.composite <= out.composite - 8;
          if (ok) b = m; else a = m;
        }
        var rr = runWith(c.k, b);
        var change = Math.abs(b - cur);
        var rel = change / Math.max(1e-6, Math.abs(cur));
        if (!best || rel < best.rel)
          best = { key:c.k, name:c.name, unit:c.unit, fmt:c.fmt, from:cur, to:b, rel:rel,
                   dir: b > cur ? 'up' : 'down', toSev: sevOf(rr.verdictKey), toVerdict: rr.verdict,
                   toComposite: rr.composite, gain: out.composite - rr.composite, axis: out.suppress >= out.pressure ? 'd' : 'p' };
      }
      if (best && isFinite(best.rel)) res.push(best);
      else if (c.partial){
        var pr = c.partial;
        pr.rel = Math.abs(pr.to - cur) / Math.max(1e-6, Math.abs(cur));
        res.push(pr);
      }
    }
    var full = res.filter(function(x){ return !x.partial; });
    full.sort(function(x,y){ return x.rel - y.rel; });
    if (full.length) return { list: full.slice(0, 5), none: false };
    res.sort(function(x,y){ return y.gain - x.gain; });
    return { list: res.slice(0, 4), none: true };
  }

  /* 图表：两轴并列 */
  var CHART = [
    { name:'战损比KD', key:'kd', axis:'p' },   { name:'战斗分', key:'combat', axis:'p' },
    { name:'命中率', key:'hit', axis:'p' },    { name:'精准击败', key:'prec', axis:'p' },
    { name:'入场战备', key:'gear', axis:'p' }, { name:'次模式KD', key:'kdOff', axis:'p' },
    { name:'撤离率', key:'evac', axis:'d' },   { name:'赚损比', key:'profit', axis:'d' },
    { name:'收益效率', key:'yld', axis:'d' },  { name:'搜索分', key:'search', axis:'d' },
    { name:'每局时长', key:'time', axis:'d' }, { name:'财富分', key:'wealth', axis:'d' }
  ];
  function buildChart(r){
    var rows = [];
    for (var i = 0; i < CHART.length; i++){
      var it = CHART[i], f = r.F[it.key];
      if (!f) continue;
      var raw = (it.axis === 'p' ? RAW_P : RAW_D)[it.key] || 0;
      var pct = Math.round(raw / (it.axis === 'p' ? SUM_P : SUM_D) * 100);
      rows.push({ name: it.name, value: Math.round(it.axis === 'p' ? f.p : f.d),
                  weight: pct + '%', axis: it.axis === 'p' ? '高压' : '低爆' });
    }
    return rows;
  }

  /* 一句话结论 */
  function buildHeadline(r){
    var a = (r.suppress >= r.pressure ? r.attrD : r.attrP)[0];
    var axName = r.suppress >= r.pressure ? '低爆轴' : '高压轴';
    var bits = [];
    bits.push(r.verdict);
    bits.push('综合 ' + r.composite + ' 分（阈值 ' + r.thresholds.hi.toFixed(0) + '）');
    if (a) bits.push('主因 ' + a.name + ' ' + Math.round(a.val) + ' 分' + (a.lift > 2 ? '（拉回最优档可降 ' + Math.round(a.lift) + ' 分）' : '（单项都不致命，属多项同时偏高）'));
    if (r.triggers.length) bits.push('硬触发 ' + r.triggers.length + ' 条');
    return { text: bits.join(' · '), axis: axName, top: a || null };
  }

  /* 可信度 */
  function buildTrust(r, d){
    var t = [];
    if (!has(d.totalGames) || d.totalGames < CAL.minGames)
      t.push({ lv:'warn', text:'场次 ' + (has(d.totalGames) ? d.totalGames : '未填') + ' 局 < ' + CAL.minGames + ' 局：赛季初或样本过少时 KD/赚损比易虚高，判定阈值已自动上浮至 ' + r.thresholds.hi.toFixed(0) + ' 分（基准 58）' });
    else t.push({ lv:'ok', text:'样本 ' + r.derived.n + ' 局已达可信线，阈值取基准值 ' + r.thresholds.hi.toFixed(0) + ' 分' });
    if (has(r.derived.seEvac))
      t.push({ lv:'info', text:'撤离率抽样标准误约 ±' + r.derived.seEvac.toFixed(1) + ' 个百分点（n=' + r.derived.n + '），小于该幅度的差异不构成判定依据' });
    var missing = [];
    for (var i = 0; i < COV_KEYS.length; i++){ if (!r.F[COV_KEYS[i]]) missing.push(FACTOR_NAME[COV_KEYS[i]]); }
    if (missing.length) t.push({ lv:'warn', text:'未纳入的因子：' + missing.join('、') + '（缺时长/场次会连带影响每局时长与收益效率）。缺失项已从两轴权重剔除并按剩余权重归一，当前加权覆盖率 ' + Math.round(r.coverage*100) + '%' });
    if (r.dimCalibratedCount < 5)
      t.push({ lv:'info', text:'五维仅标定 ' + r.dimCalibratedCount + '/5 项，未标定项按「不参与评分」处理（v4.1 会把默认 50 当观测值，v6 已修正）' });
    if (r.stability)
      t.push({ lv:'info', text:'扰动稳健度' + r.stability.grade + '：对全部输入施加 ±8% 随机抖动重算 ' + r.stability.N + ' 次，综合分 ' +
        r.stability.compositeMean.toFixed(1) + ' ± ' + r.stability.sd.toFixed(1) + '，95% 区间 [' + r.stability.lo.toFixed(0) + ', ' + r.stability.hi.toFixed(0) + ']，档位翻转率 ' + (r.stability.flipRate*100).toFixed(0) + '%' });
    t.push({ lv:'info', text:'未建模的模型权重项：活跃天数、赛季任务完成度、单局击杀明细、连续撤离/速死记录、当日累计收益、机器码与外设状态' });
    return t;
  }

  /* 建议 */
  function generateAdvice(r, d){
    var risks = [], tips = [];
    var F = r.F, dv = r.derived;
    function drv(arr){ var a = arr[0]; return a && a.lift > 3 ? a : null; }
    var dp = drv(r.attrP), dd = drv(r.attrD);
    if (dp) risks.push('高压轴第一驱动项是<b>' + dp.name + '</b>（' + dp.label + '，轴内 ' + Math.round(dp.val) + '/100，权重 ' + Math.round(dp.w*100) + '%）。把它拉回本轴最优档，高压轴可下降约 ' + Math.round(dp.lift) + ' 分（完全剔除则降 ' + Math.round(dp.loo) + ' 分）。');
    if (dd) risks.push('低爆轴第一驱动项是<b>' + dd.name + '</b>（' + dd.label + '，轴内 ' + Math.round(dd.val) + '/100，权重 ' + Math.round(dd.w*100) + '%）。把它拉回本轴最优档，低爆轴可下降约 ' + Math.round(dd.lift) + ' 分（完全剔除则降 ' + Math.round(dd.loo) + ' 分）。');
    if (r.co.boost >= 14) risks.push('搜·打·撤三项同向偏离（' + r.co.state + '）——来源明示的最强触发条件，两轴同时抬升。');
    if (r.co.state.indexOf('仅部分') === 0) risks.push('三维不同向（' + r.co.state + '）：单轴偏离通常只对应限流池或高压池之一，与「双重黑屋」要区分开。');
    if (r.fbase.value < 1.0) risks.push('F_base ' + r.fbase.value.toFixed(2) + '（' + r.fbase.tier + '）：' + r.fbase.desc);
    for (var i = 0; i < r.triggers.length; i++) risks.push('硬触发：' + r.triggers[i]);
    if (has(dv.perGameM) && r.loss.ratio != null && r.loss.ratio >= 4)
      risks.push('战损比失衡：场均带出/入场战备 = ' + r.loss.ratio.toFixed(1) + '，损耗远低于带出会触发收益平衡。');
    if (r.label.name === '数据异常/神人局倾向' || r.label.name === '消极型')
      risks.push('当前画像被归入<b>' + r.label.name + '</b>标签池：' + r.label.eff);

    /* 定向解锁目标 */
    if (r.targets && r.targets.length && !r.targetsNone){
      var want = r.sev >= 2 ? '把判定降到边缘档' : '把判定降入正常档';
      var ts = r.targets.map(function(t){
        return '「<span class="tgt">' + t.name + ' ' + t.from.toFixed(t.fmt) + (t.unit||'') + ' → ' + t.to.toFixed(t.fmt) + (t.unit||'') + '</span>」（变动 ' + Math.round(t.rel*100) + '%，综合分 −' + Math.round(t.gain) + '）';
      });
      tips.push('单变量降档方案（其余条件不变，按改动幅度从小到大）：' + ts.join('；') + '。这些是<b>' + want + '</b>所需的最小改动，实际只需选一条最可执行的去做。');
    } else if (r.targets && r.targets.length && r.targetsNone){
      var ps = r.targets.map(function(t){
        return '「<span class="tgt">' + t.name + ' ' + t.from.toFixed(t.fmt) + (t.unit||'') + ' → ' + t.to.toFixed(t.fmt) + (t.unit||'') + '</span>」最多降 ' + Math.round(t.gain) + ' 分' + (t.note ? '（' + t.note + '）' : '');
      });
      tips.push('<b>没有任何单一变量能把判定拉出当前档位</b>——这说明画像上是多项同时越线，而不是某一个数据点的问题。各单项的极限效果：' + ps.join('；') + '。要降档必须组合调整（通常同时压低收益效率 + 击杀强度 + 拉长单局时长），或直接停手等额度与爆率条重置（每日 0 点）。');
    }
    if (r.verdictKey === 'normal' || r.verdictKey === 'compensate')
      tips.push('当前画像健康。维持 KD 0.5–1、撤离率 25%–33% 即为本版本爆率最优的「均衡标签」，不建议刻意压数据——S6 后空装送头、消极养号已不再提升爆率，反而易判消极。');
    if (r.pressure >= r.thresholds.mid)
      tips.push('降高压轴：单局击杀 ≤1、不追「势如破竹」；遇人机避免爆头（射脚部压低精准击败率）。来源提示战斗分权重高于 KD——KD 3.0 但战斗分 40 仍可能匹到低压局，重点是少打少杀而非只控 KD。');
    if (r.suppress >= r.thresholds.mid)
      tips.push('降低爆轴：把搜刮的高价物资上架交易行而非即时领取邮件哈夫币；同时提高入场消耗（高价房卡/弹药）把赚损比拉回 0.8–1.5M，把收益效率压回 4.5 M/h 以内。');
    if (r.loss.value <= 1.0 && r.composite > r.thresholds.mid)
      tips.push('制造优质战损：带高价值装备正常交战后阵亡（非自雷、非空装），补偿爆率 +30%~80%；连续 3 局优质战损后第 4 局触发补偿局，红品临时升至 2.5%~3.2%。劣质战损（自雷/空装送头）仅 +5%~15%。');
    if (has(dv.avgTime) && dv.avgTime < 13)
      tips.push('把单局拉长到 15 分钟以上再撤：存活≥15min +20%、≥20min +30%，同时摆脱消极标记（解除需连续15局每局≥30分钟且累计10次撤离）。');
    if (r.label.name === '潜行跑刀' || r.label.name === '消极型')
      tips.push('每局搜索≥15个容器（含工具箱/手提袋等低值容器，避免只摸保险）、完成至少 1 个局内任务并造成有效伤害，把画像改回「稳健均衡」。');
    if (d.squadType === 'trio' || d.squadType === 'duo')
      tips.push('组队连坐：你被按队内<b>最高</b>隐藏分匹配。想要低压局就换单排，或固定与数据低于自己的队友组队；三排全局爆率再降 18%，出货优先单排/双排。');
